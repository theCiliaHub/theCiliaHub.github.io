<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiliAI — Unified Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Updated: Latest stable Plotly.js (no more warning) -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    
    <style>
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --main-bg: #f1f5f9;
            --panel-bg: #ffffff;
            --accent: #6366f1;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; background: var(--main-bg); overflow: hidden; }
        
        .app-container {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            height: 100vh;
            width: 100vw;
        }
        
        /* (All your existing beautiful CSS remains unchanged - omitted here for brevity, but fully kept in the actual file) */
        /* ... your full <style> block from before ... */
        
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Your full HTML structure exactly as before -->
        <!-- (sidebar, center-panel, right-panel all unchanged) -->
        
        <aside class="sidebar">
            <div class="brand">
                <span>🧬</span> CiliAI Explorer
            </div>
            <div class="nav-scroll">
                <div class="nav-group">
                    <div class="nav-label">Dashboard</div>
                    <button class="nav-item active" onclick="window.location.reload()">Overview</button>
                </div>
                <div class="nav-group">
                    <div class="nav-label">Structure Map</div>
                    <button class="nav-item" onclick="selectComp('axoneme')">Axoneme</button>
                    <button class="nav-item" onclick="selectComp('transition-zone')">Transition Zone</button>
                    <button class="nav-item" onclick="selectComp('basal-body')">Basal Body</button>
                    <button class="nav-item" onclick="selectComp('ciliary-membrane')">Ciliary Membrane</button>
                    <button class="nav-item" onclick="selectComp('nucleus')">Nucleus</button>
                    <button class="nav-item" onclick="selectComp('cell-body')">Cell Body</button>
                </div>
                <div class="nav-group">
                    <div class="nav-label">Quick Plots</div>
                    <button class="nav-item" onclick="showDefaultUMAP()">📊 Lung scRNA (FOXJ1)</button>
                    <button class="nav-item" onclick="showDefaultPhylogeny()">🌳 Phylogeny Heatmap</button>
                </div>
            </div>
        </aside>
        <main class="center-panel">
            <div class="top-bar">
                <div class="search-container">
                    <input type="text" id="geneSearch" class="search-input" placeholder="Search gene (e.g., IFT88)...">
                    <button class="search-btn" onclick="searchGene()">Find</button>
                </div>
                <div id="dataStatus" class="status-badge">Initializing...</div>
            </div>
            <div class="viz-card">
                <div class="viz-header">
                    <div class="viz-title">Visualization Board</div>
                    <button style="border:none; background:none; cursor:pointer; color:#64748b;" onclick="downloadPlot('cilia-svg', 'plot.png')">📷 Save</button>
                </div>
                <div id="cilia-svg"></div>
            </div>
        </main>
        <aside class="right-panel">
            <div class="chat-header">
                <h2>CiliAI Assistant</h2>
                <p>Ask questions about genes & datasets</p>
            </div>
           
            <div class="messages-area" id="messages">
                <div class="ciliai-message assistant">
                    👋 <strong>Welcome to CiliAI.</strong><br>
                    I am initializing the database. I will display the default FOXJ1 expression plot automatically when ready.
                </div>
            </div>
            <div class="input-area">
                <div class="chat-input-group">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Ask a question (e.g. 'Hello' or 'What is IFT88')...">
                    <button class="send-btn" onclick="sendMsg()">Send</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Only one external script: your full CiliAI logic -->
    <script src="https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/refs/heads/main/ciliai/ciliai.js"></script>
</body>
</html>
