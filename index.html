<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiliAI — Unified Explorer</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="ciliai/ciliai_ui.css"> 
    <link rel="stylesheet" href="styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js" defer></script>
    <script src="https://unpkg.com/@upsetjs/bundle" defer></script>
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js" defer></script>

    <style>
        /* Basic Layout Scaffold to ensure panels sit side-by-side 
           (If not already covered by ciliai_ui.css) */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent full page scroll, let panels scroll */
            font-family: 'Inter', sans-serif;
        }
        
        /* The Main App Container */
        #ciliai-app {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* Sidebar Container */
        #sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #1e293b; /* Dark sidebar background */
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }

        /* Left Panel (Chat/Search) */
        #left-panel {
            width: 380px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e2e8f0;
            background: white;
            padding: 15px;
            overflow-y: auto;
        }

        /* Right Panel (Gene Cards/Plots) */
        #right-panel {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Tooltip placeholders */
        .tooltip {
            position: absolute;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="ciliai-app">
        <aside id="sidebar">
            </aside>

        <section id="left-panel">
            </section>

        <main id="right-panel">
            <div id="dataStatus" style="margin-bottom: 10px; font-size: 12px; color: #666;">Initializing...</div>
        </main>
    </div>

    <div id="enrichment-tooltip" class="tooltip"></div>
    <div id="multi-dim-tooltip" class="tooltip"></div>

    <script src="ciliai/ciliai.js" defer></script>

    <script src="ciliai/ciliai_ui.js" defer></script>

    <script src="globals.js" defer></script>
    <script src="script.js" defer></script>
    <script src="plots.js" defer></script>

</body>
</html>
