<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiliAI — Unified Explorer</title>
    
    <!-- Favicon (fixed 404) -->
    <link rel="icon" href="https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/main/CiliaHub_Logo_web.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Latest stable Plotly — no deprecation warning -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <style>
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --main-bg: #f1f5f9;
            --panel-bg: #ffffff;
            --accent: #6366f1;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; background: var(--main-bg); overflow: hidden; }

        .app-container {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            height: 100vh;
            width: 100vw;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e293b;
        }
        .brand {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #1e293b;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand img { height: 32px; width: auto; border-radius: 6px; }
        .brand span { color: var(--accent); }

        .nav-scroll { flex: 1; overflow-y: auto; padding: 20px; }
        .nav-group { margin-bottom: 25px; }
        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--sidebar-text);
.            cursor: pointer;
            text-align: left;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-item:hover { background: #1e293b; color: white; }
        .nav-item.active { background: var(--accent); color: white; }

        /* CENTER PANEL */
        .center-panel {
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            height: 40px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 600px;
        }
        .search-input {
            flex: 1;
            padding: 0 15px;
            border-radius: 8px;
            height: 40px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-size: 14px;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-btn {
            padding: 0 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
        }
        .status-badge {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #e2e8f0;
            color: #64748b;
            font-weight: 500;
        }
        .status-badge.ready { background: #dcfce7; color: #166534; }

        .viz-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .viz-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .viz-title { font-size: 15px; font-weight: 600; color: #1e293b; }
        #cilia-svg { flex: 1; width: 100%; height: 100%; position: relative; }

        /* RIGHT CHAT PANEL */
        .right-panel {
        display: flex;
        flex-direction: column;
        }
        .chat-header,
        .input-area {
        flex-shrink: 0;
        }
        .messages-area {
        flex: 1;
        background: #f8fafc;    
        overflow-y: auto;
        }
        .ciliai-message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }
        .ciliai-message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ciliai-message.assistant {
            align-self: flex-start;
            background: white;
            border: 1px solid var(--border);
            color: #334155;
            border-bottom-left-radius: 2px;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid var(--border);
            background: white;
        }
        .chat-input-group { display: flex; gap: 10px; }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        .send-btn {
            padding: 0 15px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--accent);
        }
        .send-btn:hover { background: #f8fafc; }

        /* Cilia diagram interaction styles */
        .cilia-part { cursor: pointer; transition: all 0.2s ease; }
        .cilia-part:hover { opacity: 0.8; }
        .cilia-part.selected, .cilia-part.active {
            filter: brightness(1.2);
            stroke: #ff6b00 !important;
            stroke-width: 4 !important;
        }

        .ai-result-card h4 { margin: 0 0 5px 0; color: #2d3748; font-weight: 700; }
        .ai-action {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        .ai-action:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <img src="https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/main/CiliaHub_Logo_web.png" alt="CiliAI Logo">
                <span>🧬</span> CiliAI Explorer
            </div>
            <div class="nav-scroll">
                <div class="nav-group">
                    <div class="nav-label">Dashboard</div>
                    <button class="nav-item active" onclick="window.location.reload()">Overview</button>
                </div>
                <div class="nav-group">
                    <div class="nav-label">Structure Map</div>
                    <button class="nav-item" onclick="selectComp('axoneme')">Axoneme</button>
                    <button class="nav-item" onclick="selectComp('transition-zone')">Transition Zone</button>
                    <button class="nav-item" onclick="selectComp('basal-body')">Basal Body</button>
                    <button class="nav-item" onclick="selectComp('ciliary-membrane')">Ciliary Membrane</button>
                    <button class="nav-item" onclick="selectComp('nucleus')">Nucleus</button>
                    <button class="nav-item" onclick="selectComp('cell-body')">Cell Body</button>
                </div>
                <div class="nav-group">
                    <div class="nav-label">Quick Plots</div>
                    <button class="nav-item" onclick="showDefaultUMAP()">📊 Lung scRNA (FOXJ1)</button>
                    <button class="nav-item" onclick="showDefaultPhylogeny()">🌳 Phylogeny Heatmap</button>
                </div>
            </div>
        </aside>

        <!-- CENTER VISUALIZATION PANEL -->
        <main class="center-panel">
            <div class="top-bar">
                <div class="search-container">
                    <input type="text" id="geneSearch" class="search-input" placeholder="Search gene (e.g., IFT88)...">
                    <button class="search-btn" onclick="searchGene()">Find</button>
                </div>
                <div id="dataStatus" class="status-badge">Initializing...</div>
            </div>
            <div class="viz-card">
                <div class="viz-header">
                    <div class="viz-title">Visualization Board</div>
                    <button style="border:none;background:none;cursor:pointer;color:#64748b;" onclick="downloadPlot('cilia-svg', 'ciliai-plot')">📷 Save</button>
                </div>
                <div id="cilia-svg"></div>
            </div>
        </main>

        <!-- RIGHT CHAT PANEL -->
        <aside class="right-panel">
            <div class="chat-header">
                <h2>CiliAI Assistant</h2>
                <p>Ask questions about genes & datasets</p>
            </div>
            <div class="messages-area" id="messages">
                <div class="ciliai-message assistant">
                    👋 <strong>Welcome to CiliAI.</strong><br>
                    I am initializing the database. I will display the default FOXJ1 expression plot automatically when ready.
                </div>
            </div>
            <div class="input-area">
                <div class="chat-input-group">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Ask a question (e.g. 'Hello' or 'What is IFT88')...">
                    <button class="send-btn" onclick="sendMsg()">Send</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- FULLY WORKING EXTERNAL SCRIPT (no /refs/heads/ nonsense) -->
    <script src="ciliai/ciliai.js"></script>
</body>
</html>
