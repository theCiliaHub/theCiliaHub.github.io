<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CellWhisperer-like AI Explorer</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/main/CiliaHub_Logo_web.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  body, html { margin:0; padding:0; font-family: 'Inter', sans-serif; height:100%; }
  #app { display:flex; height:100vh; background:#f6f8fb; }

  /* Left Panel (Plot/Table) */
  #left-panel {
    flex: 2;
    display:flex;
    flex-direction:column;
    padding:20px;
    overflow:hidden;
  }
  #plot-container {
    flex:1;
    background:white;
    border-radius:12px;
    padding:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid #e5e7eb;
  }

  /* Right Panel (Chat) */
  #right-panel {
    width:400px;
    background:white;
    display:flex;
    flex-direction:column;
    border-left:1px solid #e5e7eb;
    z-index:10;
  }
  .panel-header {
    padding:20px;
    border-bottom:1px solid #e5e7eb;
    background:#f9fafb;
  }
  .panel-header h2 { margin:0; font-size:18px; font-weight:700; }
  .panel-header p { margin:5px 0 0 0; font-size:13px; color:#6b7280; }

  .messages {
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#f9fafb;
  }
  .msg { max-width:90%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.5; word-wrap:break-word; }
  .msg.user { align-self:flex-end; background:#667eea; color:white; border-radius:14px 14px 2px 14px; }
  .msg.bot { align-self:flex-start; background:white; border:1px solid #e5e7eb; color:#334155; border-radius:14px 14px 14px 2px; }

  .chat-input-area {
    padding:15px 20px;
    border-top:1px solid #e5e7eb;
    display:flex;
  }
  .chat-input-area input {
    flex:1;
    padding:10px 14px;
    border:1px solid #e5e7eb;
    border-radius:8px;
  }
  .chat-input-area button {
    margin-left:10px;
    padding:0 20px;
    border:none;
    background:#667eea;
    color:white;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">
  <!-- Left Panel -->
  <div id="left-panel">
    <div id="plot-container">
      <span>Show UMAP for <strong>FOXJ1</strong></span>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="right-panel">
    <div class="panel-header">
      <h2>AI Assistant</h2>
      <p>Ask questions about genes or data</p>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">
        👋 Welcome! You can type queries like: <em>"Show UMAP for FOXJ1"</em>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type your question...">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>
</div>

<script>
  function sendChat() {
    const input = document.getElementById('chatInput');
    const msgText = input.value.trim();
    if(!msgText) return;

    // Display user message
    const messages = document.getElementById('messages');
    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.innerText = msgText;
    messages.appendChild(userMsg);
    messages.scrollTop = messages.scrollHeight;
    input.value='';

    // Simulate AI response (replace this with your AI integration)
    setTimeout(() => {
      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.innerText = `AI Response for: "${msgText}"`;
      messages.appendChild(botMsg);
      messages.scrollTop = messages.scrollHeight;
    }, 800);
  }
</script>

</body>
</html>
