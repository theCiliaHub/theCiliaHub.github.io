<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiliAI — Unified Explorer</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/main/CiliaHub_Logo_web.png" type="image/png">
    
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    
    <style id="ciliai-dynamic-styles"></style> 
    
    <style>
        /* BASE STYLES: This minimalist CSS provides the anchor for the JS to fill */
        body, html { 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background: #f1f5f9; 
            overflow: hidden; 
        }
        .content-area { 
            /* This is the main target area for the dynamic content */
            width: 100vw; 
            height: 100vh; 
            padding: 0;
        }
        .content-area-full {
            /* This style is set by the JS for the full-screen Cilia Analysis Page */
            height: 100%;
            width: 100%;
            padding: 0 !important;
            margin: 0 !important;
            overflow-y: auto; /* Allows scrolling on the analysis page */
        }
    </style>
</head>
<body>
    <div class="content-area" id="main-content-area">
        </div>

    <script src="ciliai.js"></script>
</body>
</html>
