<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiliAI — Unified Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    
    <style>
        :root {
            --primary-blue: #005b96;
            --secondary-blue: #b3cde0;
            --accent-text: #333333;
            --sidebar-bg: #00477a;
            --border-light: #e1e8ed;
            --status-loading-bg: #e3f2fd;
            --status-ready-bg: #e8f5e9;
            --status-error-bg: #ffebee;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Inter', sans-serif; background: #f1f5f9; overflow: hidden; }

        .app-container {
            display: grid;
            grid-template-columns: 240px 1fr 400px;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            background: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--primary-blue);
            overflow-y: auto;
        }

        .brand {
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--primary-blue);
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary-blue), #5568d3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-scroll { flex: 1; overflow-y: auto; padding: 0 10px; }
        .nav-group { margin-bottom: 15px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--secondary-blue); margin-bottom: 5px; font-weight: 600; }
        .nav-item {
            display: block; width: 100%; padding: 8px 12px; background: transparent; border: none; 
            color: var(--secondary-blue); text-align: left; font-size: 13px; border-radius: 6px; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { background: var(--primary-blue); color: white; }

        .center-panel {
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            background: white;
        }

        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; height: 40px; }
        .search-container { display: flex; gap: 10px; flex: 1; max-width: 600px; }
        .search-input { flex: 1; padding: 0 15px; border: 2px solid var(--border-light); border-radius: 8px; height: 40px; font-size: 14px; }
        .search-input:focus { outline: none; border-color: var(--primary-blue); }
        .search-btn { padding: 0 20px; background: var(--primary-blue); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .search-btn:hover { background: #00477a; }

        .viz-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .viz-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viz-title { font-size: 15px; font-weight: 600; color: var(--accent-text); }
        .save-btn { border: none; background: var(--secondary-blue); color: var(--primary-blue); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .save-btn:hover { background: var(--primary-blue); color: white; }

        #cilia-svg { flex: 1; width: 100%; height: 100%; position: relative; overflow: auto; }

        .right-panel {
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            border-left: 1px solid var(--border-light);
            overflow: hidden;
        }

        .chat-header { padding: 20px; border-bottom: 1px solid var(--border-light); }
        .chat-header h2 { font-size: 18px; color: var(--primary-blue); }
        .chat-header p { font-size: 12px; color: #666; }

        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .ciliai-message { display: flex; gap: 8px; }
        .ciliai-message.user { justify-content: flex-end; }
        .ciliai-message-content { max-width: 90%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
        .ciliai-message.user .ciliai-message-content { background: var(--primary-blue); color: white; border-radius: 14px 14px 4px 14px; }
        .ciliai-message.assistant .ciliai-message-content { background: #f0f0f0; color: #333; border-radius: 14px 14px 14px 4px; }

        .input-area { padding: 15px; border-top: 1px solid var(--border-light); background: white; }
        .chat-input-group { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border: 2px solid var(--border-light); border-radius: 8px; font-size: 14px; }
        .chat-input:focus { outline: none; border-color: var(--primary-blue); }
        .send-btn { background: var(--primary-blue); color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .send-btn:hover { background: #00477a; }

        .status-badge { 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            transition: background 0.3s;
        }
        .status.loading { background: var(--status-loading-bg); color: var(--primary-blue); }
        .status.ready { background: var(--status-ready-bg); color: #2e7d32; }
        .status.error { background: var(--status-error-bg); color: #c62828; }

        .ai-result-card { background: #f9fafb; padding: 14px; border-radius: 10px; border-left: 4px solid var(--primary-blue); }

        svg { width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">🧬</div>
                <div>
                    <div>CiliAI</div>
                    <div style="font-size: 10px; opacity: 0.8;">Gene Explorer</div>
                </div>
            </div>

            <div class="nav-scroll">
                <div class="nav-group">
                    <div class="nav-label">Analysis</div>
                    <button class="nav-item active" onclick="window.showDefaultUMAP()">📊 UMAP (FOXJ1)</button>
                    <button class="nav-item" onclick="window.showDefaultPhylogeny()">🌳 Phylogeny</button>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Structure</div>
                    <button class="nav-item" onclick="window.handleAIQuery('list genes localized to axoneme')">Axoneme</button>
                    <button class="nav-item" onclick="window.handleAIQuery('list genes localized to transition zone')">Transition Zone</button>
                    <button class="nav-item" onclick="window.handleAIQuery('list genes localized to basal body')">Basal Body</button>
                </div>

                <div class="nav-group">
                    <div class="nav-label">Help</div>
                    <button class="nav-item" onclick="window.handleAIQuery('what is a cilium?')">About Cilia</button>
                    <button class="nav-item" onclick="window.handleAIQuery('what can you do?')">My Capabilities</button>
                </div>
            </div>
        </aside>

        <div class="center-panel">
            <div class="top-bar">
                <div class="search-container">
                    <input type="text" id="geneSearch" class="search-input" placeholder="Search gene (e.g., IFT88, FOXJ1)...">
                    <button class="search-btn" onclick="window.searchGene()">Search</button>
                </div>
                <div id="dataStatus" class="status-badge loading">Loading...</div>
            </div>

            <div class="viz-card">
                <div class="viz-header">
                    <div class="viz-title">Visualization</div>
                    <button class="save-btn" onclick="window.downloadPlot('cilia-svg', 'ciliai-plot')">📷 Save</button>
                </div>
                <div id="cilia-svg"></div>
            </div>
        </div>

        <aside class="right-panel">
            <div class="chat-header">
                <h2>CiliAI Assistant</h2>
                <p>Ask about genes & ciliary biology</p>
            </div>

            <div class="messages-area" id="messages">
                <div class="ciliai-message assistant">
                    <div class="ciliai-message-content">
                        👋 Hello! I'm CiliAI. Ask me about genes, cilia structure, or ciliopathies.
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="chat-input-group">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Ask a question...">
                    <button class="send-btn" onclick="window.handleUserSend()">Send</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // NOTE: The main logic for loadCiliAIData, handleAIQuery, renderUMAPPlot, etc.,
        // are expected to be available from the linked external file, 'ciliAI.js'.

        // ========== CRITICAL: Initialize Global State ==========
        window.CiliAI = {
            data: { umap: [] },
            masterData: [],
            ready: false,
            lookups: {},
            cellDataCache: {},
            // Initialized to prevent errors before ciliAI.js runs
            lastQueryContext: { type: null, data: [], term: null }, 
            CiliAI_UMAP: null 
        };

        // ========== CORE UI FALLBACKS / HELPERS ==========
        // These implementations are simple/safe and rely minimally on external data until init completes.
        if (typeof window.log !== "function") {
            window.log = (msg) => console.log(`[CiliAI] ${msg}`);
        }

        window.addChatMessage = function(html, isUser = false) {
            const messages = document.getElementById('messages');
            if (!messages) return;
            const msg = document.createElement('div');
            // NOTE: Reaction buttons are handled by the separate click listener in ciliAI.js
            msg.className = `ciliai-message ${isUser ? 'user' : 'assistant'}`;
            msg.innerHTML = `<div class="ciliai-message-content">${html}</div>`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        };

        window.updateStatus = function(text, state = 'normal') {
            const statusEl = document.getElementById('dataStatus');
            if (statusEl) {
                statusEl.textContent = text;
                // IMPROVED: Use CSS classes for status colors/backgrounds
                statusEl.className = `status-badge status ${state}`; 
            }
        };

        // ========== DATA LOADING (Final, robust implementation) ==========
        window.loadCiliAIData = async function(timeoutMs = 60000) {
            const baseUrl = 'https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/refs/heads/main/';
            const mainDbUrl = baseUrl + 'ciliAI_master_database.json';
            const lookupsUrl = baseUrl + 'ciliAI_lookups.json';
            
            try {
                window.log(`Fetching main database: ${mainDbUrl}`);
                window.log(`Fetching lookups: ${lookupsUrl}`);

                const [mainRes, lookupsRes] = await Promise.all([
                    fetch(mainDbUrl),
                    fetch(lookupsUrl)
                ]);

                if (!mainRes.ok) throw new Error(`HTTP ${mainRes.status} for main database`);
                if (!lookupsRes.ok) throw new Error(`HTTP ${lookupsRes.status} for lookups`);

                const mainData = await mainRes.json();
                const lookupData = await lookupsRes.json();

                // Assign all the pre-processed data
                window.CiliAI.masterData = mainData.masterData || [];
                window.CiliAI.lookups = lookupData.lookups || {};
                
                // Assign the raw UMAP data
                window.CiliAI_UMAP = mainData.umapData || [];
                window.CiliAI.data.umap = mainData.umapData || [];
                
                // --- Build the UMAP lookup map (REQUIRED for plotting/queries) ---
                window.CiliAI.lookups.umapByGene = {};
                if (window.CiliAI_UMAP && Array.isArray(window.CiliAI_UMAP)) {
                    for (const point of window.CiliAI_UMAP) {
                        if (point.Gene) {
                            window.CiliAI.lookups.umapByGene[point.Gene.toUpperCase()] = point;
                        }
                    }
                }

                // Create a GeneMap for fast lookups by gene name
                window.CiliAI.lookups.geneMap = {};
                mainData.masterData.forEach(gene => {
                    if (gene.Gene) {
                        window.CiliAI.lookups.geneMap[gene.Gene.toUpperCase()] = gene;
                    }
                });

                // Build the cellDataCache for UMAP expression plotting
                window.CiliAI.cellDataCache = {};
                mainData.masterData.forEach(gene => {
                    if (gene.Gene && gene.expression?.scRNA) {
                        window.CiliAI.cellDataCache[gene.Gene.toUpperCase()] = gene.expression.scRNA;
                    }
                });
                
                window.CiliAI.ready = true;
                window.log(`CiliAI: ${window.CiliAI.masterData.length} genes integrated.`);
                return true;
            } catch (err) {
                console.error("Failed to load CiliAI master database:", err);
                window.log(`Load error: ${err.message}`);
                window.updateStatus('Load failed', 'error');
                window.CiliAI.ready = false;
                return false;
            }
        };

        // ========== UI HANDLERS (Minimal wrappers for HTML compatibility) ==========
        // NOTE: These rely on the comprehensive logic being available from ciliAI.js
        window.handleUserSend = function() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            const query = input.value.trim();
            window.addChatMessage(query, true);
            input.value = '';
            // CRITICAL: Call the logic router from ciliAI.js
            if (typeof window.handleAIQuery === 'function') {
                window.handleAIQuery(query);
            } else {
                 window.addChatMessage('CiliAI logic engine not yet loaded. Please wait.', false);
            }
        };

        window.searchGene = function() {
            const input = document.getElementById('geneSearch');
            if (!input || !input.value.trim()) return;
            const gene = input.value.trim().toUpperCase();
            window.addChatMessage(`Tell me about ${gene}`, true);
            // CRITICAL: Call the logic router from ciliAI.js
            if (typeof window.handleAIQuery === 'function') {
                window.handleAIQuery(`What is ${gene}?`);
            } else {
                 window.addChatMessage('CiliAI logic engine not yet loaded. Please wait.', false);
            }
        };

        window.showDefaultUMAP = function() {
            window.addChatMessage('Loading UMAP visualization for FOXJ1...', false);
             // CRITICAL: Call the renderer from ciliAI.js
            if (typeof window.renderUMAPPlot === 'function') {
                 window.renderUMAPPlot('FOXJ1');
            }
        };
        
        window.showDefaultPhylogeny = function() {
            window.addChatMessage('Show Phylogenetics Analysis (Default Genes) 🌳', true);
             // CRITICAL: Call the logic router from ciliAI.js
            if (typeof window.handleAIQuery === 'function') {
                 window.handleAIQuery('plot default phylogeny');
            }
        };
        
        // NOTE: window.selectComp now uses handleAIQuery directly in the HTML structure above.


        // ========== INITIALIZATION ==========
        async function init() {
            // NOTE: The external file, ciliAI.js, likely contains a redundant initCiliAI() 
            // and an outer wrapper that must be removed.
            window.updateStatus('Loading databases...', 'loading');
            const loaded = await window.loadCiliAIData();
            if (loaded) {
                window.updateStatus(`Ready (${window.CiliAI.masterData.length} genes)`, 'ready');
                window.addChatMessage(`✅ Database loaded with ${window.CiliAI.masterData.length} genes!`, false);
                
                // Render the initial UMAP plot only if the function from ciliAI.js is loaded
                if (typeof window.renderUMAPPlot === 'function') {
                    window.renderUMAPPlot('FOXJ1');
                } else {
                    window.addChatMessage('Plotting engine is loading...', false);
                }
            } else {
                window.updateStatus('Failed to load', 'error');
            }
        }

        // Start on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
   <script src="ciliai/ciliAI.js"></script>
</body>
</html>
