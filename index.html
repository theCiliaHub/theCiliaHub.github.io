    <style>
        /* ===== Top navigation bar ===== */
        .top-navbar {
            background: var(--primary-blue, #185FA5);
            color: white; height: 60px;
            display: flex; align-items: center;
            padding: 0 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            position: sticky; top: 0; width: 100%; z-index: 1000;
            box-sizing: border-box;
        }
        .top-navbar .nav-container { display: flex; align-items: center; height: 100%; width: 100%; }
        .top-navbar .brand {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 17px;
            padding-right: 24px; margin-right: 8px;
            border-right: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0; color: white; text-decoration: none;
        }
        .top-navbar .brand img { height: 36px; border-radius: 6px; }
        .top-navbar .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .top-navbar .brand-subtitle { font-size: 10px; opacity: 0.8; font-weight: 400; }
        .top-navbar .nav-links { display: flex; list-style: none; gap: 2px; height: 100%; margin-left: 8px; padding: 0; }
        .top-navbar .nav-links a {
            color: rgba(255,255,255,0.8); text-decoration: none;
            padding: 0 16px; height: 100%;
            display: flex; align-items: center;
            font-size: 15px; font-weight: 500;
            transition: color 0.2s, background-color 0.2s; position: relative;
        }
        .top-navbar .nav-links a::after {
            content: ''; position: absolute; bottom: 0; left: 12px; right: 12px; height: 3px;
            background: white; border-radius: 3px 3px 0 0; transform: scaleX(0); transition: transform 0.2s ease;
        }
        .top-navbar .nav-links a:hover { color: white; background-color: rgba(255,255,255,0.08); }
        .top-navbar .nav-links a:hover::after { transform: scaleX(1); }
        .top-navbar .nav-links a.active { color: white; font-weight: 600; background-color: rgba(255,255,255,0.12); }
        .top-navbar .nav-links a.active::after { transform: scaleX(1); }

    <script>
    
        // ==========================================================
        // GLOBAL STATE
        // ==========================================================
        window.rnaTissueExpressionData = {};
        window.CiliAI = { masterData: [], lookups: { geneMap: {} } };
        window.liPhylogenyCache = {};
        window.neversPhylogenyCache = {};
        window.CiliAI.cellDataCache = {};
        window.CiliAI_UMAP = [];
        window.ciliaryGeneMap = new Map();
        window.allGenes = []; // Stores unique ciliary gene objects
        window.uniqueGeneNames = new Set(); // Stores unique gene names for count/filtering
        window.currentData = [];

        /* All data is served from ciliahub.org under /data/. No GitHub
         * dependencies — single source of truth is the deployed master JSON.
         * BASE_URL is empty so paths resolve relative to the page origin,
         * which on production is https://ciliahub.org. (Local dev with a
         * file:// page would need to either prepend the production URL or
         * run a local web server; not a concern for the deployed site.) */
        const BASE_URL = '';

        /* Primary (and only) gene database — the merged master with full
         * ciliopathy data, ciliogenics scores, pfam_domains, MGI/ClinVar
         * cross-refs, orthologs, screens, and pre-built lookups
         * (byCiliopathy, byClassification, diseaseToClassification,
         * diseaseAliases, byModuleOrComplex). */
        const MASTER_DB = BASE_URL + 'data/genes/ciliahub_master_merged.json';

        const LI_PHYLO_MATRIX = BASE_URL + 'data/phylogeny/li_et_al_2014_matrix_optimized.json';
        const NEVERS_PHYLO_MATRIX = BASE_URL + 'data/phylogeny/nevers_et_al_2017_matrix_optimized.json';
        const RNA_TISSUE_TSV = BASE_URL + 'data/exports/rna_tissue_consensus.tsv';
        const UMAP_COORDINATES_DB = BASE_URL + 'data/umap/umap_data.json';
        const CELLXGENE_EXPRESSION_DB = BASE_URL + 'data/expression/cellxgene_data.json';

        const defaultGenesNames = ["IFT88", "CEP290", "ARL13B", "BBS1", "PKD2", "ACE2"];

        // ==========================================================
        // EXTERNAL DATABASE LINKS
        // ==========================================================
        const EXTERNAL_DATABASES = {
            // Gene databases
            NCBI_GENE: (gene) => `https://www.ncbi.nlm.nih.gov/gene/?term=${gene}`,
            GENECARDS: (gene) => `https://www.genecards.org/cgi-bin/carddisp.pl?gene=${gene}`,
            UNIPROT: (gene) => `https://www.uniprot.org/uniprotkb?query=${gene}`,
            PUBMED: (gene) => `https://pubmed.ncbi.nlm.nih.gov/?term=${gene}`,

            // Genome browsers
            ENSEMBL: (ensemblId) => {
                const cleanId = ensemblId.split(',')[0].trim();
                return `https://www.ensembl.org/Homo_sapiens/Gene/Summary?g=${cleanId}`;
            },
            UCSC: (gene) => `https://genome.ucsc.edu/cgi-bin/hgTracks?db=hg38&position=${gene}`,

            // Protein complexes
            CORUM: () => `https://mips.helmholtz-muenchen.de/corum/`,

            // Ciliopathy databases - FIXED: Corrected Ciliogenics and replaced SyndromeB with Malacards
            CILIOGENICS: (gene) => `https://ciliogenics.com/?page=General%20info&query=${gene}`,
            MALACARDS: (gene) => `https://www.malacards.org/search/results?q=${gene}`,

            // Expression databases
            PROTEIN_ATLAS: (gene) => `https://www.proteinatlas.org/search/${gene}`,
            GTEX: (gene) => `https://gtexportal.org/home/gene/${gene}`,

            // OMIM
            OMIM: (omimId) => `https://omim.org/entry/${omimId}`,

            // Mouse models
            MGI: (gene) => `https://www.informatics.jax.org/searchtool/Search.do?query=${gene}`,

            // Human Phenotype
            HPO: (gene) => `https://hpo.jax.org/app/browse/gene/${gene}`
        };

        // ==========================================================
        // SCREEN CITATION MAP

        // ==========================================================
        // CORE UTILITIES
        // ==========================================================
        function getGeneValue(gene, ...keys) {
            for (const key of keys) {
                const value = gene[key];
                if (value !== null && value !== undefined && value !== '' &&
                    String(value).toLowerCase() !== 'not available' &&
                    String(value).toLowerCase() !== 'na' &&
                    String(value).toLowerCase() !== 'n/a' &&
                    String(value).toLowerCase() !== 'nan' &&
                    String(value).toLowerCase() !== 'null') {
                    return value;
                }
            }
            return null;
        }

        function getCleanArray(gene, key) {
            let data = getGeneValue(gene, key);

            if (key === 'Protein.complexes') {
                data = getGeneValue(gene, 'complex_components', 'Protein.complexes');
                if (typeof data === 'object' && !Array.isArray(data) && data !== null) {
                    return Object.keys(data).filter(k => getGeneValue(data, k));
                }
            } else if (key === 'Localization') {
                data = getGeneValue(gene, 'localization', 'Localization');
            } else if (key === 'Ciliopathy') {
                data = getGeneValue(gene, 'ciliopathy', 'Ciliopathy');
            } else if (key === 'Synonym.') {
                data = getGeneValue(gene, 'synonym', 'Synonym_');
            }

            if (!data) return [];

            if (Array.isArray(data)) {
                return data.map(i => String(i).trim()).filter(Boolean);
            }

            return String(data).split(/[,;]/)
                .map(i => i.trim())
                .filter(i => i && i.toLowerCase() !== 'not available' &&
                    i.toLowerCase() !== 'na' &&
                    i.toLowerCase() !== 'n/a' &&
                    i.toLowerCase() !== 'null');
        }

        // ==========================================================
        // CILIARY GENE FILTERING
        // ==========================================================
        function isCiliaryGene(gene) {
            // Check if gene has ciliary localization
            const localization = getCleanArray(gene, 'Localization');
            const ciliaryTerms = ['cilia', 'ciliary', 'flagella', 'axoneme', 'basal body', 'transition zone'];
            const hasCiliaryLocalization = localization.some(loc =>
                ciliaryTerms.some(term => loc.toLowerCase().includes(term))
            );

            // Check if gene is in ciliary phylogenetic classes
            const hasPhylogeny = gene.phylogeny &&
                (gene.phylogeny.li_2014 || gene.phylogeny.nevers_2017);

            // Check if gene has ciliopathy associations
            const hasCiliopathy = getCleanArray(gene, 'Ciliopathy').length > 0;

            // Check if gene has screen data showing ciliary effects
            const hasCiliaryScreens = gene.screens && gene.screens.length > 0;

            // A gene is considered ciliary if it meets any of these criteria
            return hasCiliaryLocalization || hasPhylogeny || hasCiliopathy || hasCiliaryScreens;
        }

        function getCiliaryGeneCount() {
            /* Use the canonical master count to match index.html's tile.
             * The previous count (window.uniqueGeneNames.size) applied an
             * extra isCiliaryGene filter that double-gated genes already
             * curated into the master, dropping 4 entries below the
             * canonical 2587. The master is the authoritative list — if
             * a gene is in master.genes, it's a ciliary gene. */
            if (window.CiliAI && Array.isArray(window.CiliAI.masterData)) {
                return window.CiliAI.masterData.length;
            }
            return window.uniqueGeneNames.size;
        }

        // ==========================================================
        // URL ROUTING FUNCTIONS
        // ==========================================================
        function getCurrentGeneFromURL() {
            // Only use hash for routing - this is the reliable SPA method
            if (window.location.hash.length > 1) {
                return decodeURIComponent(window.location.hash.slice(1)).toUpperCase();
            }
            return null;
        }

        function updateURLForGene(geneName) {
            // Create consistent URL: https://ciliahub.org/ciliahub.html#GENENAME
            const cleanPath = window.location.pathname.split('#')[0];
            const newUrl = `${cleanPath}#${geneName}`;
            window.history.pushState({ gene: geneName }, '', newUrl);
        }

        function copyGeneLinkToClipboard(geneName) {
            // Always create canonical link: https://ciliahub.org/ciliahub.html#GENENAME
            const baseUrl = `${window.location.origin}${window.location.pathname.split('#')[0]}`;
            const geneUrl = `${baseUrl}#${geneName}`;

            navigator.clipboard.writeText(geneUrl).then(() => {
                alert(`Link copied to clipboard:\n${geneUrl}`);
            }).catch(err => {
                console.error('Failed to copy link: ', err);
                // Fallback method
                const textArea = document.createElement('textarea');
                textArea.value = geneUrl;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert(`Link copied to clipboard:\n${geneUrl}`);
            });
        }


        // ==========================================================
        // REQUIRED HELPER FUNCTIONS
        // ==========================================================
        function escapeHtml(text) {
            if (typeof text !== 'string') text = String(text || '');
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function buildInfoRow(label, value, link = null, tooltip = '') {
            if (!value || value === '' || String(value).trim().toLowerCase().includes('not available') ||
                String(value).trim().toLowerCase() === 'na') {
                return '';
            }

            let valueHtml = escapeHtml(value);
            if (link) {
                valueHtml = `<a href="${link}" target="_blank" class="external-link with-icon">${escapeHtml(value)}</a>`;
            }

            const tooltipAttr = tooltip ? `title="${escapeHtml(tooltip)}"` : '';

            return `
                <div class="info-row">
                    <span class="info-label ${link ? 'with-link' : ''}" ${tooltipAttr}>
                        ${escapeHtml(label)}
                        ${link ? '<span class="info-label-icon">🔗</span>' : ''}
                    </span>
                    <span class="info-value">${valueHtml}</span>
                </div>
            `;
        }

        function buildTagInfoRow(label, array, isCiliopathy = false, databaseLink = null) {
            if (!array || array.length === 0) return '';

            let tagClass = 'tag-blue';
            if (isCiliopathy) {
                tagClass = 'tag-pink';
            } else if (label.toLowerCase().includes('localization')) {
                tagClass = 'tag-green';
            }

            const tagsHTML = array.map(item =>
                `<span class="tag ${tagClass}">${escapeHtml(item.trim())}</span>`
            ).join('');

            let labelHtml = escapeHtml(label);
            if (databaseLink) {
                labelHtml = `<span class="info-label with-link" title="Click to open ${databaseLink.name}" onclick="window.open('${databaseLink.url}', '_blank')">${escapeHtml(label)} <span class="info-label-icon">🔗</span></span>`;
            }

            return `
                <div class="info-row">
                    ${labelHtml.startsWith('<span') ? labelHtml : `<span class="info-label">${labelHtml}</span>`}
                    <div class="info-value info-tags">${tagsHTML}</div>
                </div>
            `;
        }

        // ==========================================================
        // SCREEN DATA FUNCTIONS
        // ==========================================================
        function getResultClass(result) {
            if (!result) return 'screen-result-neutral';

            const lowerResult = result.toLowerCase();
            if (lowerResult.includes('increase') || lowerResult.includes('up') || lowerResult.includes('positive')) {
                return 'screen-result-up';
            } else if (lowerResult.includes('decrease') || lowerResult.includes('down') || lowerResult.includes('negative')) {
                return 'screen-result-down';
            } else if (lowerResult.includes('no effect') || lowerResult.includes('neutral') || lowerResult.includes('no significant')) {
                return 'screen-result-neutral';
            }
            return 'screen-result-neutral';
        }

        function getResultText(result) {
            if (!result) return 'Not Reported';

            const lowerResult = result.toLowerCase();
            if (lowerResult.includes('increase') || lowerResult.includes('up') || lowerResult.includes('positive')) {
                return 'Increase';
            } else if (lowerResult.includes('decrease') || lowerResult.includes('down') || lowerResult.includes('negative')) {
                return 'Decrease';
            } else if (lowerResult.includes('no effect') || lowerResult.includes('neutral') || lowerResult.includes('no significant')) {
                return 'No Effect';
            }
            return result;
        }

        function formatScreenDataTable(screens) {
            if (!Array.isArray(screens) || screens.length === 0) {
                return '<p class="not-available">No screen data available</p>';
            }

            const citationMap = getScreenCitationMap();

            let rows = '';
            screens.forEach(s => {
                const source = s.source || '';
                const result = s.result || 'Not Reported';
                const citation = citationMap[source] || { name: source, link: '', citation: source, summary: '' };

                const resultClass = getResultClass(result);
                const resultText = getResultText(result);

                const screenName = citation.name || source;
                const screenLink = citation.link ?
                    `<a href="${citation.link}" target="_blank" class="external-link with-icon">${screenName}</a>` :
                    screenName;

                rows += `
                    <tr>
                        <td>
                            <span class="citation-link" onclick="showCitationInfo('${escapeHtml(source)}')">
                                ${screenLink}
                            </span>
                        </td>
                        <td>
                            <span class="screen-result-badge ${resultClass}">${resultText}</span>
                        </td>
                        <td>${citation.citation}</td>
                    </tr>
                `;
            });

            return `
                <table class="screen-table">
                    <thead>
                        <tr>
                            <th>Screen Dataset</th>
                            <th>Effect on Ciliogenesis</th>
                            <th>Citation</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function showCitationInfo(source) {
            const citationMap = getScreenCitationMap();
            const citation = citationMap[source] || {
                name: source,
                link: '',
                citation: source,
                summary: 'No summary available for this screen.'
            };

            const modal = document.getElementById('citationModal');
            const title = document.getElementById('citationModalTitle');
            const body = document.getElementById('citationModalBody');

            title.textContent = citation.name;
            body.innerHTML = `
                <div style="margin-bottom: 1.5rem;">
                    <strong>Citation:</strong> ${citation.citation}
                </div>
                ${citation.link ? `
                <div style="margin-bottom: 1.5rem;">
                    <strong>Link:</strong> <a href="${citation.link}" target="_blank" class="external-link with-icon">${citation.link}</a>
                </div>
                ` : ''}
                <div class="citation-summary">
                    <strong>Summary:</strong><br>
                    ${citation.summary}
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeCitationModal() {
            document.getElementById('citationModal').style.display = 'none';
        }

        // Close modal when clicking outside
        document.addEventListener('click', (e) => {
            const modal = document.getElementById('citationModal');
            if (e.target === modal) {
                closeCitationModal();
            }
        });

        // ==========================================================
        // DATA LOADING FUNCTIONS
        // ==========================================================
        async function loadMasterData() {
            /* Single-source loader (April 29, v2 schema).
             *
             * Reads ciliahub_master_merged.json and adapts it to the
             * field names ciliahub.html's UI uses (Gene.Description,
             * Ciliopathies, OMIM_ID, Ortholog_Mouse, etc.). The master
             * already ships pre-built lookups (byCiliopathy,
             * byModuleOrComplex, byClassification, diseaseToClassification,
             * diseaseAliases) so we surface those verbatim and only need
             * to build pfamByGene from per-gene pfam_domains arrays.
             *
             * Old behavior fetched from GitHub (CANONICAL_DB +
             * ciliAI_master_database.json + ciliAI_lookups.json). All gone:
             * the merged master ships everything in one file, served from
             * /data/genes/ on the same origin. */
            function buildFromMaster(masterJson) {
                const masterData = [], geneMap = {}, pfamByGene = {};

                const genes = masterJson.genes || {};
                const lookups = masterJson.lookups || {};

                // Helper: turn array OR comma-string OR null into a clean array
                const toArr = (v) => Array.isArray(v)
                    ? v.filter(Boolean)
                    : (v ? String(v).split(/[,;]/).map(s => s.trim()).filter(Boolean) : []);
                // Helper: turn array OR string OR null into a comma-joined string
                const toStr = (v) => Array.isArray(v) ? v.join(', ') : (v || '');

                Object.keys(genes).forEach(sym => {
                    const g = genes[sym];
                    const orth = g.orthologs || {};

                    const cilioArr = toArr(g.ciliopathies);
                    const pfamArr = Array.isArray(g.pfam_domains) ? g.pfam_domains : [];
                    const pfamNameStr = pfamArr.map(d => d.name || d).filter(Boolean).join('; ');
                    const pfamIdStr = pfamArr.map(d => d.id || '').filter(Boolean).join('; ');

                    const rec = {
                        // Core identifiers
                        'Gene': sym,
                        'Gene.Description': g.description || '',
                        'Ensembl ID': toStr(g.ensembl_id),
                        'Ensembl.ID': toStr(g.ensembl_id),
                        'OMIM_ID': toStr(g.omim_id),
                        'synonym': toStr(g.synonyms),

                        // Localization
                        'Localization': toStr(g.localization),

                        // Ciliopathy info (v2 schema)
                        'Ciliopathies': cilioArr,
                        'Ciliopathy': cilioArr.join(', '),
                        'ciliopathy_classification': g.ciliopathy_classification || [],
                        'ciliopathy_refs': g.ciliopathy_refs || [],
                        'localization_refs': g.localization_refs || [],
                        'disease_classifications': g.disease_classifications || {},
                        'source': g.source || '',

                        // Functional annotation
                        'Functional.category': toStr(g.functional_category),
                        'Functional_Summary': g.functional_summary || '',
                        'Protein_Complexes': g.protein_complex || '',

                        // Domains
                        'PFAM_IDs': pfamIdStr,
                        'Domain_Descriptions': pfamNameStr,

                        // Orthologs (flat fields per Section 8 of CILIAHUB_DATA_REPORT)
                        'Ortholog_Mouse':      orth.mouse      || '',
                        'Ortholog_C_elegans':  orth.c_elegans  || '',
                        'Ortholog_Xenopus':    orth.xenopus    || '',
                        'Ortholog_Zebrafish':  orth.zebrafish  || '',
                        'Ortholog_Drosophila': orth.drosophila || '',

                        // Phenotypes
                        'mouse_phenotype': g.mouse_phenotype || '',
                        'mouse_ciliopathy_phenotype': g.mouse_ciliopathy_phenotype || '',
                        'human_phenotype': g.human_phenotype || '',
                        'human_ciliopathy_phenotype': g.human_ciliopathy_phenotype || '',

                        // Cilia-effect fields (v2.1)
                        'overexpression_effects': g.oe_effect || '',
                        'lof_effects': g.lof_effect || '',
                        'percent_ciliated_cells_effects': g.pct_ciliated || '',

                        // Other useful fields
                        'screens': g.screens || [],
                        'ciliogenics': g.ciliogenics || null,
                        'mgi_id': g.mgi_id || '',
                        'mgi_url': g.mgi_url || '',
                        'clinvar_variant_count': g.clinvar_variant_count || 0,
                        'uniprot_id': g.uniprot_id || '',
                        'alphafold_url': g.alphafold_url || '',
                        /* v5.4: surface evidence_tier and curation_note so the
                         * browse cards can render the colored tier pill via
                         * window.CiliaHub.tier.badgeHTML(). Without these, the
                         * badge silently rendered as empty string. */
                        'evidence_tier':    g.evidence_tier || '',
                        'evidence_summary': g.evidence_summary || null,
                        'curation_note':    g.curation_note || ''
                    };
                    masterData.push(rec);
                    geneMap[sym] = rec;

                    // Build pfamByGene from structured pfam_domains
                    if (pfamArr.length) {
                        pfamByGene[sym] = pfamArr.map((d, i) => ({
                            id: d.id || `DOM_${i + 1}`,
                            name: d.name || (typeof d === 'string' ? d : ''),
                            start: typeof d.start === 'number' ? d.start : (i * 200) + 50,
                            end: typeof d.end === 'number' ? d.end : (i * 200) + 150
                        }));
                    }
                });

                return {
                    masterData,
                    lookups: {
                        geneMap,
                        byCiliopathy: lookups.byCiliopathy || {},
                        byModuleOrComplex: lookups.byModuleOrComplex || {},
                        byClassification: lookups.byClassification || {},
                        diseaseToClassification: lookups.diseaseToClassification || {},
                        diseaseAliases: lookups.diseaseAliases || {},
                        pfamByGene
                    }
                };
            }

            try {
                /* Defensively parse JSON. Catches:
                 *   - Network errors (fetch throws)
                 *   - Non-2xx responses (r.ok false)
                 *   - HTML 404 pages returned with status 200
                 *     (some nginx configs do this; their body starts
                 *     with "<!DOCTYPE" which JSON.parse rejects)
                 *   - Genuinely malformed JSON
                 * Any of these returns null instead of throwing. The
                 * try used to wrap only the fetch — r.json() returns a
                 * Promise, so its rejection escaped past the catch and
                 * dumped the whole loader to the error page. */
                const safeJSON = async (url) => {
                    try {
                        const r = await fetch(url);
                        if (!r.ok) {
                            console.warn('ciliahub.html: non-OK fetch (' + r.status + ') for ' + url);
                            return null;
                        }
                        return await r.json();
                    } catch (e) {
                        console.warn('ciliahub.html: failed to parse JSON from ' + url + ' (' + e.message + ')');
                        return null;
                    }
                };

                // Fetch master + auxiliary files in parallel (all from same origin)
                const [masterJson, liData, neversData, rnaResp, umapData, cellxgeneData] = await Promise.all([
                    safeJSON(MASTER_DB),
                    safeJSON(LI_PHYLO_MATRIX),
                    safeJSON(NEVERS_PHYLO_MATRIX),
                    fetch(RNA_TISSUE_TSV).catch(() => null),
                    safeJSON(UMAP_COORDINATES_DB),
                    safeJSON(CELLXGENE_EXPRESSION_DB)
                ]);

                window.liPhylogenyCache = liData || {};
                window.neversPhylogenyCache = neversData || {};
                window.CiliAI_UMAP = Array.isArray(umapData) ? umapData : [];
                window.CiliAI.cellDataCache = (cellxgeneData && typeof cellxgeneData === 'object') ? cellxgeneData : {};

                if (!masterJson || !masterJson.genes) {
                    console.error('ciliahub.html: failed to load master database from', MASTER_DB);
                    if (window.CiliaHubUI) CiliaHubUI.showErrorToast('Data Loading Error',
                        'Could not load the ciliary gene catalogue. Try a hard reload (Ctrl/Cmd+Shift+R).');
                    window.CiliAI.masterData = [];
                    window.CiliAI.lookups = { geneMap: {} };
                    return false;
                }

                const built = buildFromMaster(masterJson);
                console.log(`✅ ciliahub.html: master loaded (${built.masterData.length} genes from ${MASTER_DB})`);

                window.CiliAI.masterData = built.masterData;
                window.CiliAI.lookups = built.lookups;

                // Build comprehensive gene map for the browse/search UI
                const rawMasterData = window.CiliAI.masterData;

                // Build comprehensive gene map with synonyms
                window.ciliaryGeneMap.clear();
                window.uniqueGeneNames.clear();
                const uniqueGeneObjects = [];

                window.CiliAI.masterData.forEach(g => {
                    if (g.Gene) {
                        const geneName = g.Gene;
                        const geneObj = { ...g, gene: geneName };
                        if (g['Entrez.ID']) geneObj.entrezId = String(g['Entrez.ID']);

                        // Store in main map with uppercase gene name
                        window.ciliaryGeneMap.set(geneName.toUpperCase(), geneObj);

                        // Also store with Ensembl IDs
                        const ensemblIds = getCleanArray(g, 'ensembl_gene_id.x.x');
                        ensemblIds.forEach(id => {
                            window.ciliaryGeneMap.set(id.toUpperCase(), geneObj);
                        });

                        // Store with synonyms
                        const synonyms = getCleanArray(g, 'Synonym.');
                        synonyms.forEach(syn => {
                            window.ciliaryGeneMap.set(syn.toUpperCase(), geneObj);
                        });

                        // Store with ciliopathy names
                        const ciliopathies = getCleanArray(g, 'Ciliopathy');
                        ciliopathies.forEach(ciliopathy => {
                            const cleanCiliopathy = ciliopathy.split('(')[0].trim().toUpperCase();
                            if (cleanCiliopathy && cleanCiliopathy.length > 2) {
                                window.ciliaryGeneMap.set(cleanCiliopathy, geneObj);
                            }
                        });

                        if (!window.CiliAI.lookups.geneMap) window.CiliAI.lookups.geneMap = {};
                        window.CiliAI.lookups.geneMap[geneName.toUpperCase()] = geneObj;

                        /* Every gene in master.genes is by definition a ciliary
                         * candidate — that's the curation decision. Adding all
                         * of them to allGenes (rather than filtering with
                         * isCiliaryGene) makes the count tile match index.html
                         * and ensures every master entry is reachable via search.
                         * isCiliaryGene() is kept around in case other code
                         * needs it, but it's no longer used to gate the list. */
                        if (!window.uniqueGeneNames.has(geneName)) {
                            window.uniqueGeneNames.add(geneName);
                            uniqueGeneObjects.push(geneObj);
                        }
                    }
                });

                /* RNA tissue data is OPTIONAL — if the TSV is missing or
                 * unreadable, leave window.rnaTissueExpressionData empty
                 * and continue. Without this guard, a failed TSV fetch
                 * (which returns null per the .catch(() => null) on the
                 * Promise.all above) made .text() throw on null, dumping
                 * the user to the "Data Loading Error" page even though
                 * the master JSON had loaded successfully. */
                if (rnaResp && rnaResp.ok) {
                    try {
                        const rnaText = await rnaResp.text();
                        const lines = rnaText.split('\n').filter(l => l.trim());
                        if (lines.length > 1) {
                            const headers = lines[0].split('\t').map(h => h.trim());
                            const geneIdx = headers.indexOf('Gene name');
                            const tissueIdx = headers.indexOf('Tissue');
                            const nTPMIdx = headers.indexOf('nTPM');

                            if (geneIdx !== -1 && tissueIdx !== -1 && nTPMIdx !== -1) {
                                window.rnaTissueExpressionData = {};
                                for (let i = 1; i < lines.length; i++) {
                                    const cols = lines[i].split('\t').map(v => v.trim());
                                    const gene = cols[geneIdx];
                                    const tissue = cols[tissueIdx];
                                    const nTPM = parseFloat(cols[nTPMIdx]);
                                    if (gene && tissue !== 'cilia' && !isNaN(nTPM)) {
                                        if (!window.rnaTissueExpressionData[gene]) window.rnaTissueExpressionData[gene] = {};
                                        window.rnaTissueExpressionData[gene][tissue] = nTPM;
                                    }
                                }
                            }
                        }
                    } catch (rnaErr) {
                        console.warn('ciliahub.html: RNA tissue TSV parse failed (non-fatal):', rnaErr);
                    }
                } else {
                    console.warn('ciliahub.html: RNA tissue TSV unavailable (non-fatal). Tissue expression rows in gene cards will be empty.');
                }

                // Set the final filtered list of unique ciliary genes
                window.allGenes = uniqueGeneObjects;
                window.currentData = window.allGenes;

        function findGenes(input) {
            const queries = input.split(/[\s,\n;]+/).map(s => s.trim()).filter(Boolean);
            const found = [];
            const seen = new Set();

            queries.forEach(q => {
                const qUpper = q.toUpperCase();

                // Try exact matches first
                if (window.ciliaryGeneMap.has(qUpper) && !seen.has(qUpper)) {
                    const geneObj = window.ciliaryGeneMap.get(qUpper);
                    if (geneObj && !seen.has(geneObj.Gene)) {
                        found.push(geneObj);
                        seen.add(geneObj.Gene);
                    }
                }

                // Try partial matches
                if (found.length === 0) {
                    // Search through all gene entries for partial matches
                    for (const [key, geneObj] of window.ciliaryGeneMap.entries()) {
                        if (key.includes(qUpper) && geneObj.Gene && !seen.has(geneObj.Gene)) {
                            found.push(geneObj);
                            seen.add(geneObj.Gene);
                            break; // Only add first match for each gene
                        }
                    }
                }
            });

            return found.slice(0, 50); // Limit results
        }

        function performSearchForGene(geneName) {
            const searchInput = document.getElementById('single-gene-search');
            if (searchInput) {
                searchInput.value = geneName;
                performSingleSearch();
            } else {
                displayHomePage();
                setTimeout(() => {
                    const searchInputAfter = document.getElementById('single-gene-search');
                    if (searchInputAfter) {
                        searchInputAfter.value = geneName;
                        performSingleSearch();
                    }
                }, 100);
            }
        }

        const FEATURED_GENE_NAMES = (typeof defaultGenesNames !== 'undefined' && defaultGenesNames.length)

        // Resolve a gene symbol to a live gene object from the master layer.
        function resolveGene(symbol) {
            if (!symbol) return null;
            const up = String(symbol).toUpperCase();
            if (window.ciliaryGeneMap && window.ciliaryGeneMap.has(up)) {
                return window.ciliaryGeneMap.get(up);
            }
            if (Array.isArray(window.CiliAI && window.CiliAI.masterData)) {
                return window.CiliAI.masterData.find(g => (g.Gene || g.gene || '').toUpperCase() === up) || null;
            }
            return null;
        }

            const g = resolveGene(symbol);
            if (g) { displayIndividualGenePage(g); }

        // Build a compact card object summary from a master gene record.
        function geneSummary(g) {
            const sym = g.Gene || g.gene || 'Unknown';
            const desc = getGeneValue(g, 'Gene.Description', 'Description', 'description') || '';
            const locArr = getCleanArray(g, 'Localization');
            const loc = locArr.join(', ');
            const cilioArr = getCleanArray(g, 'Ciliopathy');
            const cilio = cilioArr.join('; ');
            let tier = g.evidence_tier || '';
            if (!tier && window.ciliaryGeneMap && sym) {
                const rec = window.ciliaryGeneMap.get(sym.toUpperCase());
                if (rec) tier = rec.evidence_tier || '';
            }
            const tierBadge = (tier && window.CiliaHub && window.CiliaHub.tier)
                ? window.CiliaHub.tier.badgeHTML(tier, { compact: true }) : '';
            return { sym, desc, loc, cilio, tierBadge };
        }

        // ---- Browse-all state ----
        let CH_BROWSE_LETTER = 'ALL';
        let CH_BROWSE_QUERY = '';

        function browseAllGenes() {
            const md = (window.CiliAI && Array.isArray(window.CiliAI.masterData)) ? window.CiliAI.masterData : [];
            return md.slice().sort((a, b) =>

        function renderBrowseGrid() {
            const host = document.getElementById('ch-browse-grid');
            const countEl = document.getElementById('ch-browse-count');
            if (!host) return;
            let genes = browseAllGenes();

            if (CH_BROWSE_LETTER !== 'ALL') {
                if (CH_BROWSE_LETTER === '#') {
                    genes = genes.filter(g => !/^[A-Z]/i.test((g.Gene || g.gene || '')));
                } else {
                    genes = genes.filter(g => (g.Gene || g.gene || '').toUpperCase().startsWith(CH_BROWSE_LETTER));
                }
            }
            if (CH_BROWSE_QUERY) {
                const q = CH_BROWSE_QUERY.toUpperCase();
                genes = genes.filter(g => {
                    const sym = (g.Gene || g.gene || '').toUpperCase();
                    if (sym.includes(q)) return true;
                    const syn = getCleanArray(g, 'Synonym.').join(' ').toUpperCase();
                    if (syn.includes(q)) return true;
                    const cil = getCleanArray(g, 'Ciliopathy').join(' ').toUpperCase();
                    return cil.includes(q);
                });
            }

            if (countEl) countEl.textContent = genes.length.toLocaleString();

            if (!genes.length) {
                host.innerHTML = `<div class="ch-empty">No genes match this filter.</div>`;
                return;
            }

            host.innerHTML = genes.map(g => {
                const sym = g.Gene || g.gene || '';

            // Wire search

                    const query = this.value.trim();

                    const qUp = query.toUpperCase();
                    const out = []; const seen = new Set();
                    (window.allGenes || []).forEach(g => {
                        const name = g.gene || g.Gene || '';
                        if (!name || seen.has(name)) return;
                        const syn = getCleanArray(g, 'Synonym.');
                        const ens = getCleanArray(g, 'ensembl_gene_id.x.x');
                        const cil = getCleanArray(g, 'Ciliopathy');
                        if (name.toUpperCase().includes(qUp)) { out.push({ g, type: 'Gene', match: name }); seen.add(name); return; }
                        for (const s of syn) { if (s.toUpperCase().includes(qUp)) { out.push({ g, type: 'Synonym', match: s }); seen.add(name); return; } }
                        for (const e of ens) { if (e.toUpperCase().includes(qUp)) { out.push({ g, type: 'Ensembl', match: e }); seen.add(name); return; } }
                        for (const c of cil) { const cc = c.split('(')[0].trim(); if (cc.toUpperCase().includes(qUp)) { out.push({ g, type: 'Ciliopathy', match: cc }); seen.add(name); return; } }

                    const top = out.slice(0, 15);

            CH_BROWSE_LETTER = 'ALL'; CH_BROWSE_QUERY = '';
            renderAlphabetBar();
            renderBrowseGrid();

        // ---- Search submission (routes to gene card or results grid) ----
        function performSingleSearch() {
            const input = document.getElementById('single-gene-search');
            const query = input ? input.value.trim() : '';
            if (!query) return;
            const results = findGenes(query);
            if (!results.length) {
                const sm = document.getElementById('status-message');
                if (sm) { sm.innerHTML = `<span class="ch-status-err">No matches found for "${escapeHtml(query)}"</span>`; sm.style.display = 'block'; }
                return;
            }
            if (results.length === 1) { displayIndividualGenePage(results[0]); }
            else { renderSearchResults(results, query); }
        }

        function renderSearchResults(genes, query) {
            const contentArea = document.getElementById('page-content');
            if (!contentArea) return;
            contentArea.innerHTML = `
                <div class="ch-shell">
                    <div class="ch-results-head">
                        <button type="button" class="ch-back" onclick="displayHomePage()">← Back</button>
                        <h1 class="ch-h1">Search results <span class="ch-count">(${genes.length})</span></h1>
                        <p class="ch-muted">Showing matches for &ldquo;${escapeHtml(query || '')}&rdquo;. Click a gene to open its card.</p>
                    </div>
                    <div class="ch-featured">
                        ${genes.map(featuredCardHTML).join('')}
                    </div>
                </div>`;
        }

        // ---- Navigation / deep-linking (re-implemented; same behaviour) ----
        function handleNavigation() {
            const geneFromURL = getCurrentGeneFromURL();
            if (geneFromURL) {
                const gene = (window.allGenes || []).find(g =>
                    (g.gene || g.Gene)?.toUpperCase() === geneFromURL ||
                    getCleanArray(g, 'Synonym.').some(s => s.toUpperCase() === geneFromURL) ||
                    getCleanArray(g, 'ensembl_gene_id.x.x').some(id => id.toUpperCase() === geneFromURL)
                ) || resolveGene(geneFromURL);
                if (gene) { displayIndividualGenePage(gene); }
                else {
                    displayHomePage();
                    setTimeout(() => {
                        const sm = document.getElementById('status-message');
                        if (sm) { sm.innerHTML = `<span class="ch-status-err">Gene "${escapeHtml(geneFromURL)}" not found in database</span>`; sm.style.display = 'block'; }
                    }, 100);
                }
            } else {
                displayHomePage();
            }
        }

        // ---- Init ----
        async function initializeApp() {
            const ok = await loadMasterData();
            if (!ok) {
                document.getElementById('page-content').innerHTML = `
                    <div class="ch-shell"><div class="ch-error">
                        <h1>Data Loading Error</h1>
                        <p>Failed to load gene data. The site requires
                        <code>data/genes/ciliahub_master_merged.json</code> at this origin.
                        Try a hard reload (Cmd/Ctrl+Shift+R); if it persists, check the browser console.</p>
                    </div></div>`;
                return;
            }
            handleNavigation();
            window.addEventListener('popstate', handleNavigation);
            window.addEventListener('hashchange', handleNavigation);
        }

        document.addEventListener('DOMContentLoaded', initializeApp);

    </script>

/* Gold Standard Ciliary Genes — self-contained export from the loaded catalogue.
   Filters window.CiliAI.masterData on evidence_tier; no extra scripts required. */
window.chDownloadGold = function (fmt, btn) {
    var md = (window.CiliAI && window.CiliAI.masterData) || [];
    if (!md.length) { alert('Gene catalogue is still loading — please try again in a moment.'); return; }
    var gold = md.filter(function (g) { return String(g.evidence_tier || '') === 'Gold Standard Ciliary Genes'; });
    if (!gold.length) { alert('No Gold Standard genes found in the loaded catalogue.'); return; }
    var orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }
    function cell(v) {
        if (v == null) return '';
        if (Array.isArray(v)) v = v.map(function (x) { return x == null ? '' : (typeof x === 'object' ? JSON.stringify(x) : String(x)); }).join('; ');
        else if (typeof v === 'object') v = JSON.stringify(v);
        else v = String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }
    try {
        var blob, fname;
        if (fmt === 'json') {
            var payload = {
                source: 'CiliaHub', url: 'https://ciliahub.org', generated: new Date().toISOString(),
                evidence_tier: 'Gold Standard Ciliary Genes', n_genes: gold.length,
                description: 'Gold Standard Ciliary Genes — curated bona-fide ciliary genes from CiliaHub.',
                genes: gold
            };
            blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            fname = 'ciliahub_gold_standard_ciliary_genes.json';
        } else {
            var cols = {};
            gold.forEach(function (g) { Object.keys(g).forEach(function (k) { cols[k] = true; }); });
            var headers = Object.keys(cols);
            var lines = [headers.map(cell).join(',')];
            gold.forEach(function (g) { lines.push(headers.map(function (h) { return cell(g[h]); }).join(',')); });
            blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            fname = 'ciliahub_gold_standard_ciliary_genes.csv';
        }
        var url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = fname; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 120);
    } catch (e) { alert('Download failed: ' + ((e && e.message) || e)); }
    finally { if (btn) { btn.textContent = orig; btn.disabled = false; } }
};
</script>

        ];
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        var MONTHS = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
        function fmtDate(s) { var p = String(s).split(' '); return (p.length === 3 && MONTHS[p[1]]) ? p[0] + ' ' + MONTHS[p[1]] + ' ' + p[2] : String(s); }
        function itemHTML(it) {
            var cls = it.badge === 'gold' ? 'gold' : 'assoc';
            var label = it.badge === 'gold' ? 'GOLD STANDARD' : 'CILIA-ASSOCIATED';
            var links = '';
            if (it.doi) links += '<a class="ch-wn-doi" href="https://doi.org/' + esc(it.doi) + '" target="_blank" rel="noopener">doi.org/' + esc(it.doi) + '</a>';
            if (it.pmid) links += '<a class="ch-wn-doi" href="https://pubmed.ncbi.nlm.nih.gov/' + esc(it.pmid) + '/" target="_blank" rel="noopener">PMID ' + esc(it.pmid) + '</a>';
            return '<div class="ch-wn-item">'
                + '<div class="ch-wn-sym"><a href="/ciliahub.html?gene=' + esc(it.gene) + '">' + esc(it.gene) + '</a></div>'
                + '<div class="ch-wn-body">'
                + esc(it.name) + ' <span class="ch-wn-badge ' + cls + '">' + label + '</span><br>'

        }
        function groupsHTML() {
            var out = '', i = 0;
            while (i < WHATS_NEW.length) {
                var d = WHATS_NEW[i].date, its = '';
                while (i < WHATS_NEW.length && WHATS_NEW[i].date === d) { its += itemHTML(WHATS_NEW[i]); i++; }
                out += '<div class="ch-wn-group"><span class="ch-wn-datebar">Added ' + esc(fmtDate(d)) + '</span>' + its + '</div>';
            }
            return out;
        }
        function clearStale() {
            // Remove any legacy/duplicate What's New nodes (old div-overlay builds, cached or stacked).
            var nodes = document.querySelectorAll('#ch-wn-overlay, .ch-wn-overlay');
            for (var i = 0; i < nodes.length; i++) { if (nodes[i].remove) nodes[i].remove(); }
        }
        function build() {
            clearStale();
            var ex = document.getElementById('ch-wn-dialog');
            if (ex) return ex;
            var d = document.createElement('dialog');
            d.id = 'ch-wn-dialog'; d.className = 'ch-wn-dialog';
            d.setAttribute('aria-label', "What's New");
            var CSS = '<style>'
                + 'dialog.ch-wn-dialog{padding:0;border:none;background:transparent;max-width:480px;width:92vw;max-height:82vh;overflow:visible}'
                + 'dialog.ch-wn-dialog::backdrop{background:rgba(16,40,55,.4)}'
                + '.ch-wn{--ch-wn-accent:#1f7a8c;--ch-wn-gold:#b8860b;--ch-wn-assoc:#5a7d9a;position:relative;margin:0;max-width:none;max-height:82vh;overflow-y:auto;padding:20px 22px;border:1px solid #e3e8ee;border-radius:14px;background:#fbfdff;font-family:inherit;box-shadow:0 8px 30px rgba(0,0,0,.18)}'

            d.innerHTML = '<section class="ch-wn" aria-label="Recent additions to CiliaHub">'

            d.addEventListener('cancel', function () { close(); }); // Esc

        }
        function open() {
            var d = build();
            if (d.open) return;
            if (typeof d.showModal === 'function') { try { d.showModal(); return; } catch (e) {} }

            d.setAttribute('open', '');

        }

            var d = document.getElementById('ch-wn-dialog');
