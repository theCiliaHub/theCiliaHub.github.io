<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CiliAI — Unified Explorer</title>

  <!-- Font (optional) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- UI CSS -->
  <link rel="stylesheet" href="ciliai_ui.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main">
      <div class="topbar">
        <div class="meta"><strong>CiliAI</strong> — Unified Explorer</div>
        <div class="status" id="dataStatus">Loading data…</div>
      </div>
      <div class="content">
        <div class="card left-panel" id="left-panel"></div>
        <div class="card right-panel" id="right-panel"></div>
      </div>
    </main>
  </div>

  <!-- === LOAD EXISTING DATA/API FILE (your original ciliai.js) ===
       Make sure the path below matches the file location in your repo.
       This script provides: loadCiliAIData(), initCiliAI(), window.CiliAI, etc.
  -->
  <script src="ciliai/ciliai.js"></script>

  <!-- UI + Plotting Layer that replaces old plot code and wires UI to the data API -->
  <link rel="stylesheet" href="ciliai_ui.css">
  <script src="ciliai/ciliai.js"></script>
   <script src="ciliai_ui.js"></script>
</body>
</html>
