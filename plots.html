// --- TSV Parsing Helper (UNCHANGED) ---
function parseTsvData(tsvText) {
    const data = {};
    const lines = tsvText.split('\n').filter(line => line.trim() !== '');
    if (lines.length <= 1) return data;

    const headers = lines[0].split('\t').map(h => h.trim());
    const geneNameIndex = headers.indexOf('Gene name');
    const tissueIndex = headers.indexOf('Tissue');
    const nTPMIndex = headers.indexOf('nTPM');

    if (geneNameIndex === -1 || tissueIndex === -1 || nTPMIndex === -1) {
        console.error("TSV headers missing: 'Gene name', 'Tissue', or 'nTPM'");
        return data;
    }

    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split('\t').map(v => v.trim());
        if (values.length > tissueIndex) {
            const geneName = values[geneNameIndex];
            let tissue = values[tissueIndex];
            const nTPM = parseFloat(values[nTPMIndex]);

            if (tissue.toLowerCase() === 'cilia') continue; 

            if (geneName && !isNaN(nTPM)) {
                if (!data[geneName]) data[geneName] = {};
                data[geneName][tissue] = nTPM;
            }
        }
    }
    return data;
}

// --- FIXED PHYLOGENETIC DATA INTEGRATION ---
function integratePhylogenyData(geneMap, liMatrix, neversMatrix) {
    let liIntegrated = 0;
    let neversIntegrated = 0;
    
    console.log("Integrating phylogenetic data into gene objects...");
    
    // Integrate Nevers 2017 data (uses gene symbols as keys)
    if (neversMatrix && neversMatrix.genes) {
        Object.entries(neversMatrix.genes).forEach(([geneKey, phyloData]) => {
            if (geneKey && phyloData && phyloData.g) {
                const geneSymbol = phyloData.g.toUpperCase();
                const gene = geneMap.get(geneSymbol);
                if (gene) {
                    if (!gene.phylogeny) gene.phylogeny = {};
                    gene.phylogeny.nevers_2017 = {
                        species_data: phyloData.s || [],
                        species_count: (phyloData.s || []).length,
                        gene_name: phyloData.g
                    };
                    neversIntegrated++;
                }
            }
        });
    }
    
    // Integrate Li 2014 data (uses Entrez IDs as keys, but has gene names in 'g' field)
    if (liMatrix && liMatrix.genes) {
        Object.values(liMatrix.genes).forEach(phyloData => {
            if (phyloData && phyloData.g) {
                const geneSymbol = phyloData.g.toUpperCase();
                const gene = geneMap.get(geneSymbol);
                if (gene) {
                    if (!gene.phylogeny) gene.phylogeny = {};
                    gene.phylogeny.li_2014 = {
                        species_data: phyloData.s || [],
                        class: phyloData.c,
                        entrez_id: phyloData.e,
                        gene_name: phyloData.g
                    };
                    liIntegrated++;
                }
            }
        });
    }
    
    console.log(`Integrated phylogenetic data: ${neversIntegrated} genes from Nevers 2017, ${liIntegrated} genes from Li 2014`);
    return { liIntegrated, neversIntegrated };
}

/**
 * @loadMasterData - Loads data and constructs the necessary global structures.
 */
async function loadMasterData() {
    try {
        // 1. Fetch ALL data concurrently
        const [masterResp, lookupResp, liResp, neversResp, rnaResp] = await Promise.all([
            fetch(MASTER_DB),
            fetch(LOOKUP_DB),
            fetch(LI_PHYLO_MATRIX),
            fetch(NEVERS_PHYLO_MATRIX),
            fetch(RNA_TISSUE_TSV)
        ]);
        
        // 2. Process Master Data and Lookups
        const rawMasterData = await masterResp.json();
        const rawLookups = await lookupResp.json();
        
        // Set CiliAI lookups structure for internal consistency and future use
        window.CiliAI.lookups = rawLookups.lookups || {};
        window.CiliAI.masterData = Array.isArray(rawMasterData.masterData) ? rawMasterData.masterData : rawMasterData;

        // 3. Load phylogenetic matrices
        const liMatrix = await liResp.json();
        const neversMatrix = await neversResp.json();
        
        // UMAP Data Extraction (Check properties on rawMasterData or a nested 'data' object)
        const umapContainer = rawMasterData.data || rawMasterData; 
        if (umapContainer.umap_points && umapContainer.cell_expression) {
            window.CiliAI_UMAP = umapContainer.umap_points;
            window.CiliAI.cellDataCache = umapContainer.cell_expression; 
            console.log(`scRNA-seq UMAP data loaded successfully from Master DB. Total cells: ${umapContainer.umap_points.length}`);
        } else {
             console.warn(`scRNA-seq UMAP data not found within the Master DB structure. UMAP plot will not run.`);
        }

        // 4. Populate Gene Map (ciliaryGeneMap) with BASIC gene data first
        window.CiliAI.masterData.forEach(g => {
            if (g.Gene) {
                // Create basic gene object first
                const gene = { 
                    ...g, 
                    gene: g.Gene,
                    phylogeny: {} // Initialize empty phylogeny object
                };
                
                // Populate ciliaryGeneMap with the basic object
                ciliaryGeneMap.set(g.Gene.toUpperCase(), gene);
                
                // Ensure geneMap exists for complex/domain lookup consistency 
                if (!window.CiliAI.lookups.geneMap) window.CiliAI.lookups.geneMap = {};
                window.CiliAI.lookups.geneMap[g.Gene.toUpperCase()] = gene;
            }
        });

        // 5. CRITICAL: INTEGRATE PHYLOGENETIC DATA PROPERLY
        const integrationResults = integratePhylogenyData(ciliaryGeneMap, liMatrix, neversMatrix);
        
        // 6. Load RNA tissue data
        const rnaText = await rnaResp.text();
        window.rnaTissueExpressionData = parseTsvData(rnaText);

        // Set the ready flag for CiliAI.js functions if ever used

// --- Data retrieval utility (CRITICAL FIXES FOR DATA KEY MISMATCH) ---
function getCleanArray(gene, key) {
    let data = gene[key];
    
    // 1. Handle Complex Key Mismatch: Map 'Protein.complexes' to 'complex_components'
    if (key === 'Protein.complexes') {
         // Check 'complex_components' first, then fallback to 'Protein.complexes'
         data = gene['complex_components'] || gene['Protein.complexes'];
         if (typeof data === 'object' && !Array.isArray(data)) {
             // If data is an object (e.g., {"Nuclear pore complex": [...]}), return the keys
             return Object.keys(data).map(k => `${k}`);
         }
    }

    // 2. Handle Mouse Phenotype Key Mismatch: Use fallback to 'mouse_phenotype'
    if (key === 'Phenotypes_mouse') {
        // Check Phenotypes_mouse first, then fallback to mouse_phenotype
        data = gene['Phenotypes_mouse'] || gene['mouse_phenotype'];
    }

    // 3. Handle PFAM Domain Key Mismatch: Combine IDs and Descriptions (for Plotting)
    if (key === 'Protein.Domain.PFAM' && Array.isArray(gene['Domain_Descriptions'])) {
         // Use raw Domain_Descriptions data which is present in your object structure
         const pfamIds = gene['PFAM_IDs'] || [];
         const combined = gene['Domain_Descriptions'].map((desc, i) => `${pfamIds[i] || 'PFAM_ID'}: ${desc}`);
         return combined.filter(s => s.trim() !== 'PFAM_ID: NULL/MISSING' && s.trim() !== 'PFAM_ID: No description');
    }

    // 4. Handle Screens Summary (Array of Objects)
    if (key === 'screens_summary' && Array.isArray(data)) return data; 
    
    if (!data) return [];
    
    // 5. Split and Filter (for string fields like Localization, Phenotypes_mouse)
    if (Array.isArray(data)) return data.map(i => String(i).trim()).filter(Boolean);
    return String(data).split(/[,;]/).map(i => i.trim()).filter(Boolean);
}

function findGenes(input) {
    const queries = input
        .split(/[\s,\n;]+/)
        .map(s => s.trim().replace(/\u200B/g, '').toUpperCase())
        .filter(Boolean);
        
    const found = [];
    const seen = new Set();
    
    queries.forEach(q => {
        if (!seen.has(q) && ciliaryGeneMap.has(q)) {
            found.push(ciliaryGeneMap.get(q));
            seen.add(q);
        }
    });
    // This ensures the found genes are the enriched objects
    return found; 
}

    // * UMAP PLOT (scRNA-seq Lung) - Uses the CiliAI global variables
    async function renderScrnaUMAPPlot(geneSymbol) { 
        const plotDivId = 'plot-display-area';
        
        // Use the globally populated variables (Matching CiliAI.js style)
        const globalUmapData = window.CiliAI_UMAP || []; 
        const globalCellDataCache = window.CiliAI.cellDataCache || {}; 
        
        const plotDiv = document.getElementById(plotDivId);
        const gene = geneSymbol ? geneSymbol.toUpperCase() : 'FOXJ1'; 

        if (!plotDiv) {
            console.error('UMAP plot container not found.');
            return;
        }
        
        if (globalUmapData.length === 0 || Object.keys(globalCellDataCache).length === 0) {
            // ERROR 4 FIX: Message remains, but the reason is now understood: data is truly absent.
            plotDiv.innerHTML = `<div id="cilia-svg" style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:16px;">UMAP data is not available (Missing coordinates or expression cache).</div>`;
            return;
        }

        plotDiv.innerHTML = '<div id="cilia-svg" style="width: 100%; height: 100%;"></div>';
        const umapPlotDiv = document.getElementById('cilia-svg');

        // 1. Fetch Expression Data and prepare arrays
        const geneExpressionData = globalCellDataCache[gene] || {};
        
        const sampleSize = 15000;
        const sampledData = [];
        const colorArray = [];
        const sizeArray = []; 
        let maxExpression = 0;
        const sizeBase = 5; 
        const sizeScaleMax = 12; 

        const sourceData = globalUmapData.length > sampleSize 
                        ? globalUmapData.sort(() => 0.5 - Math.random()).slice(0, sampleSize) 
                        : globalUmapData;

        for (const point of sourceData) {
            const expressionValue = geneExpressionData[point.cell_type] || 0;
            sampledData.push(point);
            colorArray.push(expressionValue);
            if (expressionValue > maxExpression) { maxExpression = expressionValue; }
        }

        const sizeScaleMaxExpression = maxExpression > 0 ? maxExpression : 1;
        // Calculate size based on dynamic expression
        for (const expressionValue of colorArray) {
            const scaledMagnitude = expressionValue / sizeScaleMaxExpression; 
            sizeArray.push(sizeBase + (sizeScaleMax - sizeBase) * scaledMagnitude);
        }
        
        if (maxExpression === 0 && gene) {
            console.warn(`Gene ${gene} found, but has no detectable expression.`);
        }
        
        // --- Annotations (Cell Type Labels) ---
        const cellTypes = [...new Set(sampledData.map(d => d.cell_type))];
        const annotations = [];
        const median = arr => {
            const sorted = [...arr].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        };
        for (const ct of cellTypes) {
            if (!ct) continue;
            const pts = sampledData.filter(d => d.cell_type === ct);
            if (pts.length === 0) continue;
            const xs = pts.map(p => p.x);
            const ys = pts.map(p => p.y);
            annotations.push({
                x: median(xs),
                y: median(ys),
                text: ct,
                showarrow: false,
                font: { color: '#FFFFFF', size: 10, family: 'Arial, sans-serif' },
                bgcolor: 'rgba(0,0,0,0.45)', borderpad: 2, bordercolor: 'rgba(0,0,0,0.45)', borderwidth: 1,
                xref: 'x', yref: 'y'
            });
        }

        const colorScaleRedGradient = [
            [0, '#F8F8F8'], 
            [0.0001, '#FFDAD0'], 
            [1, '#E60000'] 
        ];
        
        const plotData = [{
            x: sampledData.map(p => p.x),
            y: sampledData.map(p => p.y),
            text: sampledData.map((p, i) => `Cell Type: ${p.cell_type}<br>Expression: ${colorArray[i].toFixed(3)}`),
            mode: 'markers',
            type: 'scattergl',
            hoverinfo: 'text',
            marker: {
                color: colorArray, 
                colorscale: colorScaleRedGradient, 
                cmin: 0,
                cmax: maxExpression > 0 ? maxExpression : 0.0001,
                colorbar: { title: `${gene} Expr. (TPM)` },
                size: sizeArray, 
                opacity: 0.8
            }
        }];

        const layout = {
            title: { 
                text: `UMAP: <b>${gene}</b> Expression (Size & Color Mapped)`,
                font: { size: 24, color: "var(--primary)" }
            },
            xaxis: { title: 'UMAP 1', zeroline: false, showgrid: false },
            yaxis: { title: 'UMAP 2', zeroline: false, showgrid: false },
            hovermode: 'closest',
            margin: { t: 50, b: 50, l: 50, r: 50 },
            plot_bgcolor: '#FFFFFF',
            paper_bgcolor: '#F8F8F8',
            annotations: annotations,
            showlegend: false
        };

        Plotly.newPlot(umapPlotDiv, plotData, layout, { responsive: true, displayModeBar: true, scrollZoom: true });
    }
    window.renderScrnaUMAPPlot = renderScrnaUMAPPlot;

function renderMultiCategoryManhattan(genes, custom) {

// 3. Phylogenetic Conservation Heatmap
// --- FIXED PHYLOGENETIC HEATMAP FUNCTION ---
function renderPhylogenyHeatmap(genes, custom) {
    clearPlot();
    const source = custom.source;
    const isLi = source === 'li_2014';
    // Define the ordered list of organisms to display (CIL followed by NCIL)
    const displayedCIL = isLi ? LI_CIL_ORG : NEVERS_CIL_PANEL;
    const displayedNCIL = isLi ? LI_NCIL_ORG : NEVERS_NCIL_PANEL;
    const orgs = [...displayedCIL, ...displayedNCIL];

    const z = [];
    const yLabels = [];
    const textMatrix = [];
    let totalPresenceCount = 0;
    
    // Get the appropriate master organism list
    const masterOrgList = isLi ? 
        (window.liPhylogenyCache?.summary?.organisms_list || []) :
        (window.neversPhylogenyCache?.organism_groups?.all_organisms_list || []);
    
    const masterOrgMap = new Map(masterOrgList.map((name, index) => [name.toUpperCase(), index]));

    genes.forEach(gene => {
        const geneSymbol = gene.gene || gene.Gene;
        const phyData = gene.phylogeny?.[source];
        const row = [];
        const textRow = [];
        
        if (!phyData || !phyData.species_data || !Array.isArray(phyData.species_data)) {
            // No phylogeny data for this gene
            orgs.forEach(org => {
                row.push(0); // Absent
                textRow.push(`Gene: ${geneSymbol}<br>Organism: ${org}<br>Status: No Data`);
            });
        } else {
            // We have phylogeny data - map to display organisms
            const presenceIndices = new Set(phyData.species_data);
            
            orgs.forEach((displayOrg, index) => {
                const isCiliated = index < displayedCIL.length;
                let status = 0; // Default: absent
                
                // Find the master index for this display organism
                let masterIndex = -1;
                
                if (isLi) {
                    // For Li data: map display names to master list indices
                    masterIndex = masterOrgMap.get(displayOrg.toUpperCase());
                } else {
                    // For Nevers data: try exact match first, then partial
                    masterIndex = masterOrgMap.get(displayOrg.toUpperCase());
                    if (masterIndex === undefined) {
                        // Try partial matching for Nevers organisms with strain info
                        for (const [masterOrg, idx] of masterOrgMap.entries()) {
                            if (masterOrg.includes(displayOrg.toUpperCase()) || 
                                displayOrg.toUpperCase().includes(masterOrg)) {
                                masterIndex = idx;
                                break;
                            }
                        }
                    }
                }

                if (masterIndex !== undefined && masterIndex !== -1 && presenceIndices.has(masterIndex)) {
                    status = isCiliated ? 2 : 1; // 2=Ciliated, 1=Non-Ciliated
                    totalPresenceCount++;
                    textRow.push(`Gene: ${geneSymbol}<br>Organism: ${displayOrg}<br>Status: Present`);
                } else {
                    textRow.push(`Gene: ${geneSymbol}<br>Organism: ${displayOrg}<br>Status: Absent`);
                }
                row.push(status);
            });
        }
        
        z.push(row);
        yLabels.push(geneSymbol);
        textMatrix.push(textRow);
    });

    // Check if we have any data to display
    if (totalPresenceCount === 0) {
        document.getElementById('plot-display-area').innerHTML = 
            `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
                No phylogenetic conservation data found for the selected genes in the ${isLi ? 'Li et al. 2014' : 'Nevers et al. 2017'} database.
                <br><br>
                <small>This could mean:
                <ul style="text-align: left; display: inline-block;">
                    <li>The genes are not present in the phylogenetic matrix</li>
                    <li>There was an issue loading the phylogenetic data</li>
                    <li>The organism mapping needs adjustment</li>
                </ul>
                </small>
            </div>`;
        return;
    }

    // Add separator line between CIL and NCIL panels
    const separatorIndex = displayedCIL.length - 0.5;
    
    const data = [{
        type: 'heatmap', 
        z: z, 
        x: orgs.map(shortenOrganismName),
        y: yLabels, 
        customdata: textMatrix,
        colorscale: [
            [0, '#F0F0F0'],     // Absent - light gray
            [0.0001, '#FFE5B5'], // Non-ciliated present - light orange
            [1, '#FFE5B5'],      // Non-ciliated present  
            [1.0001, '#698ECF'], // Ciliated present - blue
            [2, '#698ECF']       // Ciliated present
        ],
        showscale: false,
        hovertemplate: '%{customdata}<extra></extra>',
        xgap: 0.5,
        ygap: 0.5
    }];

    const layout = {
        title: { 
            text: custom.title || `Phylogenetic Conservation Heatmap (${isLi ? 'Li et al. 2014' : 'Nevers et al. 2017'})`,
            font: { size: custom.titleFontSize || 16 }
        },
        width: custom.figureWidth || 1000, 
        height: custom.figureHeight || Math.max(500, genes.length * 40 + 200),
        xaxis: { 
            title: 'Organisms', 
            tickangle: -45,
            tickfont: { size: 9 },
            tickvals: Array.from({length: orgs.length}, (_, i) => i),
            ticktext: orgs.map(shortenOrganismName),
            showgrid: false, 
            zeroline: false, 
            side: 'top', 
            automargin: true
        },
        yaxis: { 
            title: 'Genes', 
            automargin: true, 
            tickfont: { size: 11 } 
        },
        margin: { l: 100, r: 20, t: 120, b: 200 },
        shapes: [{
            type: 'line', 
            xref: 'x', 
            yref: 'paper', 
            x0: separatorIndex, 
            x1: separatorIndex,
            y0: 0, 
            y1: 1, 
            line: { color: 'black', width: 2 } 
        }],
        annotations: [
            { 
                text: 'CILIATED', 
                xref: 'x', 
                yref: 'paper', 
                x: (displayedCIL.length - 1) / 2, 
                y: 1.05, 
                showarrow: false, 
                font: { color: '#698ECF', size: 12, weight: 'bold' }, 
                xanchor: 'center' 
            },
            { 
                text: 'NON-CILIATED', 
                xref: 'x', 
                yref: 'paper', 
                x: displayedCIL.length + (displayedNCIL.length / 2) - 0.5, 
                y: 1.05,
                showarrow: false, 
                font: { color: '#d62728', size: 12, weight: 'bold' }, 
                xanchor: 'center' 
            }
        ]
    };
    
    Plotly.newPlot('plot-display-area', data, layout, { responsive: true });
}

    // 8. Protein Domain Architecture Heatmap
    // --- FIXED getCleanArray FUNCTION ---
function getCleanArray(gene, key) {
    let data = gene[key];
    
    // 1. Handle Complex Key Mismatch: Map 'Protein.complexes' to 'complex_components'
    if (key === 'Protein.complexes') {
         // Check 'complex_components' first, then fallback to 'Protein.complexes'
         data = gene['complex_components'] || gene['Protein.complexes'];
         if (typeof data === 'object' && !Array.isArray(data)) {
             // If data is an object (e.g., {"Nuclear pore complex": [...]}), return the keys
             return Object.keys(data).map(k => `${k}`);
         }
    }

    // 2. Handle Mouse Phenotype Key Mismatch: Use fallback to 'mouse_phenotype'
    if (key === 'Phenotypes_mouse') {
        // Check Phenotypes_mouse first, then fallback to mouse_phenotype
        data = gene['Phenotypes_mouse'] || gene['mouse_phenotype'];
    }

    // 3. Handle PFAM Domain Key Mismatch: Combine IDs and Descriptions (for Plotting)
    if (key === 'Protein.Domain.PFAM' && Array.isArray(gene['Domain_Descriptions'])) {
         // Use raw Domain_Descriptions data which is present in your object structure
         const pfamIds = gene['PFAM_IDs'] || [];
         const combined = gene['Domain_Descriptions'].map((desc, i) => `${pfamIds[i] || 'PFAM_ID'}: ${desc}`);
         return combined.filter(s => s.trim() !== 'PFAM_ID: NULL/MISSING' && s.trim() !== 'PFAM_ID: No description');
    }

    // 4. Handle Screens Summary (Array of Objects)
    if (key === 'screens_summary' && Array.isArray(data)) return data; 
    
    if (!data) return [];
    
    // 5. Split and Filter (for string fields like Localization, Phenotypes_mouse)
    if (Array.isArray(data)) return data.map(i => String(i).trim()).filter(Boolean);
    return String(data).split(/[,;]/).map(i => i.trim()).filter(Boolean);
}

        if (tissueArray.length === 0) {
            document.getElementById('plot-display-area').innerHTML = 
                `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
                    No expression data found for the selected genes.
                </div>`;
            return;
        }

        const z = [];
        let maxNTPM = 0;
        
        geneSymbols.forEach(symbol => {
            const row = [];
            const exprData = window.rnaTissueExpressionData[symbol] || {};
            
            tissueArray.forEach(tissue => {
                const nTPM = exprData[tissue] || 0;
                row.push(nTPM);
                if (nTPM > maxNTPM) maxNTPM = nTPM;
            });
            
            z.push(row);
        });

        const data = [{
            type: 'heatmap', 
            z: z, 
            x: tissueArray, 
            y: geneSymbols,
            colorscale: [
                [0, '#f7fbff'],
                [0.2, '#c6dbef'],
                [0.4, '#6baed6'],
                [0.6, '#3182bd'],
                [0.8, '#08519c'],
                [1, '#08306b']
            ],
            colorbar: { 
                title: 'nTPM',
                titleside: 'right'
            },
            hovertemplate: 'Gene: %{y}<br>Tissue: %{x}<br>nTPM: %{z:.2f}<extra></extra>'
        }];

        const layout = {
            title: { 
                text: custom.title || "Tissue Expression Profile (nTPM)",
                font: { size: custom.titleSize }
            },
            xaxis: { 
                tickangle: -45, 
                automargin: true,
                tickfont: { size: 10 }
            },
            yaxis: { 
                automargin: true,
                tickfont: { size: 11 }
            },
            height: custom.height,
            width: custom.width,
            margin: { t: 80, l: 120, r: 80, b: 120 }
        };
        
        Plotly.newPlot('plot-display-area', data, layout, { responsive: true });
    }

// MAIN GENERATOR 
function generatePlot() {
    const input = document.getElementById('ciliaplot-genes-input').value.trim();
    if (!input) {
        alert("Please enter at least one gene symbol.");
        return;
    }

    const type = document.getElementById('analysis-dropdown').value; 

    if (!type) {
         alert("Please select a plot type.");
         return;
    }

    const plotArea = document.getElementById('plot-display-area');
    plotArea.innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:18px;">Searching genes and generating plot...</div>';

    const queries = input.split(/[\s,\n;]+/).map(s => s.trim().replace(/\u200B/g, '').toUpperCase()).filter(Boolean);
    const genes = findGenes(input);
    const custom = getCustom();

    if (genes.length === 0) {
        plotArea.innerHTML = `
            <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#d62728; font-size:18px; text-align:center; padding:40px;">
                <strong>No genes found in the CiliaHub database</strong><br><br>
                <small>Entered: ${queries.slice(0, 10).join(', ')}${queries.length > 10 ? '...' : ''}</small>
            </div>`;
        return;
    }

    console.log(`Found ${genes.length} unique gene(s): ${genes.map(g => g.gene).join(', ')}`);

    // DEBUG: Check phylogenetic data for troubleshooting
    if (type === 'phylogeny') {
        debugPhylogenyData(genes);
    }

    const renderers = {
        'gene_overview': renderMultiCategoryManhattan, 
        'expression_heatmap': renderExpressionHeatmap,
        'scrna_dot': window.renderScrnaUMAPPlot, 
        'ciliopathy': renderCiliopathyPlot,
        'localization_heatmap': renderLocalizationHeatmap,
        'crispr_screens': renderScreenSummaryHeatmap,
        'protein_domains': renderDomainArchitecture,
        'protein_complex': renderComplexNetwork, 
        'mouse_phenotypes': renderMousePhenotypeHeatmap,
        'phylogeny': renderPhylogenyHeatmap 
    };

    const renderer = renderers[type];

    if (!renderer) {
        plotArea.innerHTML = `
            <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:20px;">
                Plot type "${type}" not implemented or mapped yet.
            </div>`;
        return;
    }

    try {
        // Special handling for UMAP to pass the primary gene symbol
        if (type === 'scrna_dot') {
            const geneSymbol = genes[0].gene; // Use the first gene found
            renderer(geneSymbol); 
        } else {
            renderer(genes, custom);
        }
    } catch (error) {
        console.error("Plot rendering error:", error);
        plotArea.innerHTML = `
            <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e74c3c; font-size:18px; text-align:center;">
                <strong>Plot failed to render</strong><br><br>
                <small>${error.message}</small><br><br>
                <button onclick="generatePlot()" style="padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">
                    Try Again
                </button>
            </div>`;
    }
}

// --- ADD DEBUG FUNCTION TO CHECK PHYLOGENY DATA ---
function debugPhylogenyData(genes) {
    console.log("=== PHYLOGENY DATA DEBUG ===");
    console.log("Checking phylogenetic data for genes:", genes.map(g => g.gene).join(', '));
    
    genes.forEach(gene => {
        console.log(`\nGene: ${gene.gene}`);
        
        // Check integrated data
        const neversData = gene.phylogeny?.nevers_2017;
        const liData = gene.phylogeny?.li_2014;
        
        console.log(`  Integrated Nevers 2017:`, neversData ? 
            `PRESENT (${neversData.species_count} species, ${neversData.species_data?.length} indices)` : 'NO DATA');
        console.log(`  Integrated Li 2014:`, liData ? 
            `PRESENT (${liData.species_data?.length} species)` : 'NO DATA');
        
        // Check direct matrix access
        const neversDirect = window.neversPhylogenyCache?.genes?.[gene.gene.toUpperCase()];
        const liDirect = Object.values(window.liPhylogenyCache?.genes || {}).find(g => g.g && g.g.toUpperCase() === gene.gene.toUpperCase());
        
        console.log(`  Direct Nevers matrix:`, neversDirect ? 
            `PRESENT (${neversDirect.s?.length} indices)` : 'NOT FOUND');
        console.log(`  Direct Li matrix:`, liDirect ? 
            `PRESENT (${liDirect.s?.length} indices)` : 'NOT FOUND');
        
        // Sample data for verification
        if (neversData && neversData.species_data) {
            console.log(`  Nevers sample indices:`, neversData.species_data.slice(0, 5));
        }
        if (liData && liData.species_data) {
            console.log(`  Li sample indices:`, liData.species_data.slice(0, 5));
        }
    });
    
    // Check if phylogenetic caches are loaded
    console.log("\nPhylogeny Cache Status:");
    console.log("Nevers cache loaded:", !!window.neversPhylogenyCache);
    console.log("Li cache loaded:", !!window.liPhylogenyCache);
    
    if (window.neversPhylogenyCache) {
        console.log("Nevers organisms count:", window.neversPhylogenyCache.organism_groups?.all_organisms_list?.length);
        console.log("Nevers genes count:", Object.keys(window.neversPhylogenyCache.genes || {}).length);
    }
    if (window.liPhylogenyCache) {
        console.log("Li organisms count:", window.liPhylogenyCache.summary?.organisms_list?.length);
        console.log("Li genes count:", Object.keys(window.liPhylogenyCache.genes || {}).length);
    }
    
    console.log("=============================");
}
