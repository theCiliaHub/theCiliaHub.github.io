// --- TSV Parsing Helper (UNCHANGED) ---
function parseTsvData(tsvText) {
    const data = {};
    const lines = tsvText.split('\n').filter(line => line.trim() !== '');
    if (lines.length <= 1) return data;

    const headers = lines[0].split('\t').map(h => h.trim());
    const geneNameIndex = headers.indexOf('Gene name');
    const tissueIndex = headers.indexOf('Tissue');
    const nTPMIndex = headers.indexOf('nTPM');

    if (geneNameIndex === -1 || tissueIndex === -1 || nTPMIndex === -1) {
        console.error("TSV headers missing: 'Gene name', 'Tissue', or 'nTPM'");
        return data;
    }

    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split('\t').map(v => v.trim());
        if (values.length > tissueIndex) {
            const geneName = values[geneNameIndex];
            let tissue = values[tissueIndex];
            const nTPM = parseFloat(values[nTPMIndex]);

            if (tissue.toLowerCase() === 'cilia') continue; 

            if (geneName && !isNaN(nTPM)) {
                if (!data[geneName]) data[geneName] = {};
                data[geneName][tissue] = nTPM;
            }
        }
    }
    return data;
}

// --- PHYLOGENETIC DATA INTEGRATION ---
function integratePhylogenyData(geneMap, liMatrix, neversMatrix) {
    let liIntegrated = 0;
    let neversIntegrated = 0;
    
    console.log("Integrating phylogenetic data into gene objects...");
    
    // Integrate Nevers 2017 data
    if (neversMatrix && neversMatrix.genes) {
        Object.entries(neversMatrix.genes).forEach(([geneKey, phyloData]) => {
            if (geneKey && phyloData && phyloData.g) {
                const geneSymbol = phyloData.g.toUpperCase();
                const gene = geneMap.get(geneSymbol);
                if (gene) {
                    if (!gene.phylogeny) gene.phylogeny = {};
                    gene.phylogeny.nevers_2017 = {
                        species_data: phyloData.s || [],
                        species_count: (phyloData.s || []).length,
                        gene_name: phyloData.g
                    };
                    neversIntegrated++;
                }
            }
        });
    }
    
    // Integrate Li 2014 data
    if (liMatrix && liMatrix.genes) {
        Object.values(liMatrix.genes).forEach(phyloData => {
            if (phyloData && phyloData.g) {
                const geneSymbol = phyloData.g.toUpperCase();
                const gene = geneMap.get(geneSymbol);
                if (gene) {
                    if (!gene.phylogeny) gene.phylogeny = {};
                    gene.phylogeny.li_2014 = {
                        species_data: phyloData.s || [],
                        class: phyloData.c,
                        entrez_id: phyloData.e,
                        gene_name: phyloData.g
                    };
                    liIntegrated++;
                }
            }
        });
    }
    
    console.log(`Integrated phylogenetic data: ${neversIntegrated} genes from Nevers 2017, ${liIntegrated} genes from Li 2014`);
    return { liIntegrated, neversIntegrated };
}

/**
 * @loadMasterData - Loads data and constructs the necessary global structures.
 */
async function loadMasterData() {
    try {
        // 1. Fetch ALL data concurrently (7 requests now: 5 existing + 2 UMAP)
        const [
            masterResp, lookupResp, liResp, neversResp, rnaResp,
            umapCoordResp, cellxgeneExprResp
        ] = await Promise.all([
            fetch(MASTER_DB),
            fetch(LOOKUP_DB),
            fetch(LI_PHYLO_MATRIX),
            fetch(NEVERS_PHYLO_MATRIX),
            fetch(RNA_TISSUE_TSV),
            fetch(UMAP_COORDINATES_DB),       // NEW UMAP COORDINATES
            fetch(CELLXGENE_EXPRESSION_DB)    // NEW EXPRESSION DATA
        ]);
        
        // 2. Process fetched JSON data
        const rawMasterData = await masterResp.json();
        const rawLookups = await lookupResp.json();
        
        // Populate Global Phylogeny Caches
        window.liPhylogenyCache = await liResp.json();
        window.neversPhylogenyCache = await neversResp.json();

        // Process new scRNA-seq data files
        // NOTE: These files are large and processing them may cause the reported delay/failure.
        const umapCoordinatesData = await umapCoordResp.json();
        const cellxgeneExpressionData = await cellxgeneExprResp.json();
        
        // Use local references for clarity in this function scope
        const liMatrix = window.liPhylogenyCache;
        const neversMatrix = window.neversPhylogenyCache;

        // Set CiliAI lookups structure
        window.CiliAI.lookups = rawLookups.lookups || {};
        window.CiliAI.masterData = Array.isArray(rawMasterData.masterData) ? rawMasterData.masterData : rawMasterData;

        // --- UMAP Data Assignment: CRITICAL STEP ---
        // 1. Check if the UMAP data is an array of points (coordinates)
        const isUmapValid = Array.isArray(umapCoordinatesData) && umapCoordinatesData.length > 0;
        // 2. Check if the Expression data is a non-empty object (gene map)
        const isExprValid = typeof cellxgeneExpressionData === 'object' && Object.keys(cellxgeneExpressionData).length > 0;

        if (isUmapValid && isExprValid) {
            // Success: Data is available in the expected array/object structure
            window.CiliAI_UMAP = umapCoordinatesData;
            window.CiliAI.cellDataCache = cellxgeneExpressionData;
            
            const totalCells = umapCoordinatesData.length;
            const totalGenes = Object.keys(cellxgeneExpressionData).length;
            console.log(`scRNA-seq UMAP data loaded successfully from dedicated files. Total cells: ${totalCells}. Total expressed genes: ${totalGenes}`);
            
        } else {
             // Failure: Keep variables empty and log warning
             console.warn(`scRNA-seq UMAP data not found in new dedicated files.`);
             window.CiliAI_UMAP = [];
             window.CiliAI.cellDataCache = {};
        }

        // 4. Populate Gene Map (ciliaryGeneMap) with BASIC gene data first
        window.CiliAI.masterData.forEach(g => {
            if (g.Gene) {
                // Create the base gene object
                const gene = { ...g, gene: g.Gene, phylogeny: {} };
                
                // Store Entrez ID for matrix lookup and debug checks
                if (g['Entrez.ID']) {
                    gene.entrezId = String(g['Entrez.ID']); 
                }
                
                ciliaryGeneMap.set(g.Gene.toUpperCase(), gene);
                
                if (!window.CiliAI.lookups.geneMap) window.CiliAI.lookups.geneMap = {};
                window.CiliAI.lookups.geneMap[g.Gene.toUpperCase()] = gene;
            }
        });

        // 5. CRITICAL: INTEGRATE PHYLOGENETIC DATA PROPERLY
        integratePhylogenyData(ciliaryGeneMap, liMatrix, neversMatrix);
        
        // 6. Load RNA tissue data
        const rnaText = await rnaResp.text();
        window.rnaTissueExpressionData = parseTsvData(rnaText);

        window.CiliAI.ready = true;
        console.log(`Loaded ${ciliaryGeneMap.size} genes and 7 external datasets.`);
        
    } catch (err) {
        console.error("Critical Data Loading Error:", err);
        document.getElementById('content-area').innerHTML = `<p style="color:red;padding:20px;">Error loading core data: ${err.message}. Please verify the data URLs.</p>`;
    }
}

function getCleanArray(gene, key) {
    // 1. Initialize data variable using the requested key
    let data = gene[key];
    
    // 1. Handle Complex Key Mismatch
    if (key === 'Protein.complexes') {
        data = gene['complex_components'] || gene['Protein.complexes'];
        if (typeof data === 'object' && !Array.isArray(data)) {
            return Object.keys(data).map(k => `${k}`);
        }
    }

    // 2. Handle Mouse Phenotype Key Mismatch
    if (key === 'Phenotypes_mouse') {
        data = gene['Phenotypes_mouse'] || gene['mouse_phenotype'];
    }

    // 3. Handle PFAM Domain Key Mismatch
    if (key === 'Protein.Domain.PFAM' && Array.isArray(gene['Domain_Descriptions'])) {
        const pfamIds = gene['PFAM_IDs'] || [];
        const combined = gene['Domain_Descriptions'].map((desc, i) => `${pfamIds[i] || 'PFAM_ID'}: ${desc}`);
        return combined.filter(s => s.trim() !== 'PFAM_ID: NULL/MISSING' && s.trim() !== 'PFAM_ID: No description');
    }

    // 4. RESTORED SCREEN LOGIC: Return the raw array of objects when requested.
    // This is crucial because renderScreenSummaryHeatmap iterates over these objects.
    if (key === 'screens_summary') {
        data = data || gene['screens']; // Fallback if data key is wrong
        if (Array.isArray(data)) return data; 
        // If data is null/undefined here, we proceed to return empty list.
    }
    
    // Check if data is null/undefined before attempting to process it
    if (!data) return [];
    
    // 5. Split and Filter (for string fields like Localization, Phenotypes_mouse)
    if (Array.isArray(data)) return data.map(i => String(i).trim()).filter(Boolean);
    
    // Final default return for string fields
    return String(data).split(/[,;]/).map(i => i.trim()).filter(Boolean);
}
   
function findGenes(input) {
    const queries = input
        .split(/[\s,\n;]+/)
        .map(s => s.trim().replace(/\u200B/g, '').toUpperCase())
        .filter(Boolean);
        
    const found = [];
    const seen = new Set();
    
    queries.forEach(q => {
        // Find the full gene object if it exists in the main map
        if (ciliaryGeneMap.has(q)) {
            if (!seen.has(q)) {
                found.push(ciliaryGeneMap.get(q));
                seen.add(q);
            }
        } else {
            // Include minimal object for genes not in the core map (for external data sources)
            if (!seen.has(q)) {
                found.push({ gene: q }); 
                seen.add(q);
            }
        }
    });
    return found; 
}

/**

 * FIX 2: Standardizes all axis and label fonts to size 18 and bold.
 * @param {Array} genes - Array of gene objects from main input.
 * @param {Object} custom - Customization settings (including source and gene2).
 */
function renderPhylogenyHeatmap(genes, custom) {
    clearPlot();
    
    // --- 1. Consolidate Gene List ---
    const primaryGeneSymbols = new Set(genes.map(g => g.gene.toUpperCase()));
    let finalGeneList = [...genes];

    if (custom.gene2) {
        const secondaryQueries = custom.gene2.split(/[\s,\n;]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
        secondaryQueries.forEach(q => {
            if (!primaryGeneSymbols.has(q)) {
                const geneObject = ciliaryGeneMap.get(q) || { gene: q, phylogeny: {} };
                finalGeneList.push(geneObject);
                primaryGeneSymbols.add(q);
            }
        });
    }

    if (finalGeneList.length === 0) {
        document.getElementById('plot-display-area').innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:16px;">No valid genes provided for analysis.</div>`;
        return;
    }
    
    // --- 2. Setup & Data Source Selection ---
    const plotDivId = 'plot-display-area';
    const source = custom.source || 'nevers_2017'; 
    const isLi = source === 'li_2014';
       
    const CIL_PANEL = isLi ? LI_CIL_ORG : NEVERS_CIL_ORG;
    const NCIL_PANEL = isLi ? LI_NCIL_ORG : NEVERS_NCIL_ORG;
    const allOrgNames = [...CIL_PANEL, ...NCIL_PANEL];

    const phyloCache = isLi ? window.liPhylogenyCache : window.neversPhylogenyCache;
    const masterOrgList = isLi ? (phyloCache.summary?.organisms_list || []) : (phyloCache.organism_groups?.all_organisms_list || []);
    
    // CRITICAL FIX for Li 2014: Master map keys must match the list generated by Li's parser, 
    // which are the keys provided in LI_CIL_ORG (e.g., 'H sapiens', not 'Homo sapiens').
    const masterOrgMap = new Map(masterOrgList.map((name, index) => [name, index])); 
       
    // --- 3. Species Filtering ---
    let organismsToDisplay = [];
    const selectedFilters = custom.speciesFilters;

    if (selectedFilters && selectedFilters.length > 0 && !selectedFilters.includes('all')) {
        const filteredOrgNamesSet = new Set();
        Object.values(PHYLO_SPECIES_GROUPS).flat().forEach(name => filteredOrgNamesSet.add(name));

        organismsToDisplay = allOrgNames.filter(name => 
            selectedFilters.some(groupKey => PHYLO_SPECIES_GROUPS[groupKey]?.includes(name) || PHYLO_SPECIES_GROUPS[groupKey]?.includes(shortenOrganismName(name)))
        );
    } else {
        organismsToDisplay = allOrgNames;
    }
    
    organismsToDisplay = Array.from(new Set(organismsToDisplay)).filter(Boolean);
    if (organismsToDisplay.length === 0) {
        organismsToDisplay = allOrgNames;
    }

    const orgs = organismsToDisplay;

    // --- 4. Data Processing and Scoring ---
    const z = [];
    const yLabels = [];
    const textMatrix = [];

    finalGeneList.forEach(gene => {
        const geneSymbol = gene.gene || gene.Gene;
        if (!gene.phylogeny) gene.phylogeny = {};
        
        const phyData = gene.phylogeny?.[source];
        const scores = calculatePhyloScores(gene)[source] || {}; 
        
        const row = [];
        const textRow = [];
        
        if (!phyData || !phyData.species_data || !Array.isArray(phyData.species_data)) {
            orgs.forEach(org => { 
                row.push(0); 
                textRow.push(`Gene: ${geneSymbol}<br>Organism: ${org}<br>Status: No Data (Check master DB)`); 
            });
        } else {
            const presenceIndices = new Set(phyData.species_data);
            
            orgs.forEach((displayOrg) => {
                const isCiliated = CIL_PANEL.includes(displayOrg);
                let status = 0;

                // Fix: The masterOrgKey *is* the key for the LI_CIL_ORG/NEVERS_CIL_PANEL lists.
                // We use this exact string to look up the index in the masterOrgMap.
                const masterOrgKey = displayOrg; 
                let masterIndex = masterOrgMap.get(masterOrgKey); 
                
                if (masterIndex !== undefined && masterIndex !== -1 && presenceIndices.has(masterIndex)) {
                    status = isCiliated ? 2 : 1; 
                    textRow.push(`Gene: ${geneSymbol}<br>Organism: ${displayOrg}<br>Status: Present in ${isCiliated ? 'Ciliated' : 'Non-Ciliated'} group`);
                } else {
                    textRow.push(`Gene: ${geneSymbol}<br>Organism: ${displayOrg}<br>Status: Absent`);
                }
                row.push(status);
            });
        }
        
        z.push(row);
        
        // Y-Axis FIX 1: Display only the Gene Symbol
        yLabels.push(geneSymbol); 
        textMatrix.push(textRow);
    });
    
    // --- 5. Plotly Setup ---
    
    const filteredCilCount = orgs.filter(name => CIL_PANEL.includes(name)).length;
    const separatorIndex = filteredCilCount > 0 ? filteredCilCount - 0.5 : -0.5;
    const plotHeight = custom.figureHeight || Math.max(500, finalGeneList.length * 40 + 200);

    const data = [{
        type: 'heatmap', 
        z: z, 
        x: orgs.map(shortenOrganismName),
        y: yLabels, 
        customdata: textMatrix,
        colorscale: [
            [0, '#F0F0F0'],       
            [0.0001, '#FFE5B5'],
            [1, '#FFE5B5'],       
            [1.0001, '#698ECF'],
            [2, '#698ECF']        
        ],
        showscale: false,
        hovertemplate: '%{customdata}<extra></extra>',
        xgap: 0.5, ygap: 0.5
    }];

    const FONT_SIZE = 18;
    const FONT_WEIGHT = 'bold';

    const layout = {
        title: { 
            text: custom.title || `Phylogenetic Conservation Heatmap (${isLi ? 'Li et al. 2014' : 'Nevers et al. 2017'})`,
            font: { size: custom.titleFontSize || 24, weight: FONT_WEIGHT } // Default title size increased
        },
        width: custom.figureWidth || 1000, 
        height: plotHeight,
        xaxis: { 
            title: { text: 'Organisms', font: { size: FONT_SIZE, weight: FONT_WEIGHT } }, // X-Axis Title FIX
            tickangle: -45,
            tickfont: { size: FONT_SIZE, weight: FONT_WEIGHT }, // X-Axis Labels FIX
            tickvals: Array.from({length: orgs.length}, (_, i) => i),
            ticktext: orgs.map(shortenOrganismName),
            showgrid: false, zeroline: false, 
            side: 'bottom', 
            automargin: true
        },
        yaxis: { 
            title: { text: 'Genes', font: { size: FONT_SIZE, weight: FONT_WEIGHT } }, // Y-Axis Title FIX
            automargin: true, 
            tickfont: { size: FONT_SIZE, weight: FONT_WEIGHT } // Y-Axis Labels FIX
        },
        margin: { l: 150, r: 20, t: 120, b: 250 }, 
        shapes: [{
            type: 'line', 
            xref: 'x', 
            yref: 'paper', 
            x0: separatorIndex, 
            x1: separatorIndex,
            y0: 0, 
            y1: 1, 
            line: { color: 'black', width: 2 } 
        }],
        annotations: [
            { 
                text: 'CILIATED', 
                xref: 'x', 
                yref: 'paper', 
                x: filteredCilCount > 0 ? (filteredCilCount - 1) / 2 : 0, 
                y: 1.05, 
                showarrow: false, 
                font: { color: '#698ECF', size: FONT_SIZE, weight: FONT_WEIGHT }, // ANNOTATION FIX
                xanchor: 'center' 
            },
            {

                xanchor: 'center'

        ]
    };
    
    Plotly.newPlot(plotDivId, data, layout, { responsive: true });
}

// NOTE: This code assumes UMAP_CELL_ANNOTATIONS is defined globally elsewhere in the script.

async function renderScrnaUMAPPlot(gene1, gene2 = null, custom) { 
    // UMAP_CELL_ANNOTATIONS is assumed to be defined globally now.

    const plotDivId = 'plot-display-area'; 
    const umapData = window.CiliAI_UMAP;
    const cellData = window.CiliAI.cellDataCache;
    const plotDiv = document.getElementById(plotDivId);
       
    // Determine mode and genes
    const genePrimary = gene1 ? gene1.toUpperCase() : 'FOXJ1';
    const geneSecondary = gene2 ? gene2.toUpperCase() : null;
    const isRatioMode = geneSecondary && geneSecondary !== genePrimary;
       
    let plotTitle, colorTitle;

    if (isRatioMode) {
        plotTitle = `UMAP: <strong>${genePrimary} / ${geneSecondary}</strong> Expression Ratio`;
        colorTitle = `${genePrimary} / ${geneSecondary} Ratio`;
    } else {
        plotTitle = `UMAP: <strong>${genePrimary}</strong> Expression`;
        colorTitle = `${genePrimary} Expr. (TPM)`;
    }

    if (!plotDiv) {
        console.error('UMAP plot container "plot-display-area" not found.');
        return;
    }
           
    // Check if critical data is available 
    if (!umapData || umapData.length === 0 || !cellData || Object.keys(cellData).length === 0) {
        plotDiv.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; padding:20px; color:red; text-align:center;">
            Critical error: scRNA-seq UMAP coordinates or expression data is missing or failed to load.
        </div>`;
        return;
    }

    plotDiv.innerHTML = ''; // Reset panel
       
    // Get expression data for both genes
    const exprData1 = cellData[genePrimary] || {};
    const exprData2 = isRatioMode ? (cellData[geneSecondary] || {}) : {};
           
    const sampledData = [];
    const colorArray = [];
    const sizeArray = [];
       
    let maxColorValue = 0;
    const pseudoCount = 0.01; // Avoid division by zero in ratio mode
    const expressionThreshold = 2; 

    // Use full UMAP data
    const sourceData = umapData; 

    for (const point of sourceData) {
        const value1 = exprData1[point.cell_type] || 0;
               
        let colorValue, sizeMagnitude;

        if (isRatioMode) {
            const value2 = exprData2[point.cell_type] || 0;
            // Calculate ratio: (G1 + pseudo) / (G2 + pseudo)
            colorValue = (value1 + pseudoCount) / (value2 + pseudoCount); 
            // Size based on G1 expression magnitude
            sizeMagnitude = value1; 
        } else {
            colorValue = value1;
            sizeMagnitude = value1;
        }

        sampledData.push(point);
        colorArray.push(colorValue);
                       
        // Dot size scaling based on primary magnitude
        const scaledMagnitude = Math.min(sizeMagnitude, expressionThreshold) / expressionThreshold;
        sizeArray.push(5 + (12 - 5) * scaledMagnitude); 
                       
        if (colorValue > maxColorValue) {
            maxColorValue = colorValue;
        }
    }
           
    // Handle case where primary gene has no data
    if (Object.keys(exprData1).length === 0) {
        plotDiv.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:16px;">
            🚫 Gene <strong>${genePrimary}</strong> not found in the expression cache.
        </div>`;
        return; 
    }
       
    // --- Annotations & Plotly Setup ---
    const colorScale = isRatioMode ? 'Viridis' : [[0, '#F8F8F8'], [0.0001, '#FFDAD0'], [1, '#E60000']];
    const cMax = isRatioMode ? Math.min(maxColorValue, 10) : maxColorValue; 
       
    // Generate UMAP Annotations using the global constant
    const annotations = Object.values(UMAP_CELL_ANNOTATIONS).map(ann => ({
        x: ann.x,
        y: ann.y,
        xref: 'x',
        yref: 'y',
        text: ann.label,
        showarrow: false,
        font: {
            color: '#333',
            size: 14,
            weight: 'bold'
        },
        // Draw a gray box behind the text for contrast
        bgcolor: 'rgba(255, 255, 255, 0.7)',
        bordercolor: '#ccc',
        borderwidth: 1,
        borderpad: 4
    }));

    const plotData = [{
        x: sampledData.map(p => p.x),
        y: sampledData.map(p => p.y),
        text: sampledData.map((p, i) => {
            const expr1 = exprData1[p.cell_type] || 0;
            if (isRatioMode) {
                const expr2 = exprData2[p.cell_type] || 0;
                return `Cell Type: ${p.cell_type}<br>${genePrimary}: ${expr1.toFixed(3)}<br>${geneSecondary}: ${expr2.toFixed(3)}<br>Ratio: ${colorArray[i].toFixed(2)}`;
            }
            return `Cell Type: ${p.cell_type}<br>Expression: ${expr1.toFixed(3)}`;
        }),
        mode: 'markers',
        type: 'scattergl',
        hoverinfo: 'text',
        marker: {
            color: colorArray,
            colorscale: colorScale,
            cmin: isRatioMode ? 0.1 : 0,
            cmax: cMax > 0 ? cMax : 0.0001,
            colorbar: { title: colorTitle },
            size: sizeArray,
            opacity: 0.8
        }
    }];

    const layout = {
        title: plotTitle,
        xaxis: { title: 'UMAP 1', zeroline: false, showgrid: false },
        yaxis: { title: 'UMAP 2', zeroline: false, showgrid: false },
        annotations: annotations, // Pass the annotations here
        showlegend: false
    };
           
    Plotly.newPlot(plotDivId, plotData, layout, { responsive: true });
}

/**
 * Utility to classify a gene's conservation based on Li/Nevers data.
 * @param {object} gene - The gene object.
 * @returns {string} Classification ('Ciliated', 'Non-Ciliated', 'Mixed/Other').
 */
function classifyPhylo(gene) {
    // We prioritize Nevers data as it's the default source.
    const neversData = gene.phylogeny?.nevers_2017;
    const liData = gene.phylogeny?.li_2014;

    if (!neversData && !liData) {
        return 'No Data';
    }

    // Using simplified presence logic for the plot: 
    // Is the gene conserved in a majority of ciliated model organisms vs non-ciliated ones listed in the study?
    // Since we lack normalized scores here, we'll use a simple threshold approach based on the calculated percentage score.
    const neversScore = calculatePhyloScores(gene).nevers_2017?.conservationPct || 0;
    const liScore = calculatePhyloScores(gene).li_2014?.conservationPct || 0;

    // Classification Thresholds (These are estimates and may need tuning based on actual data)
    if (neversScore > 30 || liScore > 35) {
        return 'Highly Conserved (Ciliated)';
    } else if (neversScore > 10 || liScore > 15) {
        return 'Intermediate/Mixed';
    } else {
        return 'Low Conservation (Non-Ciliated)';
    }
}

function renderMultiCategoryManhattan(genes, custom = {}) {
    clearPlot();

    // Reset general categorical color map
    CATEGORY_COLOR_MAP.clear();
    COLOR_INDEX_COUNTER = 0;

    const categoryLegends = {}; // To store category name -> { value: color }

    const categories = [
        { name: "Ciliopathy", key: "Ciliopathy" },
        { name: "Localization", key: "Localization" },
        { name: "Phylogeny", key: "phylogeny" },
        { name: "Screens", key: "screens_summary" }, 
        { name: "Complex", key: "Protein.complexes" }
    ];

    const traces = [];
    let allYValues = []; 

    // 1. Process data for plotting
    categories.forEach((cat, catIdx) => {
        const x = [], y = [], text = [], colors = [], sizes = [];

        genes.forEach((gene, geneIdx) => {
            let categoryValue = null;
            let dotColor = OVERVIEW_COLOR_MAP['Default'];
            let dotSize = 10;
            let hoverText = `${gene.gene}<br>`;
            let yPosition = geneIdx;

            // --- A. CILIOPATHY (Binary Presence) ---
            if (cat.key === "Ciliopathy") {
                const diseases = getCleanArray(gene, cat.key);
                if (diseases.length > 0) {
                    categoryValue = 'Associated';
                    dotColor = OVERVIEW_COLOR_MAP['Ciliopathy'];
                    hoverText += `Ciliopathy: ${diseases.join('; ').substring(0, 50)}...`;
                    categoryLegends[cat.name] = categoryLegends[cat.name] || {};
                    categoryLegends[cat.name]['Associated'] = dotColor;
                }
            }
            // --- B. LOCALIZATION (Distinguish Ciliary vs. Other) ---
            else if (cat.key === "Localization") {
                const locs = getCleanArray(gene, cat.key).map(loc => loc.toLowerCase());
                const isCiliary = locs.some(loc => loc.includes('cili') || loc.includes('basal body'));
                const isOtherOrganelle = locs.length > 0 && !isCiliary;
                
                if (isCiliary) {
                    categoryValue = 'Cilium/BB';
                    dotColor = OVERVIEW_COLOR_MAP['Localization-Ciliary'];
                    hoverText += `Localization: CILIUM/BB (${locs.join('; ').substring(0, 50)}...)`;
                    categoryLegends[cat.name] = categoryLegends[cat.name] || {};
                    categoryLegends[cat.name]['Cilium/BB'] = dotColor;
                } else if (isOtherOrganelle) {
                    categoryValue = 'Non-Ciliary Organelle';
                    dotColor = OVERVIEW_COLOR_MAP['Localization-Other'];
                    hoverText += `Localization: Other Organelle (${locs.join('; ').substring(0, 50)}...)`;
                    yPosition += 0.25;
                    categoryLegends[cat.name] = categoryLegends[cat.name] || {};
                    categoryLegends[cat.name]['Non-Ciliary Organelle'] = dotColor;
                }
            }
            // --- C. PHYLOGENY (Scored by Conservation) ---
            else if (cat.key === "phylogeny") {
                const scores = calculatePhyloScores(gene)[custom.source || 'nevers_2017'];
                const conservationPct = scores?.conservationPct || 0;
                
                if (conservationPct > 0) {
                    const classification = conservationPct > 30 ? 'High Conservation' : 'Low/Mixed Conservation';
                    dotSize = Math.max(8, 8 + (conservationPct / 10)); 
                    dotColor = conservationPct > 30 ? OVERVIEW_COLOR_MAP['Phylogeny-High'] : OVERVIEW_COLOR_MAP['Phylogeny-Low'];
                    categoryValue = classification;
                    hoverText += `Conservation: ${conservationPct.toFixed(1)}%`;
                    categoryLegends[cat.name] = categoryLegends[cat.name] || {};
                    categoryLegends[cat.name][classification] = dotColor;
                }
            }
            // --- D. SCREENS (Encode LFC Magnitude and Direction) ---
            else if (cat.key === "screens_summary") {
                const screenArray = getCleanArray(gene, cat.key) || [];
                const maxAbsLFC = screenArray.reduce((max, hit) => Math.max(max, Math.abs(hit.LFC || 0)), 0);
                const relevantHit = screenArray.find(hit => Math.abs(hit.LFC || 0) === maxAbsLFC);
                const LFC = relevantHit ? relevantHit.LFC : 0;
                
                if (Math.abs(LFC) > 0.5) { 
                    dotSize = Math.min(18, 10 + Math.abs(LFC) * 5);
                    
                    if (LFC < 0) {
                        dotColor = OVERVIEW_COLOR_MAP['Screen-Negative'];
                        yPosition = geneIdx + Math.abs(LFC) * 0.5; // Shift down for negative effect
                        categoryValue = 'Negative Effect';
                    } else {
                        dotColor = OVERVIEW_COLOR_MAP['Screen-Positive'];
                        yPosition = geneIdx - Math.abs(LFC) * 0.5; // Shift up for positive effect
                        categoryValue = 'Positive Effect';
                    }
                    
                    hoverText += `Screen Hit (LFC: ${LFC.toFixed(2)})`;

/**
 * Utility to classify a gene's conservation based on Li/Nevers data.
 * @param {object} gene - The gene object.
 * @returns {string} Classification ('Ciliated', 'Non-Ciliated', 'Mixed/Other').
 */
function classifyPhylo(gene) {
    const neversData = gene.phylogeny?.nevers_2017;
    const liData = gene.phylogeny?.li_2014;

    if (!neversData && !liData) {
        return 'No Data';
    }

    const neversScore = calculatePhyloScores(gene).nevers_2017?.conservationPct || 0;
    const liScore = calculatePhyloScores(gene).li_2014?.conservationPct || 0;

    // Classification Thresholds (These are estimates and may need tuning based on actual data)
    if (neversScore > 30 || liScore > 35) {
        return 'Highly Conserved (Ciliated)';
    } else if (neversScore > 10 || liScore > 15) {
        return 'Intermediate/Mixed';
    } else {
        return 'Low Conservation (Non-Ciliated)';
    }
}

/**

 * @param {object} gene - The gene object containing the .phylogeny property.

// --- DEPENDENCY: calculatePhyloScores (Included for completeness/context) ---

/**
 * Calculates conservation metrics for a gene based on Li/Nevers data.
 * @param {object} gene - The gene object containing the .phylogeny property.
 * @returns {object} Scores object with conservation percentages.
 */
function calculatePhyloScores(gene) {
    const scores = {};
    
    ['nevers_2017', 'li_2014'].forEach(source => {
        const phyData = gene.phylogeny?.[source];
        if (!phyData) return;

        const isLi = source === 'li_2014';
        
        const phyloCache = isLi ? window.liPhylogenyCache : window.neversPhylogenyCache;

        let totalStudySpecies = 0;
        if (isLi && phyloCache.summary?.total_organisms) {
             totalStudySpecies = phyloCache.summary.total_organisms;
        } else if (!isLi && phyloCache.organism_groups?.all_organisms_list) {
             totalStudySpecies = phyloCache.organism_groups.all_organisms_list.length;
        }

        const presenceCount = phyData.species_count || phyData.species_data?.length || 0;

        scores[source] = {
            presenceCount: presenceCount,
            totalSpecies: totalStudySpecies,
            conservationPct: totalStudySpecies > 0 ? (presenceCount / totalStudySpecies) * 100 : 0
        };
    });
    return scores;
}

/**
 * Renders a Domain Co-Occurrence Heatmap for the input genes.
 * Shows which domains are present in which genes (Binary Heatmap).
 */
function renderDomainCoOccurrence(genes, custom) {
    clearPlot();
    
    const plotDivId = 'plot-display-area';
    const plotDiv = document.getElementById(plotDivId);

    // 1. Collect all unique domain names
    const allDomains = new Set();
    const geneDomainMap = new Map(); // geneSymbol -> Set(domains)

    genes.forEach(gene => {
        const domains = getCleanArray(gene, 'Domain_Descriptions')
            .filter(domain => domain && domain !== 'N/A' && domain !== 'Unknown' && !domain.includes('PFAM_ID'));
        
        if (domains.length > 0) {
            geneDomainMap.set(gene.gene, new Set(domains));
            domains.forEach(domain => allDomains.add(domain));
        }
    });

    const domainArray = Array.from(allDomains).sort();
    const geneSymbols = genes.map(g => g.gene).filter(g => geneDomainMap.has(g));

    if (domainArray.length === 0 || geneSymbols.length === 0) {
        plotDiv.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
             🚫 No descriptive domain data available for the selected genes.
         </div>`;
        return;
    }

    // 2. Create the Z matrix (1 for presence, 0 for absence)
    const z = geneSymbols.map(geneSymbol => {
        const presentDomains = geneDomainMap.get(geneSymbol) || new Set();
        return domainArray.map(domain => presentDomains.has(domain) ? 1 : 0);
    });

    // 3. Plotly Setup
    const data = [{
        type: 'heatmap',
        z: z,
        x: domainArray,
        y: geneSymbols,
        colorscale: [
            [0, '#f0f0f0'], // Absent (Light Gray)
            [1, '#ff853a']  // Present (Orange/Accent)
        ],
        showscale: false,
        xgap: 1,
        ygap: 1,
        hovertemplate: 'Gene: %{y}<br>Domain: %{x}<br>Presence: %{z}<extra></extra>'
    }];

    const layout = {
        title: { text: custom.title || "Protein Domain Co-Occurrence Heatmap", font: { size: custom.titleSize || 20 } },
        xaxis: {
            title: 'Protein Domain',
            tickangle: -45,
            automargin: true,
            tickfont: { size: Math.min(10, 1000 / domainArray.length) }
        },
        yaxis: {
            title: 'Genes',
            automargin: true
        },
        height: custom.height || Math.max(500, geneSymbols.length * 35 + 200),
        width: custom.width || 1200,
        margin: { t: 80, l: 150, r: 50, b: 200 }
    };

    Plotly.newPlot(plotDivId, data, layout, { responsive: true });
}

/**
 * Renders a Gene Expression Correlation Network using scRNA-seq data.
 * The network visualizes the Pearson correlation (or cosine similarity)
 * of expression profiles across cell types.
 * @param {Array} genes - Array of gene objects from user input.
 * @param {Object} custom - Customization settings.
 */
function renderCorrelationNetwork(genes, custom) {
    clearPlot();
    const plotDivId = 'plot-display-area';
    const plotDiv = document.getElementById(plotDivId);
    
    const cellData = window.CiliAI.cellDataCache;
    const geneSymbols = genes.map(g => g.gene);
    
    // --- 1. Data Preparation: Build a matrix of expression vectors ---
    const expressionVectors = new Map();
    const cellTypes = Object.keys(UMAP_CELL_ANNOTATIONS).map(ct => ct.trim().toLowerCase());

    geneSymbols.forEach(gene => {
        const exprData = cellData[gene];
        if (exprData) {
            // Create a vector of expression values across all known cell types
            const vector = cellTypes.map(type => exprData[type] || 0);
            expressionVectors.set(gene, vector);
        }
    });

    const validGenes = geneSymbols.filter(g => expressionVectors.has(g));

    if (validGenes.length < 2) {
        plotDiv.innerHTML = `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:16px;">
            Not enough expression data (requires data for at least two genes) to build a correlation network.
        </div>`;
        return;
    }
    
    // --- 2. Calculate Pearson Correlation Matrix ---
    const correlations = [];
    const N = validGenes.length;
    const M = cellTypes.length; // Dimension of the vectors (number of cell types)

    // Helper function to calculate Pearson correlation (r)
    const calculatePearsonR = (vec1, vec2) => {
        if (M === 0) return 0;
        let sum1 = 0, sum2 = 0, sum1sq = 0, sum2sq = 0, sumProd = 0;

        for (let i = 0; i < M; i++) {
            sum1 += vec1[i];
            sum2 += vec2[i];
            sum1sq += vec1[i] * vec1[i];
            sum2sq += vec2[i] * vec2[i];
            sumProd += vec1[i] * vec2[i];
        }

        const numerator = sumProd - (sum1 * sum2 / M);
        const denominator = Math.sqrt((sum1sq - sum1 * sum1 / M) * (sum2sq - sum2 / M));

        if (denominator === 0) return 0;
        return Math.min(1, Math.max(-1, numerator / denominator)); // Clamp between -1 and 1
    };

    // Build the matrix
    for (let i = 0; i < N; i++) {
        correlations[i] = [];
        for (let j = 0; j < N; j++) {
            if (i === j) {
                correlations[i][j] = 1;
            } else if (i < j) {
                const r = calculatePearsonR(expressionVectors.get(validGenes[i]), expressionVectors.get(validGenes[j]));
                correlations[i][j] = r;
                correlations[j][i] = r;
            }
        }
    }

    // --- 3. Plotly Visualization (Heatmap of Correlation Matrix) ---
    
    const data = [{
        type: 'heatmap',
        z: correlations,
        x: validGenes,
        y: validGenes,
        colorscale: [
            [0.0, '#1565c0'],    // Blue for negative correlation (-1)
            [0.5, '#f0f0f0'],    // Gray for zero correlation (0)
            [1.0, '#d62728']     // Red for positive correlation (+1)
        ],
        zmin: -1,
        zmax: 1,
        colorbar: {
            title: 'Pearson R',
            titleside: 'right'
        },
        hovertemplate: 'Gene Y: %{y}<br>Gene X: %{x}<br>Correlation (R): %{z:.3f}<extra></extra>'
    }];

    const layout = {
        title: { text: custom.title || "Gene Expression Correlation Network (scRNA-seq)", font: { size: custom.titleSize || 20 } },
        xaxis: {
            automargin: true,
            tickangle: -45
        },
        yaxis: {
            automargin: true,
            tickfont: { size: 10 }
        },
        height: custom.height || Math.max(600, N * 25 + 200),
        width: custom.width || Math.max(600, N * 25 + 200),
        margin: { t: 80, l: 150, r: 150, b: 150 }
    };

    Plotly.newPlot(plotDivId, data, layout, { responsive: true });
}

/**
 * Normal Cumulative Distribution Function (CDF) for p-value calculation
 * Uses Abramowitz and Stegun approximation for Chi-square approximation.
 * @param {number} x - The z-score
 * @returns {number} - Cumulative probability
 */
function normalCDF(x) {
    const t = 1 / (1 + 0.2316419 * Math.abs(x));
    const d = 0.3989423 * Math.exp(-x * x / 2);
    const prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
    return x > 0 ? 1 - prob : prob;
}

    let csv = 'Gene Symbol,Functional Category,Localization,Ciliopathy Association,Description\n';

        const locs = getCleanArray(gene, 'Localization').join('; ');
        const diseases = getCleanArray(gene, 'Ciliopathy').join('; ');
        const desc = gene['Gene.description'] || gene['Description'] || 'N/A';
        
        csv += `${symbol},"${categories}","${locs}","${diseases}","${desc.replace(/"/g, '""')}"\n`;

/**
 * Downloads the complete enrichment analysis report as CSV

 */
function downloadFullReport() {
    const data = window.enrichmentData;
    if (!data) { alert('No enrichment data available. Please run the analysis first.'); return; }
    
    let csv = 'CRISPR Screen Enrichment Analysis Report\n';
    csv += 'Generated: ' + new Date().toLocaleString() + '\n\n';
    
    csv += '=== SUMMARY STATISTICS ===\n';
    csv += `Total Input Genes,${data.statistics.totalInput}\n`;
    csv += `Ciliary Genes Found,${data.statistics.observedCiliary}\n`;
    csv += `Expected Ciliary Genes,${data.statistics.expectedCiliary.toFixed(2)}\n`;
    csv += `Fold Enrichment,${data.statistics.foldEnrichment.toFixed(3)}\n`;
    csv += `Chi-Square Statistic,${data.statistics.chiSquare.toFixed(4)}\n`;
    csv += `P-value,${data.statistics.pValue.toExponential(4)}\n`;
    csv += `Statistical Significance,${data.statistics.pValue < 0.05 ? 'YES (p < 0.05)' : 'NO (p >= 0.05)'}\n\n`;
    
    csv += '=== FUNCTIONAL CATEGORY BREAKDOWN ===\n';
    csv += 'Category,Count,Percentage\n';
    Object.entries(data.categoryBreakdown)
        .sort((a, b) => b[1] - a[1])
        .forEach(([cat, count]) => {
            const pct = ((count / data.statistics.observedCiliary) * 100).toFixed(1);
            csv += `"${cat}",${count},${pct}%\n`;
        });
    
    csv += '\n=== LOCALIZATION BREAKDOWN ===\n';
    csv += 'Localization,Count,Percentage\n';
    Object.entries(data.localizationBreakdown)
        .sort((a, b) => b[1] - a[1])
        .forEach(([loc, count]) => {
            const pct = ((count / data.statistics.observedCiliary) * 100).toFixed(1);
            csv += `"${loc}",${count},${pct}%\n`;
        });
    
    csv += '\n=== CILIOPATHY-ASSOCIATED GENES ===\n';
    csv += 'Gene,Associated Diseases\n';
    data.ciliopathyGenes.forEach(item => {
        csv += `${item.gene},"${item.diseases}"\n`;
    });
    
    csv += '\n=== COMPLETE CILIARY GENE LIST ===\n';
    csv += 'Gene Symbol,Functional Category,Localization,Ciliopathy\n';
    data.ciliaryHits.forEach(symbol => {
        const gene = ciliaryGeneMap.get(symbol);
        const cats = getCleanArray(gene, 'Functional.category').join('; ');
        const locs = getCleanArray(gene, 'Localization').join('; ');
        const diseases = getCleanArray(gene, 'Ciliopathy').join('; ');
        csv += `${symbol},"${cats}","${locs}","${diseases}"\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'screen_enrichment_report.csv';
    a.click();
    URL.revokeObjectURL(url);
}

/**
 * Analyzes a large gene list from a CRISPR screen for ciliary gene enrichment.
 * @param {Array} genes - Array of gene objects from user input
 * @param {Object} custom - Customization settings
 */
function renderScreenEnrichmentAnalysis(genes, custom) {
    clearPlot();

    const plotDivId = 'plot-display-area';
    const plotDiv = document.getElementById(plotDivId);

    const inputGenes = Array.from(new Set(genes.map(g => g.gene.toUpperCase())));
    const totalInputGenes = inputGenes.length;

    const allCiliaryGenes = Array.from(ciliaryGeneMap.keys());
    const totalCiliaryGenes = allCiliaryGenes.length;

    const ciliaryHits = inputGenes.filter(gene => ciliaryGeneMap.has(gene));
    const nonCiliaryHits = inputGenes.filter(gene => !ciliaryGeneMap.has(gene));

    const observedCiliary = ciliaryHits.length;
    const observedNonCiliary = nonCiliaryHits.length;

    const totalGenome = 20000;
    const expectedCiliary = (totalCiliaryGenes / totalGenome) * totalInputGenes;
    const foldEnrichment = observedCiliary / expectedCiliary;

    const a = observedCiliary;
    const b = observedNonCiliary;
    const c = totalCiliaryGenes - observedCiliary;
    const d = (totalGenome - totalCiliaryGenes) - observedNonCiliary;

    const n = a + b + c + d;
    let pValue, chiSquare;
    if ((a + b) * (c + d) * (a + c) * (b + d) === 0 || observedCiliary === 0) {
        chiSquare = 0;
        pValue = 1.0;
    } else {
        chiSquare = (n * Math.pow((a * d - b * c), 2)) / ((a + b) * (c + d) * (a + c) * (b + d));
        pValue = 1 - normalCDF(Math.sqrt(chiSquare));
    }

    const categoryBreakdown = {};
    const localizationBreakdown = {};

            renderer(genes, custom); // Pass the array of gene objects and customization
        }
    } catch (error) {
        console.error("Plot rendering error:", error);
        plotArea.innerHTML = `
            <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e74c3c; font-size:18px; text-align:center;">
                <strong>Plot failed to render</strong><br><br>
                <small>${error.message}</small><br><br>
                <button onclick="generatePlot()" style="padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">
                    Try Again
                </button>
            </div>`;
    }
}

function debugPhylogenyData(genes) {
    console.log("=== PHYLOGENY DATA DEBUG ===");
    console.log("Checking phylogenetic data for genes:", genes.map(g => g.gene).join(', '));
    
    genes.forEach(gene => {
        console.log(`\nGene: ${gene.gene}`);
        
        // Check integrated data
        const neversData = gene.phylogeny?.nevers_2017;
        const liData = gene.phylogeny?.li_2014;
        
        console.log(`  Integrated Nevers 2017:`, neversData ? 
            `PRESENT (${neversData.species_count} species, ${neversData.species_data?.length} indices)` : 'NO DATA');
        console.log(`  Integrated Li 2014:`, liData ? 
            `PRESENT (${liData.species_data?.length} species)` : 'NO DATA');
        
        // Check direct matrix access
        const neversDirect = window.neversPhylogenyCache?.genes?.[gene.gene.toUpperCase()];
        const liDirect = Object.values(window.liPhylogenyCache?.genes || {}).find(g => g.g && g.g.toUpperCase() === gene.gene.toUpperCase());
        
        console.log(`  Direct Nevers matrix:`, neversDirect ? 
            `PRESENT (${neversDirect.s?.length} indices)` : 'NOT FOUND');
        console.log(`  Direct Li matrix:`, liDirect ? 
            `PRESENT (${liDirect.s?.length} indices)` : 'NOT FOUND');
        
        // Sample data for verification
        if (neversData && neversData.species_data) {
            console.log(`  Nevers sample indices:`, neversData.species_data.slice(0, 5));
        }
        if (liData && liData.species_data) {
            console.log(`  Li sample indices:`, liData.species_data.slice(0, 5));
        }
    });
    
    // Check if phylogenetic caches are loaded
    console.log("\nPhylogeny Cache Status:");
    console.log("Nevers cache loaded:", !!window.neversPhylogenyCache);
    console.log("Li cache loaded:", !!window.liPhylogenyCache);
    
    if (window.neversPhylogenyCache) {
        console.log("Nevers organisms count:", window.neversPhylogenyCache.organism_groups?.all_organisms_list?.length);
        console.log("Nevers genes count:", Object.keys(window.neversPhylogenyCache.genes || {}).length);
    }
    if (window.liPhylogenyCache) {
        console.log("Li organisms count:", window.liPhylogenyCache.summary?.organisms_list?.length);
        console.log("Li genes count:", Object.keys(window.liPhylogenyCache.genes || {}).length);
    }
    
    console.log("=============================");
}

// --- UPDATE 'handlePlotSelection(value)' function - PLOT_TITLES ---
function handlePlotSelection(value) {
    const isPhylogeny = value === 'phylogeny';
    const isEnrichment = value === 'screen_enrichment';

    document.getElementById('phy-source-group').style.display = isPhylogeny ? 'block' : 'none';
    document.getElementById('phy-filter-group').style.display = isPhylogeny ? 'grid' : 'none'; 
    
    // Control visibility of standard download buttons
    document.querySelector('.download-controls').style.display = isEnrichment ? 'none' : 'flex';
    
    const PLOT_TITLES = { // Ensure this mapping is up to date
        "screen_enrichment": "Ciliary Gene Enrichment Analysis",
        "raw_check": "Ciliary Gene Check", // ADDED
        "gene_overview": "Gene Feature Overview / Summary",
        "expression_heatmap": "Tissue Expression Profile",
        "scrna_dot": "scRNA-seq UMAP Expression (Lung)",
        "ciliopathy": "Ciliopathy & Disease Association Heatmap",
        "localization_heatmap": "Localization Heatmap",
        "crispr_screens": "CRISPR & siRNA Screens Summary",
        "protein_domains": "Protein Domain Co-Occurrence Heatmap", // UPDATED NAME
        "protein_complex": "Complex Membership Map",
        "mouse_phenotypes": "Mouse Phenotype Enrichment Heatmap",
        "phylogeny": "Phylogenetic Conservation Heatmap",
        "correlation_network": "Gene Expression Correlation Network" // ADDED
    };
    
    const customTitleInput = document.getElementById('custom-title');
    if (customTitleInput) {
        const defaultTitle = PLOT_TITLES[value] || 'Custom Analysis Plot';
        customTitleInput.value = defaultTitle;
    }
    
    clearPlot(); 
}
