            display: inline-block; 
            padding: 8px 12px; 
            font-size: 0.9em; 
            border-radius: 5px; 
            cursor: pointer;

            border: 1px solid #ddd; 
            background: #fafafa;
        }

        .plot-types-panel .plot-type-list input[type="radio"]:checked + label { 
            background-color: #005b96; /* Using primary-blue for checked state */

            font-weight: bold; 
            border-color: #005b96; 
        }

        #ciliaplot-genes-input { 
            width: 100%; 
            min-height: 140px;

            border-radius: 5px; 
            border: 1px solid #ccc; 
            font-family: 'Courier New', monospace; 
            resize: vertical; 
            margin-bottom: 15px; 
        }
        #generate-ciliaplot-btn { 
            width: 100%; 
            padding: 12px; 
            font-size: 1.1em; 
            font-weight: bold;

             /* Custom D3 tooltip style */

    <script>
        // --- Global variables to hold your data ---
        let ciliaryGeneMap = new Map();
        let screenDatabase = {};
        let allGenes = []; // Added for Venn Diagram functionality
        let currentPlotInstance = null; // For managing Chart.js/D3 plot instances

        // =============================================================================
        // UTILITIES (Essential functions used by both app and plots)
        // =============================================================================

        // Function to load the base gene database for Venn Diagram
        async function loadAndPrepareDatabase() {
            if (allGenes && allGenes.length > 0) return true;
            try {
                const response = await fetch('ciliahub_data.json');
                if (!response.ok) throw new Error('Failed to fetch ciliahub_data.json');
                allGenes = await response.json();
                return true;
            } catch (error) {
                console.error("Failed to load base gene database:", error);
                return false;
            }
        }

        // Sanitization helper (needed by updateGeneSummaryTable)
        function sanitize(s) {
            if (!s) return null;
            let str = String(s).trim();
            str = str.replace(/\s+/g, ' ').trim();
            return str ? str.toUpperCase() : null;
        }

        // Helper to safely extract array from gene object (needed by all plot functions)
        function getCleanArray(gene, ...keys) {
            let data = null;
            for (const key of keys) {
                if (gene[key] != null) { data = gene[key]; break; }
            }
            if (data == null) return [];
            const separatorRegex = /[,;]/;
            const initialArray = Array.isArray(data) ? data : String(data).split(separatorRegex);
            return initialArray.filter(Boolean).flatMap(item => String(item).split(separatorRegex)).map(item => item.trim()).filter(Boolean);
        }

        // =============================================================================
        // DATA FETCHING & MERGING (As provided by user)
        // =============================================================================

        /**
        * This function should be called when your application starts.
        * It fetches both JSON files and prepares them for fast lookups.
        */
        async function loadAllData() {
            try {
                // Fetch both files in parallel
                const [ciliaryGenesResponse, screenDataResponse] = await Promise.all([
                    fetch('ciliahub_data.json'),
                    fetch('cilia_screens_data.json')
                ]);

                const ciliaryGeneArray = await ciliaryGenesResponse.json();
                screenDatabase = await screenDataResponse.json();
                
                // Convert the ciliary gene array into a Map for instant lookups
                ciliaryGeneMap = new Map(ciliaryGeneArray.map(gene => [gene.gene.toUpperCase(), gene]));
                
                // Also store the array for functions like Venn diagram that need the full list
                allGenes = ciliaryGeneArray;

                console.log(`Successfully loaded ${ciliaryGeneMap.size} ciliary genes.`);
                console.log(`Successfully loaded screen data for ${Object.keys(screenDatabase).length} genes.`);

            } catch (error) {
                console.error("Failed to load a required data file:", error);
                // You could display an error message to the user here
            }
        }

        /**
        * This function finds genes from user input and merges data from both sources.
        * @param {string[]} userInputArray - An array of gene symbols from the user.
        * @returns {object} An object containing the array of found gene data.
        */
        function findAndMergeGenes(userInputArray) {
            const foundGenes = [];
            const seenGenes = new Set();

            userInputArray.forEach(query => {
                const geneSymbol = query.toUpperCase().trim();
                if (!geneSymbol || seenGenes.has(geneSymbol)) return;

                // 1. Look up the gene in the main ciliary gene database
                if (ciliaryGeneMap.has(geneSymbol)) {
                    // Start with the base data from your curated list
                    let geneData = { ...ciliaryGeneMap.get(geneSymbol) };
                    
                    // 2. Augment it with data from the screen database
                    if (screenDatabase[geneSymbol]) {
                        geneData.screens_summary = screenDatabase[geneSymbol];
                    }
                    
                    foundGenes.push(geneData);
                    seenGenes.add(geneSymbol);
                }
            });
            
            return { foundGenes };
        }
        
        // =============================================================================
        // CORE DISPLAY FUNCTION (As provided by user - adjusted for new shell)
        // =============================================================================

        function displayCiliaPlotPage() {
            const contentArea = document.querySelector('.content-area');
            // The provided code assumes .cilia-panel exists and styles were inline. 
            // We use the new shell structure.
            
            contentArea.innerHTML = `
            <style>

            </style>

                </div>

                <div class="ciliaplot-main-layout">
                    <aside class="input-panel">
                        <div class="control-card">

                            <textarea id="ciliaplot-genes-input" placeholder="Enter gene symbols (e.g., BBS1, AHI1, CEP290)..."></textarea>

                    </aside>

                    <aside class="visualization-panel">

                            <div class="plot-header">
                                <h3>Visualization</h3>
                                <div class="download-controls">
                                    <select id="download-format"><option value="png">PNG</option><option value="pdf">PDF</option></select>
                                    <button id="download-plot-btn">Download</button>
                                </div>
                            </div>

                        </div>
                        <div class="control-card gene-input-table-container">
                            <h3>Gene Input Summary</h3>
                            <table>
                                <thead><tr><th>#</th><th>Query</th><th>Status</th></tr></thead>
                                <tbody id="ciliaplot-gene-summary-tbody">
                                    <tr><td colspan="3" style="text-align: center;">Enter genes to see summary...</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="visualization-footer">
                            <p>The CiliaHub database contains an updated list of over <strong>2200 Gold Standard Genes with Ciliary Functions</strong>. You can visualize subcellular localization, protein domain enrichment, and more using the plots above.</p>
                            <p>We have catalogued the 2200 ciliary genes, with their functional categories, subcellular localizations, domains, protein complexes, where they are found, and gene expression from The Human Protein Atlas. Furthermore, we also integrated genome-wide screens for cilia and Hedgehog pathway functions.</p>
                            <p>Relevant papers:</p>
                            <ul>
                                <li><a href="https://www.sciencedirect.com/science/article/pii/S016748891630074X" target="_blank">Kim et al. 2016</a></li>
                                <li><a href="https://elifesciences.org/articles/06602#content" target="_blank">Roosing et al. 2015</a></li>
                                <li><a href="https://www.nature.com/articles/s41588-018-0054-7#Abs1" target="_blank">Breslow et al. 2018</a></li>
                                <li><a href="https://www.nature.com/articles/ncb3201#Abs1" target="_blank">Wheway et al. 2015</a></li>

                        </div>
                    </aside>
                </div>
            </section>
            `;

            // Wait for the new DOM elements to be inserted before initializing event handlers
            setTimeout(initializeCiliaPlotPage, 0); 
        }

        // =============================================================================
        // ALL REMAINING USER-PROVIDED CODE FUNCTIONS GO HERE
        // (initializeCiliaPlotPage, getCleanArray, clearAllPlots, updateGeneSummaryTable, etc.)
        // Since the prompt provided the full working code, it is included below:
        // =============================================================================
        
        
        // =============================================================================
        // INITIALIZATION
        // =============================================================================

        function initializeCiliaPlotPage() {
            // 🔄 UPDATED: Call the main data loading function when the page is initialized
            loadAllData();

            populatePlotTypes();
            
            // Check if elements exist before adding listeners
            const typeSelector = document.getElementById('ciliaplot-type-selector');
            const generateBtn = document.getElementById('generate-ciliaplot-btn');
            const downloadBtn = document.getElementById('download-plot-btn');
            
            if (typeSelector) typeSelector.addEventListener('change', updateCustomizationPanel);
            if (generateBtn) generateBtn.addEventListener('click', generateAnalysisPlots);
            if (downloadBtn) downloadBtn.addEventListener('click', downloadPlot);
            
            updateCustomizationPanel(); 
            
            // Load expression data silently for the heatmap plot
            loadPlotExpressionData();
        }

        // =============================================================================
        // HELPER FUNCTIONS
        // =============================================================================

        // This function is now defined in the utilities section above (getCleanArray) to avoid duplication.

        function clearAllPlots(containerId = 'plot-display-area') {
            if (typeof currentPlotInstance !== 'undefined' && currentPlotInstance && typeof currentPlotInstance.destroy === 'function') {
                currentPlotInstance.destroy();
                currentPlotInstance = null;
            }
            const container = document.getElementById(containerId);
            if (container) container.innerHTML = '';
            try { Plotly.purge(containerId); } catch (e) { /* Ignore */ }
        }

        /**
        * Updates the gene summary table with found/not-found status for each original query.
        */
        function updateGeneSummaryTable(originalQueries, foundGenes) {
            const tbody = document.getElementById('ciliaplot-gene-summary-tbody');
            if (!tbody) return; // Guard clause if the element doesn't exist
            tbody.innerHTML = '';

            // Create a comprehensive set of all identifiers for the genes that were found.
            const foundIds = new Set();
            foundGenes.forEach(gene => {
                // Use sanitize() to ensure all identifiers are clean before adding to the set
                if (gene.gene) foundIds.add(sanitize(gene.gene));
                
                if (gene.synonym) {
                    String(gene.synonym).split(/[,;]/).forEach(s => {
                        const key = sanitize(s);
                        if (key) foundIds.add(key);
                    });
                }
                
                if (gene.ensembl_id) {
                    String(gene.ensembl_id).split(/[,;]/).forEach(id => {
                        const key = sanitize(id);
                        if (key) foundIds.add(key);
                    });
                }
            });

            // Iterate through the user's original, raw queries
            originalQueries.forEach((query, index) => {
                // ✅ CRITICAL FIX: Sanitize the original query before checking its status.
                const sanitizedQuery = sanitize(query);
                const status = foundIds.has(sanitizedQuery) ? 'Found' : 'Not Found';
                const statusColor = status === 'Found' ? '#28a745' : '#dc3545';
                
                // Append a new row to the table
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${query}</td>
                        <td style="color: ${statusColor}; font-weight: bold;">${status}</td>
                    </tr>
                `;
            });
            
            // Handle case where originalQueries is empty but was successfully called.
            if (originalQueries.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Enter genes to see summary...</td></tr>';
            }
        }

        function getPlotCustomization(plotType) {
            const custom = {
                // === Generic ===
                title: document.getElementById('custom-title')?.value,
                titleFontSize: parseInt(document.getElementById('custom-title-fontsize')?.value, 10) || 24,
                fontFamily: document.getElementById('custom-font-family')?.value || 'Arial',
                fontColor: document.getElementById('custom-font-color')?.value || '#000',
                figureWidth: parseInt(document.getElementById('custom-figure-width')?.value, 10) || 800,
                figureHeight: parseInt(document.getElementById('custom-figure-height')?.value, 10) || 600,

                // === Axis labels ===
                showX: document.getElementById('custom-show-x')?.value === 'true',
                showY: document.getElementById('custom-show-y')?.value === 'true',
                axisTitleFont: { 
                    size: parseInt(document.getElementById('custom-axis-fontsize')?.value, 10) || 16, 
                    family: document.getElementById('custom-font-family')?.value || 'Arial', 
                    color: document.getElementById('custom-axis-color')?.value || '#000', 
                    weight: 'bold' 
                },
                
                // === Plot Type specific defaults ===
                bubbleSize: parseInt(document.getElementById('custom-bubble-size')?.value, 10) || 15,
                barWidth: parseFloat(document.getElementById('custom-bar-width')?.value) || 0.8,
                
                // === Heatmap-specific (Defaulted) ===
                heatmap: {
                    yticklabels: true,
                    xticklabels: true,
                    tickangle: -45,
                    linewidth: 1,
                    linecolor: '#fff',
                    hideTicks: true
                },
                
                // === Venn Diagram specific (Defaulted) ===
                venn: {
                    label1: { text: document.getElementById('venn-label-1')?.value || "Gene Input", color: document.getElementById('venn-label-color-1')?.value || "#000000" },
                    circle1: { color: document.getElementById('venn-circle-color-1')?.value || "#3f51b5" },
                    label2: { text: document.getElementById('venn-label-2')?.value || "Gold Standard Ciliary Genes", color: document.getElementById('venn-label-color-2')?.value || "#000000" },
                    circle2: { color: document.getElementById('venn-circle-color-2')?.value || "#4CAF50" },
                    numberColor: document.getElementById('venn-number-color')?.value || "#333333"
                },
                
                // === Network Plot Specific (Defaulted) ===
                ribbonColors: []
            };

            // Network ribbon colors (if present)
            for (let i = 1; i <= 10; i++) {
                 const color = document.getElementById(`ribbon-color-${i}`)?.value;
                 if (color) custom.ribbonColors.push(color);
            }
            
            // Ensure consistent spacing for Hedgehog vs Cilia (Screen Heatmap)
            if (plotType === 'screen_summary_heatmap') {
                custom.legend = {
                    traceorder: 'normal',
                    itemsizing: 'constant',
                    title: { text: "Screen Categories" },
                    itemclick: false,
                    itemdoubleclick: false
                };
            }

            return custom;
        }

        // =============================================================================
        // PLOT CONFIGURATION AND EXPLANATIONS (As provided by user)
        // =============================================================================

        const PLOT_CONFIG = {
            'localization_bubble': { label: 'Gene Localizations', explanation: 'Displays the subcellular localizations of your genes as bubbles. Each bubble represents a gene-localization pair, helping you visualize where your genes are found within the cell.' },
            'functional_bar': { label: 'Functional Categories', explanation: 'Shows the distribution of functional categories among your genes. Bars represent the count of genes in each functional category, revealing the primary functions of your gene set.' },
            'enrichment_bubble': { label: 'Enrichment Analysis', explanation: 'Analyzes functional category enrichment in your gene set compared to the background. Bubble size indicates gene count, color represents significance (p-value).' },
            'balloon_plot': { label: 'Function vs Localization', explanation: 'Creates a heatmap showing the relationship between functional categories and subcellular localizations. Color intensity represents the number of genes with both properties.' },
            'venn_diagram': { label: 'Gene Set Comparison', explanation: 'Compares your gene list with the ciliary reference gene set, showing overlaps and unique genes. Numbers represent exact gene matches only.' },
            'network': { label: 'Complex Network', explanation: 'Visualizes protein-protein interactions and complex associations among your genes. Connected nodes indicate genes that participate in the same protein complexes.' },
            'organelle_radar': { label: 'Organelle Radar', explanation: 'Compares the organellar profile of your gene set against known organellar markers. Each axis represents a different subcellular compartment.' },
            'organelle_umap': { label: 'Organelle UMAP', explanation: 'Projects genes onto a 2D UMAP based on their organellar localization patterns. Genes with similar localization profiles cluster together.' },
            'expression_heatmap': { label: 'Expression Heatmap', explanation: 'Shows tissue-specific expression patterns of your genes. Color intensity represents expression levels across different tissues and cell types.' },
            'multi_category_manhattan': { label: 'Gene Feature Overview', explanation: 'A comprehensive plot showing gene associations across five major categories: Subcellular Localization, Protein Complexes, Protein Domains, Ciliopathies, and Ciliogenesis Screens.' },
            'screen_summary_heatmap': { label: 'Screen Summary Heatmap', explanation: 'Visualizes results from five key functional genomics screens (Kim, Wheway, Roosing, Breslow, Basu) as a color-coded heatmap.' },
            'ciliopathy_associations': { label: 'Genes vs Ciliopathies', explanation: 'Displays the associations between genes and ciliopathies as markers. Each marker represents a gene-ciliopathy association, helping visualize disease links.' }
        };

        function populatePlotTypes() {
            const container = document.getElementById('ciliaplot-type-selector');
            if (!container) return; // Safety check
            let html = '';
            
            Object.entries(PLOT_CONFIG).forEach(([key, val], index) => {
                const checked = key === 'multi_category_manhattan' ? 'checked' : ''; // Default to comprehensive plot
                html += `<li><input type="radio" id="plot-${key}" name="ciliaplot_type" value="${key}" ${checked}><label for="plot-${key}">${val.label}</label></li>`;
            });
            
            container.innerHTML = html;
        }

        function updatePlotExplanation() {
            const selectedPlot = document.querySelector('input[name="ciliaplot_type"]:checked')?.value;
            const explanationDiv = document.getElementById('plot-explanation');
            
            if (selectedPlot && PLOT_CONFIG[selectedPlot]) {
                explanationDiv.innerHTML = `<div class="plot-explanation">${PLOT_CONFIG[selectedPlot].explanation}</div>`;
            } else {
                explanationDiv.innerHTML = '';
            }
        }

        function updateCustomizationPanel() {
            const selectedPlot = document.querySelector('input[name="ciliaplot_type"]:checked')?.value;
            const container = document.getElementById('customization-container');
            
            let html = `<h3>Plot Customization</h3><div class="customization-grid">`;
            
            // Basic customization options

                if (!key || !gene[key]) return [];
                return Array.isArray(gene[key]) ? gene[key] : [gene[key]];
            };

            const softColors = {
                localization: ['#8dd3c7','#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462','#b3de69','#fccde5','#d9d9d9','#bc80bd'],

                default:       ['#AEC6CF','#77DD77','#FDFD96','#FFB347','#FF6961','#CBAACB','#FFDAC1']
            };

            const categories = {
                'Subcellular Localization': { key: 'localization', data: new Set(), color: softColors.localization, description: 'Gene localization within the cell' },
                'Complex Names': { key: 'complex_names', data: new Set(), color: [softColors.default[1]], description: 'Protein complexes the gene is associated with' },
                'Protein Domains': { key: 'domain_descriptions', data: new Set(), color: [softColors.default[2]], description: 'Functional protein domains' },
                'Ciliopathy': { key: 'ciliopathy', data: new Set(), color: softColors.ciliopathy, description: 'Association with ciliopathy disorders' },
                'Ciliogenesis Screen': { key: 'screens', data: new Set(), color: softColors.screens, description: 'Results from ciliogenesis functional screens' }
            };

            const plotPoints = [];
            const geneTracker = new Map();
            const processedGenes = [];
            
            genes.forEach((gene, index) => {
                const geneName = gene.gene;
                let uniqueGeneName = geneName;
                
                if (geneTracker.has(geneName)) {
                    const count = geneTracker.get(geneName) + 1;
                    geneTracker.set(geneName, count);
                    uniqueGeneName = `${geneName}_${count}`;
                } else {
                    geneTracker.set(geneName, 1);
                }
                
                processedGenes.push({...gene, uniqueGeneName, originalGeneName: geneName});
            });
            
            const allFoundGenes = processedGenes.map(g => g.uniqueGeneName).sort();

            // 1. Process genes → populate categories & points
            processedGenes.forEach(gene => {
                const uniqueGeneName = gene.uniqueGeneName;
                const originalGeneName = gene.originalGeneName;
                
                // Process Subcellular Localization
                const localizations = getCleanArray(gene, categories['Subcellular Localization'].key);
                localizations.forEach((loc, locIndex) => {
                    categories['Subcellular Localization'].data.add(loc);
                    plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: 'Subcellular Localization', item: loc, colorIndex: locIndex % softColors.localization.length });

                        categories[catName].data.add(item);

            Object.keys(categories).forEach(catName => {
                const items = Array.from(categories[catName].data).sort();
                if (items.length > 0) {
                    const sectionWidth = Math.max((items.length - 1) * pointSpacing, 1);
                    sectionTicks.push({ pos: xOffset + sectionWidth / 2, name: catName });
                    items.forEach((item, idx) => {
                        itemToXPos.set(`${catName}-${item}`, xOffset + (idx * pointSpacing));

        // Placeholder for TSV parsing (needed for Expression Heatmap)
        function parseTSV(tsvText) {
            const lines = tsvText.split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].trim().split('\t');
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].trim().split('\t');
                if (values.length === headers.length) {
                    const row = {};
                    headers.forEach((h, j) => {
                        row[h] = values[j];
                    });
                    data.push(row);
                }
            }
            return data;

        async function downloadPlot() {
            const plotArea = document.getElementById('plot-display-area');
            const plotlyDiv = plotArea.querySelector('.plotly');
            const canvas = plotArea.querySelector('canvas');
            const svg = plotArea.querySelector('svg');
            const format = document.getElementById('download-format').value || 'png';
            const fileName = `CiliaPlot_export.${format}`;

            let dataUrl;
            let width = 1200; 
            let height = 900;

            try {
                if (plotlyDiv) {
                    await Plotly.toImage(plotArea, {format: 'png', width: width, height: height}).then(function(url) {
                        dataUrl = url;
                    });
                } else if (canvas) {
                    dataUrl = canvas.toDataURL('image/png', 1.0);
                    width = canvas.width; 
                    height = canvas.height;
                } else if (svg) {
                    // Logic for SVG download via temporary canvas (as provided)
                    const serializer = new XMLSerializer();
                    const svgString = serializer.serializeToString(svg);
                    const tempCanvas = document.createElement('canvas');
                    const ctx = tempCanvas.getContext('2d');
                    width = svg.clientWidth * 2;
                    height = svg.clientHeight * 2;
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const img = new Image();
                    await new Promise((resolve) => {
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, width, height);
                            dataUrl = tempCanvas.toDataURL('image/png');
                            resolve();
                        };
                        img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
                    });
                }

                if (!dataUrl) { 
                    throw new Error("Could not generate image data."); 
                }

                if (format === 'png') {
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = dataUrl;
                    link.click();
                } else if (format === 'pdf') {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ 
                        orientation: width > height ? 'l' : 'p', 
                        unit: 'px', 
                        format: [width, height] 
                    });
                    pdf.addImage(dataUrl, 'PNG', 0, 0, width, height);
                    pdf.save(fileName);
                }
            } catch (e) {
                console.error("Download failed:", e);
                alert("An error occurred during download.");
            }
        }


        // =============================================================================
        // FINAL EXECUTION
        // =============================================================================

        // Function to run after DOM is fully loaded, initiating the display
        document.addEventListener('DOMContentLoaded', displayCiliaPlotPage);
        
    </script>
</body>
</html>
