        // --- TSV Parsing Helper ---
        function parseTsvData(tsvText) {
            const data = {};
            const lines = tsvText.split('\n').filter(line => line.trim() !== '');
            if (lines.length <= 1) return data;

            const headers = lines[0].split('\t').map(h => h.trim());
            const geneNameIndex = headers.indexOf('Gene name');
            const tissueIndex = headers.indexOf('Tissue');
            const nTPMIndex = headers.indexOf('nTPM');

            if (geneNameIndex === -1 || tissueIndex === -1 || nTPMIndex === -1) {
                console.error("TSV headers missing: 'Gene name', 'Tissue', or 'nTPM'");
                return data;
            }

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split('\t').map(v => v.trim());
                if (values.length > tissueIndex) {
                    const geneName = values[geneNameIndex];
                    let tissue = values[tissueIndex];
                    const nTPM = parseFloat(values[nTPMIndex]);

                    if (tissue.toLowerCase() === 'cilia') continue; 

                    if (geneName && !isNaN(nTPM)) {
                        if (!data[geneName]) data[geneName] = {};
                        data[geneName][tissue] = nTPM;
                    }
                }
            }
            return data;
        }


        // LOAD DATA: Fetch all 5 requested data sources
        async function loadData() {
            try {
                const [masterResp, lookupResp, liResp, neversResp, rnaResp] = await Promise.all([
                    fetch(MASTER_DB),
                    fetch(LOOKUP_DB),
                    fetch(LI_PHYLO_MATRIX),
                    fetch(NEVERS_PHYLO_MATRIX),
                    fetch(RNA_TISSUE_TSV)
                ]);
                
                const masterData = await masterResp.json();
                const genes = Array.isArray(masterData.masterData) ? masterData.masterData : masterData;

                // 1. Populate the main gene map
                genes.forEach(g => {
                    if (g.Gene) {
                        const gene = { ...g, phylogeny: g.phylogeny || {} };
                        gene.gene = g.Gene;
                        ciliaryGeneMap.set(g.Gene.toUpperCase(), gene);
                    }
                });
                
                // 2. Load Phylogeny Matrices
                liMatrix = await liResp.json();
                neversMatrix = await neversResp.json();
                
                // 3. Integrate Phylogeny data into main gene objects
                ciliaryGeneMap.forEach((gene, geneKey) => {
                    gene.phylogeny.li_2014 = liMatrix[gene.Gene] || liMatrix[gene.Gene.toUpperCase()] || gene.phylogeny.li_2014;
                    gene.phylogeny.nevers_2017 = neversMatrix[gene.Gene] || neversMatrix[gene.Gene.toUpperCase()] || gene.phylogeny.nevers_2017;
                });
                
                // 4. Handle RNA Tissue Data (TSV file)
                const rnaText = await rnaResp.text();
                rnaTissueExpressionData = parseTsvData(rnaText);

                allGenes = Array.from(ciliaryGeneMap.values());
                console.log(`Loaded ${ciliaryGeneMap.size} genes and 5 external datasets.`);

            } catch (err) {
                document.getElementById('content-area').innerHTML = `<p style="color:red;padding:20px;">Error loading data from server: ${err.message}. Please verify the data URLs.</p>`;
            }
        }

        // --- Data retrieval utility ---
        function getCleanArray(gene, key) {
            let data = gene[key];
            if (!data) return [];
            if (Array.isArray(data)) return data.map(i => String(i).trim()).filter(Boolean);
            return String(data).split(/[,;]/).map(i => i.trim()).filter(Boolean);
        }

        function findGenes(input) {
            const queries = input
                .split(/[\s,\n;]+/)
                .map(s => s.trim().replace(/\u200B/g, '').toUpperCase())
                .filter(Boolean);
                
            const found = [];
            const seen = new Set();
            
            queries.forEach(q => {
                if (!seen.has(q) && ciliaryGeneMap.has(q)) {
                    found.push(ciliaryGeneMap.get(q));
                    seen.add(q);
                }
            });
            return found;
        }

        // --- PLOT IMPLEMENTATIONS ---

        // * UMAP PLOT (scRNA-seq Lung) - RENAMED FOR CONFLICT RESOLUTION
        async function renderScrnaUMAPPlot(geneSymbol) { 
            const plotDivId = 'plot-display-area';
            
            // CONFLICT RESOLUTION: Using unique local variables for UMAP globals
            const globalUmapData = window.CiliAI_UMAP || []; 
            const globalCellDataCache = window.CiliAI?.cellDataCache || {}; 
            
            const plotDiv = document.getElementById(plotDivId);
            const gene = geneSymbol ? geneSymbol.toUpperCase() : 'FOXJ1'; 

            if (!plotDiv) {
                console.error('UMAP plot container not found.');
                return;
            }
            // Check for missing data using the locally defined variables
            if (globalUmapData.length === 0 || Object.keys(globalCellDataCache).length === 0) {
                plotDiv.innerHTML = `<div id="cilia-svg" style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:16px;">UMAP data is not available (Missing CiliAI_UMAP or cellDataCache).</div>`;
                return;
            }

            plotDiv.innerHTML = '<div id="cilia-svg" style="width: 100%; height: 100%;"></div>';
            const umapPlotDiv = document.getElementById('cilia-svg');

            // 1. Fetch Expression Data and prepare arrays
            const geneExpressionData = globalCellDataCache[gene] || {};
            
            const sampleSize = 15000;
            const sampledData = [];
            const colorArray = [];
            const sizeArray = []; 
            let maxExpression = 0;
            const sizeBase = 5;      
            const sizeScaleMax = 12;      
            const expressionThreshold = 2; 

            const sourceData = globalUmapData.length > sampleSize 
                            ? globalUmapData.sort(() => 0.5 - Math.random()).slice(0, sampleSize) 
                            : globalUmapData;

            for (const point of sourceData) {
                const expressionValue = geneExpressionData[point.cell_type] || 0;
                sampledData.push(point);
                colorArray.push(expressionValue);
                const scaledMagnitude = Math.min(expressionValue, expressionThreshold) / expressionThreshold;
                sizeArray.push(sizeBase + (sizeScaleMax - sizeBase) * scaledMagnitude); 
                if (expressionValue > maxExpression) { maxExpression = expressionValue; }
            }
            
            if (maxExpression === 0 && gene) {
                console.warn(`Gene ${gene} found, but has no detectable expression.`);
            }
            
            // --- Annotations (Cell Type Labels) ---
            const cellTypes = [...new Set(sampledData.map(d => d.cell_type))];
            const annotations = [];
            const median = arr => {
                const sorted = [...arr].sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
            };
            for (const ct of cellTypes) {
                if (!ct) continue;
                const pts = sampledData.filter(d => d.cell_type === ct);
                if (pts.length === 0) continue;
                const xs = pts.map(p => p.x);
                const ys = pts.map(p => p.y);
                annotations.push({
                    x: median(xs),
                    y: median(ys),
                    text: ct,
                    showarrow: false,
                    font: { color: '#FFFFFF', size: 10, family: 'Arial, sans-serif' },
                    bgcolor: 'rgba(0,0,0,0.45)', borderpad: 2, bordercolor: 'rgba(0,0,0,0.45)', borderwidth: 1,
                    xref: 'x', yref: 'y'
                });
            }

            const colorScaleRedGradient = [
                [0, '#F8F8F8'], 
                [0.0001, '#FFDAD0'], 
                [1, '#E60000']      
            ];
            
            const plotData = [{
                x: sampledData.map(p => p.x),
                y: sampledData.map(p => p.y),
                text: sampledData.map((p, i) => `Cell Type: ${p.cell_type}<br>Expression: ${colorArray[i].toFixed(3)}`),
                mode: 'markers',
                type: 'scattergl',
                hoverinfo: 'text',
                marker: {
                    color: colorArray, 
                    colorscale: colorScaleRedGradient, 
                    cmin: 0,
                    cmax: maxExpression > 0 ? maxExpression : 0.0001,
                    colorbar: { title: `${gene} Expr. (TPM)` },
                    size: sizeArray, 
                    opacity: 0.8
                }
            }];

            const layout = {
                title: { 
                    text: `UMAP: <b>${gene}</b> Expression (Size & Color Mapped)`,
                    font: { size: 24, color: "var(--primary)" }
                },
                xaxis: { title: 'UMAP 1', zeroline: false, showgrid: false },
                yaxis: { title: 'UMAP 2', zeroline: false, showgrid: false },
                hovermode: 'closest',
                margin: { t: 50, b: 50, l: 50, r: 50 },
                plot_bgcolor: '#FFFFFF',
                paper_bgcolor: '#F8F8F8',
                annotations: annotations,
                showlegend: false
            };

            Plotly.newPlot(umapPlotDiv, plotData, layout, { responsive: true, displayModeBar: true, scrollZoom: true });
        }
        window.renderScrnaUMAPPlot = renderScrnaUMAPPlot;

// 1. Gene Feature Overview (Manhattan-style) - FIXED
function renderMultiCategoryManhattan(genes, custom) {
    clearPlot();
    const categories = [
        { name: "Localization", key: "Localization", color: "#1f77b4" },
        { name: "Complex", key: "Protein.complexes", color: "#ff7f0e" },
        { name: "Ciliopathy", key: "Ciliopathy", color: "#2ca02c" },
        { name: "Function", key: "Functional.category", color: "#d62728" },
        { name: "Screens", key: "screens_summary", color: "#9467bd" },
        { name: "Phenotypes", key: "Phenotypes_mouse", color: "#8c564b" }
    ];

    const traces = [];
    categories.forEach((cat, catIdx) => {
        const x = [], y = [], text = [], color = [];
        genes.forEach((gene, geneIdx) => {
            const values = getCleanArray(gene, cat.key);
            values.forEach(val => {
                if (val && val !== 'N/A' && val !== 'Unknown') {
                    x.push(catIdx + (Math.random() - 0.5) * 0.6);
                    y.push(geneIdx);
                    text.push(`${gene.gene}<br>${cat.name}: ${val}`);
                    color.push(cat.color);
                }
            });
        });
        if (x.length > 0) {
            traces.push({
                x, y, text, mode: 'markers', name: cat.name,
                marker: { size: 14, color },
                hovertemplate: '%{text}<extra></extra>'
            });
        }
    });

    if (traces.length === 0) {
        document.getElementById('plot-display-area').innerHTML = 
            `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
                No categorical data available for the selected genes.
            </div>`;
        return;
    }

    const layout = {
        title: { text: custom.title || "Gene Feature Overview", font: { size: custom.titleSize } },
        xaxis: { 
            title: "Categories", 
            tickvals: categories.map((_,i)=>i), 
            ticktext: categories.map(c=>c.name),
            gridcolor: '#f0f0f0'
        },
        yaxis: { 
            title: "Genes", 
            tickvals: genes.map((_,i)=>i), 
            ticktext: genes.map(g=>g.gene),
            gridcolor: '#f0f0f0'
        },
        height: custom.height, 
        width: custom.width,
        plot_bgcolor: '#fafafa',
        showlegend: true,
        legend: { orientation: "h", y: -0.2 }
    };
    Plotly.newPlot('plot-display-area', traces, layout, { responsive: true });
}

// 3. Phylogenetic Conservation Heatmap - FIXED
function renderPhylogenyHeatmap(genes, custom) {
    clearPlot();
    const source = custom.source;
    const isLi = source === 'li_2014';
    
    // Get the appropriate organism lists based on source
    let displayedCIL, displayedNCIL, orgs;
    
    if (isLi) {
        // For Li 2014 data - use the species order from the matrix
        displayedCIL = CIL_ORG_FULL;
        displayedNCIL = NCIL_ORG_FULL;
        orgs = [...displayedCIL, ...displayedNCIL];
    } else {
        // For Nevers 2017 data - use the actual organism names from the matrix
        displayedCIL = NEVERS_CIL_PANEL;
        displayedNCIL = NEVERS_NCIL_PANEL;
        orgs = [...displayedCIL, ...displayedNCIL];
    }

    const z = [];
    const yLabels = [];
    
    genes.forEach(gene => {
        const phyData = gene.phylogeny?.[source];
        const row = [];
        
        if (!phyData) {
            // No phylogeny data - mark all as unknown (gray)
            orgs.forEach(() => row.push(0.5));
        } else {
            // Parse the presence data
            let presenceData = [];
            
            if (isLi) {
                // Li 2014 format: uses species indices
                if (phyData.s && Array.isArray(phyData.s)) {
                    presenceData = phyData.s; // species indices
                } else if (phyData.species_indices && Array.isArray(phyData.species_indices)) {
                    presenceData = phyData.species_indices;
                }
                
                orgs.forEach(org => {
                    const orgIndex = LI_SPECIES_ORDER.indexOf(org);
                    row.push(presenceData.includes(orgIndex) ? 1 : 0);
                });
            } else {
                // Nevers 2017 format: uses organism names
                if (phyData.s && Array.isArray(phyData.s)) {
                    presenceData = phyData.s; // organism names
                } else if (phyData.species_data && Array.isArray(phyData.species_data)) {
                    presenceData = phyData.species_data;
                }
                
                orgs.forEach(org => {
                    // Check if this organism is in the presence data
                    const isPresent = presenceData.some(presentOrg => 
                        presentOrg.includes(org) || org.includes(presentOrg)
                    );
                    row.push(isPresent ? 1 : 0);
                });
            }
        }
        
        z.push(row);
        yLabels.push(gene.gene);
    });

    // Add separator line between CIL and NCIL panels
    const separatorIndex = displayedCIL.length - 0.5;
    
    const data = [{
        type: 'heatmap', 
        z: z, 
        x: orgs, 
        y: yLabels,
        colorscale: [
            [0, '#f0f0f0'],    // Absent - light gray
            [0.5, '#d3d3d3'],  // Unknown/No data - medium gray  
            [1, '#005b96']     // Present - primary blue
        ],
        showscale: true,
        colorbar: {
            title: 'Presence',
            tickvals: [0.25, 0.75],
            ticktext: ['Absent', 'Present']
        },
        hovertemplate: 'Gene: %{y}<br>Organism: %{x}<br>Presence: %{z}<extra></extra>'
    }];

    const layout = {
        title: { 
            text: custom.title || `Phylogenetic Conservation (${isLi ? 'Li et al. 2014' : 'Nevers et al. 2017'})`,
            font: { size: custom.titleSize }
        },
        xaxis: { 
            tickangle: -45, 
            side: 'top',
            tickfont: { size: 9 },
            automargin: true
        },
        yaxis: { 
            automargin: true,

        },
        height: custom.height,

function renderExpressionHeatmap(genes, custom) {
    clearPlot();
    
    if (Object.keys(rnaTissueExpressionData).length === 0) {
        document.getElementById('plot-display-area').innerHTML = 
            `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
                Tissue expression data is not available.
            </div>`;
        return;
    }

    const geneSymbols = genes.map(g => g.gene);
    
    // Get all tissues from the data
    const allTissues = new Set();
    geneSymbols.forEach(symbol => {
        const exprData = rnaTissueExpressionData[symbol];
        if (exprData) {
            Object.keys(exprData).forEach(tissue => allTissues.add(tissue));
        }
    });
    
    const tissueArray = Array.from(allTissues).sort();
    
    if (tissueArray.length === 0) {
        document.getElementById('plot-display-area').innerHTML = 
            `<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:16px;">
                No expression data found for the selected genes.
            </div>`;
        return;
    }

    const z = [];
    let maxNTPM = 0;
    
    geneSymbols.forEach(symbol => {
        const row = [];
        const exprData = rnaTissueExpressionData[symbol] || {};
        
        tissueArray.forEach(tissue => {
            const nTPM = exprData[tissue] || 0;
            row.push(nTPM);
            if (nTPM > maxNTPM) maxNTPM = nTPM;
        });
        
        z.push(row);
    });

    const data = [{
        type: 'heatmap', 
        z: z, 
        x: tissueArray, 
        y: geneSymbols,
        colorscale: [
            [0, '#f7fbff'],
            [0.2, '#c6dbef'],

        // MAIN GENERATOR
        function generatePlot() {
            const input = document.getElementById('ciliaplot-genes-input').value.trim();
            if (!input) {
                alert("Please enter at least one gene symbol.");
                return;
            }

            const type = document.getElementById('analysis-dropdown').value; 

            if (!type) {
                 alert("Please select a plot type.");
                 return;
            }

            const plotArea = document.getElementById('plot-display-area');
            plotArea.innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#666; font-size:18px;">Searching genes and generating plot...</div>';

            const queries = input.split(/[\s,\n;]+/).map(s => s.trim().replace(/\u200B/g, '').toUpperCase()).filter(Boolean);
            const genes = findGenes(input);
            const custom = getCustom();


            if (genes.length === 0) {
                plotArea.innerHTML = `
                    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#d62728; font-size:18px; text-align:center; padding:40px;">
                        <strong>No genes found in the CiliaHub database</strong><br><br>
                        <small>Entered: ${queries.slice(0, 10).join(', ')}${queries.length > 10 ? '...' : ''}</small>
                    </div>`;
                return;
            }

            console.log(`Found ${genes.length} unique gene(s): ${genes.map(g => g.gene).join(', ')}`);


            const renderers = {
                'gene_overview': renderMultiCategoryManhattan, 
                'expression_heatmap': renderExpressionHeatmap,
                'scrna_dot': window.renderScrnaUMAPPlot, // Mapped to the global UMAP function
                'ciliopathy': renderCiliopathyPlot,
                'localization_heatmap': renderLocalizationHeatmap,
                'crispr_screens': renderScreenSummaryHeatmap,
                'protein_domains': renderDomainArchitecture,
                'protein_complex': renderComplexNetwork, 
                'mouse_phenotypes': renderMousePhenotypeHeatmap,
                'phylogeny': renderPhylogenyHeatmap 
            };

            const renderer = renderers[type];

            if (!renderer) {
                plotArea.innerHTML = `
                    <div style="height:100%; display:flex; align-items:center; justify-content:center; color:#e74c3c; font-size:20px;">
                        Plot type "${type}" not implemented or mapped yet.
                    </div>`;
                return;
            }

            try {
                // Special handling for UMAP to pass the primary gene symbol
                if (type === 'scrna_dot') {
                    const geneSymbol = genes[0].gene; // Use the first gene found
                    renderer(geneSymbol); 
                } else {
                    renderer(genes, custom);
                }
            } catch (error) {
                console.error("Plot rendering error:", error);
                plotArea.innerHTML = `
                    <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e74c3c; font-size:18px; text-align:center;">
                        <strong>Plot failed to render</strong><br><br>
                        <small>${error.message}</small><br><br>
                        <button onclick="generatePlot()" style="padding:10px 20px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer;">
                            Try Again
                        </button>
                    </div>`;
            }
        }
