    async function downloadPlot() {
        const plotArea = document.getElementById('plot-display-area');
        const plotlyDiv = plotArea.querySelector('.plotly');
        const canvas = plotArea.querySelector('canvas');
        const svg = plotArea.querySelector('svg');
        const format = document.getElementById('download-format').value || 'png';
        const fileName = `CiliaPlot_export.${format}`;

        let dataUrl;
        let width = 1200; 
        let height = 900;

        try {
            if (plotlyDiv) {
                await new Promise(resolve => setTimeout(resolve, 50)); 
                await Plotly.toImage(plotArea, {format: 'png', width: width, height: height}).then(function(url) {
                    dataUrl = url;
                });
            } else if (canvas) {
                dataUrl = canvas.toDataURL('image/png', 1.0);
                width = canvas.width; 
                height = canvas.height;
            } else if (svg) {
                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(svg);
                const tempCanvas = document.createElement('canvas');
                const ctx = tempCanvas.getContext('2d');
                width = svg.clientWidth * 2;
                height = svg.clientHeight * 2;
                tempCanvas.width = width;
                tempCanvas.height = height;
                const img = new Image();
                await new Promise((resolve) => {
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, width, height);
                        dataUrl = tempCanvas.toDataURL('image/png');
                        resolve();
                    };
                    img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
                });
            }

            if (!dataUrl) { 
                throw new Error("Could not generate image data."); 
            }

            if (format === 'png') {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                link.click();
            } else if (format === 'pdf') {
                if (typeof window.jspdf === 'undefined') {
                     throw new Error("jsPDF library is not loaded. Cannot export to PDF.");
                }
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ 
                    orientation: width > height ? 'l' : 'p', 
                    unit: 'px', 
                    format: [width, height] 
                });
                pdf.addImage(dataUrl, 'PNG', 0, 0, width, height);
                pdf.save(fileName);
            }
        } catch (e) {
            console.error("Download failed:", e);
        }
    }

    function sanitize(s) {
        if (!s) return null;
        let str = String(s).trim();
        str = str.replace(/\s+/g, ' ').trim();
        return str ? str.toUpperCase() : null;
    }

    function getCleanArray(gene, ...keys) {
        let data = null;
        for (const key of keys) {
            if (gene[key] != null) { data = gene[key]; break; }
        }
        if (data == null) return [];
        const separatorRegex = /[,;]/;
        const initialArray = Array.isArray(data) ? data : String(data).split(separatorRegex);
        return initialArray.filter(Boolean).flatMap(item => String(item).split(separatorRegex)).map(item => item.trim()).filter(Boolean);
    }
    
    function parseTSV(tsvText) {
        const lines = tsvText.split('\n');
        if (lines.length < 2) return [];
        const headers = lines[0].trim().split('\t');
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].trim().split('\t');
            if (values.length === headers.length) {
                const row = {};
                headers.forEach((h, j) => { row[h] = values[j]; });
                data.push(row);
            }
        }
        return data;
    }

    function processExpressionData(rawData) {
        const expressionData = {};
        rawData.forEach(row => {
            const gene = row['Gene'];
            if (gene) {
                expressionData[gene] = {};
                Object.keys(row).forEach(key => {
                    if (key !== 'Gene') {
                        expressionData[gene][key] = parseFloat(row[key]) || 0;
                    }
                });
            }
        });
        return expressionData;
    }

    function updateGeneSummaryTable(originalQueries, foundGenes) {
        const tbody = document.getElementById('ciliaplot-gene-summary-tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        const foundIds = new Set();
        // Use the original queries to determine the display status
        const geneMap = window.ciliaryGeneMap;

        originalQueries.forEach((query) => {
             const sanitizedQuery = sanitize(query);
             if (sanitizedQuery && geneMap.has(sanitizedQuery)) {
                foundIds.add(sanitizedQuery);
             }
        });

        originalQueries.forEach((query, index) => {
            const sanitizedQuery = sanitize(query);
            const status = foundIds.has(sanitizedQuery) ? 'Found' : 'Not Found';
            const statusColor = status === 'Found' ? '#28a745' : '#dc3545';
            
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${query}</td>
                    <td style="color: ${statusColor}; font-weight: bold;">${status}</td>
                </tr>
            `;
        });
        
        if (originalQueries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Enter genes to see summary...</td></tr>';
        }
    }

    function addGeneToInputAndRerun(geneSymbol) {
        if (!geneSymbol) return;

        const inputElement = document.getElementById('ciliaplot-genes-input');
        const existingGenes = inputElement.value.split(/[\s,;\n\r\t]+/).filter(Boolean).map(g => g.toUpperCase());

        const upperSymbol = geneSymbol.toUpperCase();
        
        if (existingGenes.includes(upperSymbol)) {
            console.warn(`Gene ${upperSymbol} is already in the input list.`);
            return;
        }

        let newValue = existingGenes.join('\n');
        newValue += (newValue ? '\n' : '') + upperSymbol;
        
        inputElement.value = newValue;

        document.getElementById('generate-ciliaplot-btn')?.click();
    }
    
    // 🛠️ FIX: Ensure that the found gene object has the required 'gene' and 'Gene' keys for plotting functions.
    function findAndMergeGenes(queries) { 
        const foundGenes = queries.map(q => {
            const geneSymbol = q.toUpperCase();
            const geneData = window.ciliaryGeneMap.get(geneSymbol);
            if (geneData) {
                // Ensure gene name consistency for plotting functions
                return { ...geneData, gene: geneSymbol, Gene: geneSymbol };
            }
            return null;
        }).filter(g => g);
        return { foundGenes };

        const CIL_ORG = sourceKey === 'nevers_2017' ? NEVERS_CIL_PANEL : LI_CIL_ORG;
        const NCIL_ORG = sourceKey === 'nevers_2017' ? NEVERS_NCIL_PANEL : LI_NCIL_ORG;
        return { CIL_ORG, NCIL_ORG, allOrganisms: [...CIL_ORG, ...NCIL_ORG] };

        const sourceKey = 'nevers_2017';
        const { CIL_ORG, NCIL_ORG, allOrganisms } = getOrganismConfig(sourceKey);

        const zData = [];
        const customTextData = [];

                if (phylogenyData && phylogenyData.species_data && Array.isArray(phylogenyData.species_data)) {
                    const isConserved = phylogenyData.species_data.includes(orgIndex);

                        status = isCiliated ? 2 : 1;
                        isDataPresent = true;

        const plotId = 'plot-display-area';

        if (!plotDiv) return;

        const sourceKey = source.toLowerCase().includes('nevers') ? 'nevers_2017' : 'li_2014';
        custom.phylogenySource = sourceKey;
        custom.figureWidth = plotDiv.clientWidth;
        custom.figureHeight = Math.max(500, genes.length * 40 + 150); 
        
        plotDiv.innerHTML = `<div style="padding: 40px; text-align: center;">Loading ${sourceKey.toUpperCase()} phylogeny plot...</div>`;

        try {
            let plotResult;
            if (sourceKey === 'nevers_2017') {
                plotResult = renderNeversHeatmap(genes, custom);
            } else {
                plotResult = renderLiHeatmap(genes, custom);
            }

            if (!plotResult || !plotResult.plotData) throw new Error('The plot renderer returned no data.');

            Plotly.newPlot(plotId, plotResult.plotData, plotResult.plotLayout, { responsive: true });
            
            document.getElementById('phylogeny-controls')?.remove(); 
            
            const source = sourceKey.includes('nevers') ? 'nevers' : 'li';
            
            plotDiv.insertAdjacentHTML('beforebegin', `
                <div id="phylogeny-controls" style="padding: 10px; background: #f0f0f0; border-radius: 5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">

    // --- PLOT 2: FUNCTIONAL ENRICHMENT BUBBLE PLOT ---
    function renderEnrichmentBubblePlot(genes, custom) {
        // Implementation provided by the user in the snippet (already integrated)
        const plotContainer = document.getElementById('plot-display-area');
        clearAllPlots('plot-display-area');
        
        const categoryCounts = new Map();
        const totalGenes = genes.length;
        
        genes.forEach(gene => {
            getCleanArray(gene, 'functional_category').forEach(cat => {
                categoryCounts.set(cat, (categoryCounts.get(cat) || 0) + 1);
            });
        });
        
        const enrichmentData = [];
        const allCategories = [...categoryCounts.keys()];
        
        allCategories.forEach(category => {
            const countInSet = categoryCounts.get(category);
            const proportionInSet = countInSet / totalGenes;
            const proportionInDatabase = 0.1; // Mock database proportion
            const enrichmentScore = proportionInSet / proportionInDatabase;
            const pValue = 1 / (enrichmentScore * 10);
            
            enrichmentData.push({
                category,
                count: countInSet,
                enrichment: enrichmentScore,
                pValue: pValue
            });
        });
        
        const data = [{
            x: enrichmentData.map(d => d.category),
            y: enrichmentData.map(d => d.enrichment),
            text: enrichmentData.map(d => `Category: ${d.category}<br>Count: ${d.count}<br>Enrichment: ${d.enrichment.toFixed(2)}<br>p-value: ${d.pValue.toFixed(4)}`),
            mode: 'markers',
            marker: {
                size: enrichmentData.map(d => (custom.bubbleSize || 15) * (d.count / 5 + 0.5)),
                color: enrichmentData.map(d => -Math.log10(d.pValue)),
                colorscale: 'Viridis',
                showscale: true,
                colorbar: {
                    title: '-log10(p-value)',
                    titleside: 'right'
                },
                line: { color: '#000', width: 1 }
            }
        }];
        
        const layout = {
            title: { text: custom.title || 'Functional Category Enrichment', font: { size: custom.titleFontSize, family: custom.fontFamily, color: custom.fontColor } },
            xaxis: { title: { text: 'Functional Category', font: custom.axisTitleFont }, visible: custom.showX, tickangle: -45, linecolor: '#000', linewidth: 2, mirror: true, showgrid: false, zeroline: false, tickfont: { size: custom.columnFontSize, family: custom.fontFamily, color: custom.fontColor } },
            yaxis: { title: { text: 'Enrichment Score', font: custom.axisTitleFont }, visible: custom.showY, linecolor: '#000', linewidth: 2, mirror: true, showgrid: false, zeroline: false, tickfont: { size: custom.rowFontSize, family: custom.fontFamily, color: custom.fontColor } },
            hovermode: 'closest',
            showlegend: false,
            width: custom.figureWidth, height: custom.figureHeight,
            margin: { l: 120, r: 50, b: 150, t: 80 },
            plot_bgcolor: 'white', paper_bgcolor: 'white'
        };
        
        Plotly.newPlot('plot-display-area', data, layout, { responsive: true });
    }

    // --- PLOT 3: MULTI-CATEGORY MANHATTAN PLOT ---
    function renderMultiCategoryPlot(genes, custom = {}) {
        // Implementation provided by the user in the snippet (already integrated)
        clearAllPlots('plot-display-area');

        // Helper: capitalize first letter of words
        const capitalize = (s) => s ? s.replace(/\b\w/g, c => c.toUpperCase()) : '';

        // Helper: safely extract array from gene object
        const getCleanArray = (gene, key) => {
            if (!key || !gene[key]) return [];
            if (key === 'Functional.category' && typeof gene[key] === 'string') {
                return gene[key].split(/[,;]/).map(item => item.trim()).filter(Boolean);
            }
            return Array.isArray(gene[key]) ? gene[key] : [gene[key]];
        };

        const softColors = {
            localization: ['#8dd3c7','#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462','#b3de69','#fccde5','#d9d9d9','#bc80bd'],
            ciliopathy:    ['#fbb4ae','#b3cde3','#ccebc5','#decbe4','#fed9a6','#ffffcc','#e5d8bd','#fddaec','#f2f2f2'],
            screens:       ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9'],
            phenotype: ['#32cd32', '#ff4500', '#1e90ff'], // Green, Red, Blue
            ortholog: ['#9932cc', '#ff8c00', '#00ced1'], // Purple, Orange, Teal
            complex: ['#547c8d'],
            domain: ['#8fbc8f'],
            function: ['#f08080'],
        };

        // --- 1. ENHANCED CATEGORY DEFINITIONS ---
        const categories = {
            'Ortholog Presence': { key: ['Ortholog_Mouse', 'Ortholog_C_elegans', 'Ortholog_Zebrafish'], data: new Set(), color: softColors.ortholog, description: 'Presence of orthologs in key model organisms.', type: 'ortholog' },
            'Cilia Phenotype': { key: 'mouse_ciliopathy_phenotype', data: new Set(), color: softColors.phenotype, description: 'Mouse Ciliopathy Phenotypes.', type: 'phenotype' },
            'Functional Category': { key: 'functional_category', data: new Set(), color: softColors.function, description: 'Broad functional class of the protein.', type: 'single' },
            'Subcellular Localization': { key: 'localization', data: new Set(), color: softColors.localization, description: 'Gene localization within the cell.', type: 'multi' },
            'Complex Names': { key: 'complex_components', data: new Set(), color: softColors.complex, description: 'Protein complexes the gene is associated with.', type: 'single' },
            'Protein Domains': { key: 'domain_descriptions', data: new Set(), color: softColors.domain, description: 'Functional protein domains.', type: 'single' },
            'Ciliopathy': { key: 'ciliopathy', data: new Set(), color: softColors.ciliopathy, description: 'Association with ciliopathy disorders.', type: 'multi' },
            'Ciliogenesis Screen': { key: 'screens_summary', data: new Set(), color: softColors.screens, description: 'Results from functional screens.', type: 'screen' }
        };

        const plotPoints = [];
        const geneTracker = new Map();
        const processedGenes = [];
        
        // Process genes for unique Y-axis names
        genes.forEach((gene) => {
            const geneName = gene.gene;
            let uniqueGeneName = geneName;
            if (geneTracker.has(geneName)) {
                const count = geneTracker.get(geneName) + 1;
                geneTracker.set(geneName, count);
                uniqueGeneName = `${geneName}_${count}`;
            } else {
                geneTracker.set(geneName, 1);
            }
            processedGenes.push({...gene, uniqueGeneName, originalGeneName: geneName});
        });
        
        // Y-axis order
        const allFoundGenes = processedGenes.map(g => g.uniqueGeneName).sort();
        
        // --- 2. Process Genes → Populate Categories & Plot Points ---
        processedGenes.forEach(gene => {
            const uniqueGeneName = gene.uniqueGeneName;
            const originalGeneName = gene.originalGeneName;

            Object.keys(categories).forEach(catName => {
                const cat = categories[catName];

                if (cat.type === 'ortholog') {
                    cat.key.forEach(orgKey => {
                        const org = orgKey.replace('Ortholog_', '');
                        if (gene[orgKey]) {
                            const item = `${org} (${gene[orgKey]})`;
                            cat.data.add(item);
                            plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: item, colorKey: org });
                        }
                    });
                }
                else if (cat.type === 'screen') {
                    if (Array.isArray(gene[cat.key])) {
                        gene[cat.key].forEach(screen => {
                            const screenType = screen.source || 'Unknown Screen';
                            cat.data.add(screenType);
                            plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: screenType, screenData: screen, colorKey: screenType });
                        });
                    }
                }
                else if (cat.key === 'complex_components') {
                    if (gene.complex_components) {
                        Object.keys(gene.complex_components).forEach(complexName => {
                            // Only count if the gene is actually listed as part of the complex definition
                            if (gene.complex_components[complexName].map(m => m.toUpperCase()).includes(originalGeneName.toUpperCase())) {
                                cat.data.add(complexName);
                                plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: complexName, colorKey: complexName });
                            }
                        });
                    }
                }
                else {
                    getCleanArray(gene, cat.key).forEach(item => {
                        if (item) {
                            cat.data.add(item);
                            plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: item, colorKey: item });
                        }
                    });
                }
            });
        });

        if (plotPoints.length === 0) {
            document.getElementById('plot-display-area').innerHTML = '<p style="text-align: center; padding: 50px;">No relevant feature data found for the provided genes.</p>';
            return;
        }

        // --- 3. Build X-axis Mapping ---
        let xOffset = 0;
        const itemToXPos = new Map();
        const sectionTicks = [];
        const sectionLines = [];
        const pointSpacing = 1.0; 
        const sectionPadding = 15; 

        Object.keys(categories).forEach(catName => {
            const items = Array.from(categories[catName].data).sort();
            if (items.length > 0) {
                const sectionWidth = Math.max((items.length - 1) * pointSpacing, 1);
                
                sectionTicks.push({ pos: xOffset + sectionWidth / 2, name: catName, start: xOffset, end: xOffset + sectionWidth });
                
                items.forEach((item, idx) => {
                    itemToXPos.set(`${catName}-${item}`, xOffset + (idx * pointSpacing));
                });
                
                xOffset += sectionWidth + sectionPadding;
                sectionLines.push({ x: xOffset - sectionPadding / 2, color: '#CCCCCC' });
            }
        });

        // --- 4. Build Plotly Traces ---
        const dataTraces = [];
        const colorMap = {}; 

        // Build the main traces, grouping by Category first.
        Object.keys(categories).forEach(catName => {
            const config = categories[catName];
            const items = Array.from(config.data).sort();
            
            if (items.length > 0) {
                
                items.forEach((item, idx) => {
                    let color;
                    if (config.type === 'ortholog' || config.type === 'phenotype' || config.type === 'multi' || config.type === 'screen') {
                        // Use category-specific colors for feature-by-feature distinction
                        color = config.color[idx % config.color.length];
                    } else {
                        // Use a single color for 'single' categories
                        color = config.color[0];
                    }
                    colorMap[item] = color;
                });
                
                // Create a trace for each unique item/feature, but only show legend for multi-type features
                items.forEach((item, idx) => {
                    const pointsForItem = plotPoints.filter(p => p.item === item && p.category === catName);
                    if (pointsForItem.length > 0) {
                        const isFeatureTrace = (config.type === 'multi' || config.type === 'screen' || config.type === 'ortholog' || config.type === 'phenotype');
                        
                        dataTraces.push({
                            x: pointsForItem.map(p => itemToXPos.get(`${p.category}-${p.item}`)),
                            y: pointsForItem.map(p => p.gene),
                            text: pointsForItem.map(p => {
                                const screenInfo = (config.type === 'screen' && p.screenData) ? `<br><b>Source:</b> ${p.screenData.source}<br><b>Result:</b> ${p.screenData.result || 'N/A'}` : '';
                                return `<b>Gene:</b> ${p.originalGene}<br><b>${catName}:</b> ${p.item}${screenInfo}`;
                            }),
                            hoverinfo: 'text',
                            type: 'scatter',
                            mode: 'markers',
                            name: isFeatureTrace ? capitalize(item) : catName, 
                            showlegend: isFeatureTrace, 
                            marker: {
                                size: custom.bubbleSize || 8,
                                color: colorMap[item],
                                symbol: config.type === 'ortholog' ? ['circle', 'square', 'diamond'][idx % 3] : 'circle', // Use different symbols for Orthologs
                                line: { width: 1, color: '#333' }
                            }
                        });
                    }
                });
                
                // Add a transparent trace for the category header
                if (!isFeatureTrace && items.length > 0) {
                    dataTraces.push({ name: catName, type: 'scatter', mode: 'markers', x: [], y: [], 
                        marker: { size: custom.bubbleSize || 8, color: config.color[0], line: { width: 1, color: '#333' } },
                        showlegend: true
                    });
                }
            }
        });

        // --- 5. Layout ---
        const customTickLabels = processedGenes.map(g => g.originalGeneName);
        const yTickFont = { weight: 'bold', size: 10, family: custom.fontFamily };
        const xTickFont = { weight: 'bold', size: 12, family: custom.fontFamily };

        // Annotations for X-axis labels (rotated features under the dots)
        const xAnnotations = [];
        Object.keys(categories).forEach(catName => {
            const items = Array.from(categories[catName].data).sort();
            if (items.length > 0) {
                items.forEach((item) => {
                    const xPos = itemToXPos.get(`${catName}-${item}`);
                    xAnnotations.push({
                        xref: 'x', yref: 'paper', x: xPos, y: -0.1, // Adjusted Y position
                        text: item.replace(/\s/g, '<br>'), // Word wrap long labels
                        showarrow: false,
                        xanchor: 'center', yanchor: 'top',
                        font: { size: 7, color: '#555' },
                        textangle: 0, 
                        yshift: -5 
                    });
                });
            }
        });


        const layout = {
            title: { text: custom.title || 'Gene Feature Overview (Multi-Category Dot Plot)', font: { size: custom.titleFontSize || 20, ...custom.axisTitleFont } },
            xaxis: {
                title: { text: 'Feature Categories', font: { ...custom.axisTitleFont, weight: 'bold' } },
                // Major ticks for categories (placed in the middle of each section)
                tickvals: sectionTicks.map(t => t.pos),
                ticktext: sectionTicks.map(t => `<b>${t.name}</b>`),
                showticklabels: true, showgrid: false, zeroline: false,
                tickfont: xTickFont
            },
            yaxis: {
                title: { text: 'Gene', font: { ...custom.axisTitleFont, weight: 'bold' } },
                tickfont: yTickFont,
                categoryorder: 'array', categoryarray: allFoundGenes.reverse(),
                tickvals: allFoundGenes, ticktext: customTickLabels.reverse(),
                showgrid: false, showline: true, linewidth: 2, linecolor: 'black',
                tickmode: 'array', automargin: true

    // --- PLOT 4: ORTHOLOG HEATMAP (REPLACED WITH TABLE) ---
    function extractOrthologData(gene) {
        const organisms = ['Mouse', 'C_elegans', 'Zebrafish', 'Xenopus', 'Drosophila'];
        const orthologs = [];

        organisms.forEach(org => {
            const key = `Ortholog_${org}`;
            const rawValue = gene[key];
            const hasOrtholog = !!rawValue && rawValue !== '—' && rawValue.toLowerCase() !== 'not reported';
            
            orthologs.push({
                organism: org.replace('_', ' ').replace('Xenopus', 'X. tropicalis'),
                status: hasOrtholog ? 'Yes' : 'No Ortholog',
                name: hasOrtholog ? rawValue : '—'
            });
        });
        return orthologs;
    }

    function renderLofCiliaVsCountScatter(genes, custom) {
        clearAllPlots('plot-display-area');

        // --- MAPPING LOGIC (All values are now quoted strings) ---
        const rawToValueMap = {
            'decrease': '-1', 'shorter': '-1', 'reduced': '-1', 'loss': '-1', 'fail': '-1', 'absent': '-1',
            'shorter cilia': '-1', 'reduced cilia numbers': '-1', 'decreased cilia numbers': '-1', 'short cilia': '-1', 
            'increase': '1', 'longer': '1', 'supernumerary': '1', 'longer cilia': '1', 'increased cilia numbers': '1',
            'no effect': '0', 'no change': '0', 'baseline': '0'
        };
        
        const valueToLabelMap = { '1': 'Increase (Longer)', '-1': 'Decrease (Shorter)', '0': 'Baseline/No Effect' };
        const NOT_REPORTED_KEYWORDS = ['—', 'n/a', 'not reported', 'notreported', 'not evaluated'];
        const NOT_REPORTED_LABEL = 'Not Reported / N/A';

        const getEffectData = (gene, key) => {
            let raw = String(gene[key] || '—').toLowerCase().trim();
            raw = raw.replace(/\(.*\)/g, '').replace(/[.,]$/g, '').trim(); 
            
            let value = '0'; // Default value is string '0'
            let label = NOT_REPORTED_LABEL;
            let isReported = false;

            if (NOT_REPORTED_KEYWORDS.includes(raw) || raw.length === 0) {
                return { value: '0', label: NOT_REPORTED_LABEL, isReported: false };
            }
            
            isReported = true;
            for (const [phrase, val] of Object.entries(rawToValueMap)) {
                if (raw.includes(phrase)) {
                    value = val;
                    label = valueToLabelMap[value];
                    return { value, label, isReported: true }; 
                }
            }
            return { value: '0', label: `Unmapped: ${raw}`, isReported: true }; 
        };
        
        const dataPoints = [];
        
        genes.forEach(gene => {
            const loF_len_key = 'Loss-of-Function (LoF) effects on cilia length (increase/decrease/no effect)';
            const loF_count_key = 'Percentage of ciliated cells (increase/decrease/no effect)';
            const overExp_len_key = 'Overexpression effects on cilia length (increase/decrease/no effect)'; 

            const loF_len = getEffectData(gene, loF_len_key);
            const loF_count = getEffectData(gene, loF_count_key);
            const overExp_len = getEffectData(gene, overExp_len_key);

            const isReported = loF_len.isReported || loF_count.isReported;
            
            if (isReported) {
                const x_coord = parseFloat(loF_len.value);
                const y_coord = parseFloat(loF_count.value);
                
                dataPoints.push({
                    x: x_coord, 
                    y: y_coord, 
                    gene: gene.gene,
                    text: `<b>Gene:</b> ${gene.gene}<br>` +
                          `<b>LoF Length:</b> ${loF_len.label}<br>` + 
                          `<b>LoF Cell %:</b> ${loF_count.label}<br>` +
                          `<b>OE Length:</b> ${overExp_len.label}`,
                    color: x_coord * y_coord < 0 ? '#d62728' : (x_coord * y_coord > 0 ? '#2ca02c' : '#ff7f0e')
                });
            }
        });

        if (dataPoints.length === 0) {
            document.getElementById('plot-display-area').innerHTML = '<p style="text-align: center; padding: 50px;">The filter successfully excluded all genes explicitly marked as "Not Reported" or "—". No other perturbation data was found.</p>';
            return;
        }
        
        const data = [{
            x: dataPoints.map(d => d.x), y: dataPoints.map(d => d.y),
            text: dataPoints.map(d => d.text), mode: 'markers', type: 'scatter', hoverinfo: 'text',
            marker: { size: custom.bubbleSize || 18, color: dataPoints.map(d => d.color), line: { color: '#000', width: 1 } }
        }];

        const layout = {
            title: { text: custom.title || 'LoF Effect: Cilia Length vs. Ciliated Cell Count', font: { size: custom.titleFontSize, family: custom.fontFamily, color: custom.fontColor } },
            xaxis: {
                title: { text: 'Loss-of-Function Effect (Cilia Length)', font: custom.axisTitleFont },
                tickvals: [-1, 0, 1], ticktext: [valueToLabelMap['-1'], valueToLabelMap['0'], valueToLabelMap['1']], range: [-1.2, 1.2],
                zeroline: true, zerolinewidth: 2, zerolinecolor: '#ccc'
            },
            yaxis: {
                title: { text: 'LoF Effect on Ciliated Cell % (Y-Axis)', font: custom.axisTitleFont },
                tickvals: [-1, 0, 1], ticktext: [valueToLabelMap['-1'], valueToLabelMap['0'], valueToLabelMap['1']], range: [-1.2, 1.2],
                zeroline: true, zerolinewidth: 2, zerolinecolor: '#ccc'
            },
            showlegend: false,
            width: custom.figureWidth, height: custom.figureHeight,
            margin: { l: 150, r: 80, b: 100, t: 80 },
            plot_bgcolor: 'white', paper_bgcolor: 'white'
        };

        Plotly.newPlot('plot-display-area', data, layout, { responsive: true });

                row[tissue] = parseFloat(gene.expression.tissue[tissue]) || 0;

            .range([0, innerWidth])

        svg.selectAll()

    }

    // --- PLOT 8: COMPLEX NETWORK ---
    function computeProteinComplexLinks(genes) {
        const nodes = [];
        const nodeSet = new Set();
        const linkMap = new Map();
        const complexMap = new Map();
        
        genes.forEach(gene => {
            const geneId = gene.gene.toUpperCase();
            if (!nodeSet.has(geneId)) {
                nodes.push({ id: gene.gene, group: 1 });
                nodeSet.add(geneId);
            }

            if (gene.complex_components && typeof gene.complex_components === 'object') {
                Object.entries(gene.complex_components).forEach(([complexName, members]) => {
                    if (members.map(m => m.toUpperCase()).includes(geneId)) {
                        if (!complexMap.has(complexName)) complexMap.set(complexName, new Set());
                        // Only link genes present in the current input list
                        members.forEach(member => {
                            if (genes.some(g => (g.gene || g.Gene).toUpperCase() === member.toUpperCase())) {
                                complexMap.get(complexName).add(member);
                            }
                        });
                    }
                });
            }
        });
        
        // Convert complex memberships into links
        complexMap.forEach((genesInComplex, complexName) => {
            const geneArray = Array.from(genesInComplex);
            for (let i = 0; i < geneArray.length; i++) {
                for (let j = i + 1; j < geneArray.length; j++) {
                    const sortedPair = [geneArray[i], geneArray[j]].sort();
                    const key = sortedPair.join('-');
                    if (!linkMap.has(key)) {
                        linkMap.set(key, { 
                            source: sortedPair[0], 
                            target: sortedPair[1], 
                            value: 1,
                            complex: complexName 
                        });
                    }
                }
            }
        });
        
        return { 
            nodes: nodes.filter(n => Array.from(linkMap.values()).some(l => l.source === n.id || l.target === n.id)), 
            links: Array.from(linkMap.values()) 
        };
    }

    function renderComplexNetwork(genes, container, custom) {
        clearAllPlots(container.id);
        
        const { nodes, links } = computeProteinComplexLinks(genes);
        if (!nodes.length || !links.length) {
            container.innerHTML = '<p style="text-align: center; padding: 50px;">No complex links found among the provided genes or associated complex components.</p>';
            return;
        }
        
        const containerRect = container.getBoundingClientRect();
        const width = custom.figureWidth || (containerRect.width - 20);
        const height = custom.figureHeight || (containerRect.height - 20);
        
        // D3 setup logic (as provided by user)
        const svg = d3.select("#plot-display-area")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", `0 0 ${width} ${height}`)
            .style("border", custom.border ? `1px solid ${custom.borderColor}` : "none");
        
        // Add title
        svg.append("text")
            .attr("x", width / 2)
            .attr("y", 20)
            .attr("text-anchor", "middle")
            .style("font-size", custom.titleFontSize + "px")
            .style("font-family", custom.fontFamily)
            .style("font-weight", "bold")
            .style("fill", custom.fontColor)
            .text(custom.title || "Protein Complex Network");
        
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(25))
            .force("x", d3.forceX(width / 2).strength(0.1))
            .force("y", d3.forceY(height / 2).strength(0.1));
        
        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .enter()
            .append("line")
            .style("stroke", "#999")
            .style("stroke-opacity", 0.8)
            .style("stroke-width", 2);
        
        const nodeGroup = svg.append("g")
            .selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .call(d3.drag()
                .on("start", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                })
                .on("drag", (event, d) => {
                    d.fx = Math.max(25, Math.min(width - 25, event.x));
                    d.fy = Math.max(35, Math.min(height - 25, event.y));
                })
                .on("end", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }));
        
        nodeGroup.append("circle")
            .attr("r", 12)
            .style("fill", "#3498db")
            .style("stroke", "#2980b9")
            .style("stroke-width", 2);
        
        nodeGroup.append("text")
            .text(d => d.id)
            .attr("x", 15)
            .attr("y", 5)
            .style("font-family", custom.fontFamily || "Arial")
            .style("font-size", "11px")
            .style("fill", custom.fontColor || "#333");
        
        simulation.on("tick", () => {
            // Keep nodes within bounds
            nodes.forEach(d => {
                d.x = Math.max(25, Math.min(width - 25, d.x));
                d.y = Math.max(35, Math.min(height - 25, d.y));
            });
            
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            nodeGroup
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        currentPlotInstance = { destroy: () => svg.remove() };
    }

    async function loadAllData() {
        const geneMasterUrl = 'https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/refs/heads/main/ciliAI_master_database.json';
        const lookupDataUrl = 'https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/refs/heads/main/ciliAI_lookups.json'; 

        try {
            window.log(`Fetching master data from: ${geneMasterUrl}`);

            const [geneMasterResponse, lookupDataResponse] = await Promise.all([
                fetch(geneMasterUrl),
                fetch(lookupDataUrl)
            ]);

            if (!geneMasterResponse.ok) throw new Error(`HTTP ${geneMasterResponse.status} for master database`);
            
            const masterData = await geneMasterResponse.json();
            const rawLookupData = lookupDataResponse.ok ? await lookupDataResponse.json() : {};
            
            const ciliaryGeneArray = Array.isArray(masterData.masterData) ? masterData.masterData : masterData;
            window.allGenes = ciliaryGeneArray;
            const validGenes = ciliaryGeneArray.filter(gene => gene && (gene.Gene || gene.gene));

            // Populate Gene Map (using mock data for successful plotting in the absence of external access)
            window.ciliaryGeneMap = new Map(validGenes.map(gene => [(gene.Gene || gene.gene).toUpperCase(), gene]));
            
            // Fallback: If map is empty due to fetch failure, use MOCK data for plotting demo
            if (window.ciliaryGeneMap.size === 0) {
                 window.ciliaryGeneMap = new Map(Object.entries(MOCK_GENE_DATA).map(([k, v]) => [k, v]));
                 window.log("Using MOCK gene data for plotting demonstration.");
            }

            window.CiliAI.lookups.geneMap = window.ciliaryGeneMap;
            window.log(`Successfully mapped ${window.ciliaryGeneMap.size} genes.`);

            // CRITICAL STEP: Load separate expression data in parallel
            await loadPlotExpressionDataForHeatmap();

        } catch (error) {
            console.error("Failed to load required analysis data:", error);
            window.alert(`Error: The main gene database failed to load. Using MOCK data for plotting. Reason: ${error.message}`);
             window.ciliaryGeneMap = new Map(Object.entries(MOCK_GENE_DATA).map(([k, v]) => [k, v]));
        }
    }


    async function generateAnalysisPlots() {
        if (typeof window.ciliaryGeneMap === 'undefined' || window.ciliaryGeneMap.size === 0) {
            console.warn("Gene data map is empty, reloading data.");
            await loadAllData();
            if (window.ciliaryGeneMap.size === 0) {
                 document.getElementById('plot-display-area').innerHTML = '<p style="padding: 20px;"><strong>Error:</strong> Failed to load gene database for plotting.</p>';
                 return;
            }
        }

        const plotContainer = document.getElementById('plot-display-area');
        plotContainer.innerHTML = '<em>Searching genes and generating plot...</em>';
        clearAllPlots('plot-display-area');

        const rawInput = document.getElementById('ciliaplot-genes-input').value;
        const originalQueries = rawInput.split(/[\s,;\n\r\t]+/).filter(Boolean);
        
        if (originalQueries.length === 0) {
            plotContainer.innerHTML = 'Please enter at least one gene.';
            updateGeneSummaryTable([], []);
            return;
        }

        const { foundGenes } = findAndMergeGenes(originalQueries); 
        
        updateGeneSummaryTable(originalQueries, foundGenes);

        if (foundGenes.length === 0) {
            plotContainer.innerHTML = 'None of the provided genes were found in the CiliaHub database.';
            return;
        }

        const selectedRadio = document.querySelector('input[name="ciliaplot_type"]:checked');
        const plotType = selectedRadio ? selectedRadio.value : 'phylogeny_nevers';
        const custom = getPlotCustomization(plotType);

        // --- Plotting Switch ---
        const isPhylogenyPlot = plotType.includes('phylogeny'); 
        const source = plotType.includes('li') ? 'li' : 'nevers';

        if (isPhylogenyPlot) {
            custom.phylogenySource = source;
            renderPhylogenyData(foundGenes, source, custom); 
            return; 
        }

        switch (plotType) {
            case 'expression_heatmap': renderExpressionHeatmap({}, foundGenes); break;
            case 'enrichment_bubble': renderEnrichmentBubblePlot(foundGenes, custom); break;
            case 'network': renderComplexNetwork(foundGenes, plotContainer, custom); break;
            case 'multi_category_manhattan': renderMultiCategoryPlot(foundGenes, custom); break;
            case 'screen_summary_heatmap': renderScreenSummaryHeatmap(foundGenes, custom); break;
            case 'cilia_effects_scatter': renderCiliaEffectsScatterPlot(foundGenes, custom); break;
            case 'ortholog_heatmap': renderOrthologHeatmap(foundGenes, custom); break; 
            case 'lof_cilia_vs_count_scatter': renderLofDualEffectPlot(foundGenes, custom); break; 
            default: plotContainer.innerHTML = 'This plot type is not yet implemented or has been removed.';
        }
    }


    // =============================================================================
    // INITIALIZATION & VIEW MANAGEMENT
    // =============================================================================

    function initializeCiliaPlotPage() {
        loadAllData();

        populatePlotTypes();
        document.getElementById('ciliaplot-type-selector').addEventListener('change', updateCustomizationPanel);
        document.getElementById('generate-ciliaplot-btn').addEventListener('click', generateAnalysisPlots);
        document.getElementById('download-plot-btn').addEventListener('click', downloadPlot);
        
        updateCustomizationPanel(); 
        generateAnalysisPlots(); 
    }
