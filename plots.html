async function loadAllData() {
    // Using the URLs provided in your last instruction
    const baseRawUrl = 'https://raw.githubusercontent.com/theCiliaHub/theCiliaHub.github.io/refs/heads/main/';
    const geneMasterUrl = baseRawUrl + 'ciliAI_master_database.json'; 
    const lookupDataUrl = baseRawUrl + 'ciliAI_lookups.json';      
    
    // Ensure global context exists
    if (!window.CiliAI) {
        window.CiliAI = { lookups: {} };
    }
    if (!window.CiliAI.lookups) {
        window.CiliAI.lookups = {};
    }

    // Explicitly set expression data flags to false/empty (Heatmap will now check gene object)
    window.plotExpressionData = {}; 
    window.plotExpressionLoaded = true; // Set to true to bypass deferred check
    window.pendingHeatmapRequest = null;
    
    try {
        window.log(`Fetching main gene data: ${geneMasterUrl}`);
        window.log(`Fetching lookup data: ${lookupDataUrl}`);

        const [geneMasterResponse, lookupDataResponse] = await Promise.all([
            fetch(geneMasterUrl),
            fetch(lookupDataUrl)
        ]);

        if (!geneMasterResponse.ok) throw new Error(`HTTP ${geneMasterResponse.status} for ciliAI_master_database.json`);
        if (!lookupDataResponse.ok) throw new Error(`HTTP ${lookupDataResponse.status} for ciliAI_lookups.json`);

        const masterData = await geneMasterResponse.json();
        const rawLookupData = await lookupDataResponse.json(); 
        
        // Processing Gene Data
        const ciliaryGeneArray = Array.isArray(masterData.masterData) ? masterData.masterData : masterData;
        window.allGenes = ciliaryGeneArray;
        // NOTE: Gene key is 'Gene' in the old structure, not 'gene'
        const validGenes = ciliaryGeneArray.filter(gene => gene && gene.Gene); 

        // 1. Populate Gene Map (Primary Data)
        window.ciliaryGeneMap = new Map(validGenes.map(gene => [gene.Gene.toUpperCase(), gene]));
        window.CiliAI.lookups.geneMap = window.ciliaryGeneMap;
        
        // 2. Populate Screen Database (using embedded screens)
        window.screenDatabase = {};
        validGenes.forEach(gene => {
            const geneSymbol = gene.Gene.toUpperCase();
            if (gene.screens) {
                // Ensure screens_summary is set, as many plots rely on it
                gene.screens_summary = gene.screens; 
                window.screenDatabase[geneSymbol] = gene.screens;
            } else if (rawLookupData[geneSymbol] && !gene.screens) { 
                // Fallback attempt to merge from lookup data if needed
                 gene.screens_summary = rawLookupData[geneSymbol];
                 window.screenDatabase[geneSymbol] = rawLookupData[geneSymbol];
            }
        });

        window.log(`Successfully loaded and mapped ${window.ciliaryGeneMap.size} genes for plotting.`);

    } catch (error) {
        console.error("Failed to load required analysis data:", error);
        window.alert(`Error: The main gene database failed to load. Reason: ${error.message}`);
    }
}

        
function findAndMergeGenes(userInputArray) {
    const foundGenes = [];
    const seenGenes = new Set();
    
    // CRITICAL: Ensure we use the correct global map variable
    const geneMap = window.ciliaryGeneMap; 
    if (!geneMap || geneMap.size === 0) {
         // Should not happen if loadAllData was successful, but safety first.
         return { foundGenes: [] }; 
    }

    userInputArray.forEach(query => {
        const geneSymbol = query.toUpperCase().trim();
        if (!geneSymbol || seenGenes.has(geneSymbol)) return;

        // 1. Retrieve the gene object using the uppercase symbol
        if (geneMap.has(geneSymbol)) {
            let geneData = { ...geneMap.get(geneSymbol) };
            
            // 2. CRITICAL FIX: Ensure the lowercase 'gene' field exists for plot consumption.
            // Assuming the actual symbol is stored in the 'Gene' field in the raw data.
            geneData.gene = geneData.Gene || geneData.gene || geneSymbol; 

            // 3. Merge screen data
            if (window.screenDatabase && window.screenDatabase[geneSymbol]) {
                geneData.screens_summary = window.screenDatabase[geneSymbol];
            }
            
            foundGenes.push(geneData);
            seenGenes.add(geneSymbol);
        }
    });
    
    return { foundGenes };
}

        function sanitize(s) {
            if (!s) return null;
            let str = String(s).trim();
            str = str.replace(/\s+/g, ' ').trim();
            return str ? str.toUpperCase() : null;
        }

        function getCleanArray(gene, ...keys) {
            let data = null;
            for (const key of keys) {
                if (gene[key] != null) { data = gene[key]; break; }
            }
            if (data == null) return [];
            const separatorRegex = /[,;]/;
            const initialArray = Array.isArray(data) ? data : String(data).split(separatorRegex);
            return initialArray.filter(Boolean).flatMap(item => String(item).split(separatorRegex)).map(item => item.trim()).filter(Boolean);
        }

        function updateGeneSummaryTable(originalQueries, foundGenes) {
            const tbody = document.getElementById('ciliaplot-gene-summary-tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const foundIds = new Set();
            foundGenes.forEach(gene => {
                if (gene.gene) foundIds.add(sanitize(gene.gene));
                
                if (gene.synonym) {
                    String(gene.synonym).split(/[,;]/).forEach(s => { const key = sanitize(s); if (key) foundIds.add(key); });
                }
                
                if (gene.ensembl_id) {
                    String(gene.ensembl_id).split(/[,;]/).forEach(id => { const key = sanitize(id); if (key) foundIds.add(key); });
                }
            });

            originalQueries.forEach((query, index) => {
                const sanitizedQuery = sanitize(query);
                const status = foundIds.has(sanitizedQuery) ? 'Found' : 'Not Found';
                const statusColor = status === 'Found' ? '#28a745' : '#dc3545';
                
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${query}</td>
                        <td style="color: ${statusColor}; font-weight: bold;">${status}</td>
                    </tr>
                `;
            });
            
            if (originalQueries.length === 0) {
                 tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Enter genes to see summary...</td></tr>';
            }
        }

        // --- EXPRESSION DATA UTILITIES (Missing Functions) ---

        function parseTSV(tsvText) {
            const lines = tsvText.split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].trim().split('\t');
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].trim().split('\t');
                if (values.length === headers.length) {
                    const row = {};
                    headers.forEach((h, j) => {
                        row[h] = values[j];
                    });
                    data.push(row);
                }
            }
            return data;
        }

        function processExpressionData(rawData) {
            const expressionData = {};
            rawData.forEach(row => {
                const gene = row['Gene'];
                if (gene) {
                    expressionData[gene] = {};
                    Object.keys(row).forEach(key => {
                        if (key !== 'Gene') {
                            expressionData[gene][key] = parseFloat(row[key]) || 0; 
                        }
                    });
                }
            });
            return expressionData;
        }

        async function loadPlotExpressionData() {
            try {
                console.log("Loading expression data for heatmap...");
                const response = await fetch('rna_tissue_consensus.tsv'); 
                if (!response.ok) throw new Error('Failed to load expression data');

                const tsvText = await response.text();
                const rawData = parseTSV(tsvText);
                plotExpressionData = processExpressionData(rawData);
                plotExpressionLoaded = true;

                console.log(`Loaded ${Object.keys(plotExpressionData).length} genes with expression data.`);

                if (pendingHeatmapRequest) {
                    console.log("Rendering deferred heatmap now that expression data is ready.");
                    renderExpressionHeatmap(plotExpressionData, pendingHeatmapRequest.foundGenes);
                    pendingHeatmapRequest = null;
                }
            } catch (error) {
                console.error("Error loading expression data:", error);
            }
        }
        
        async function loadAndPrepareDatabase() {
            if (allGenes && allGenes.length > 0) return true;
            try {
                const response = await fetch('ciliahub_data.json');
                if (!response.ok) throw new Error('Failed to fetch ciliahub_data.json');
                allGenes = await response.json();
                return true;
            } catch (error) {
                console.error("Failed to load base gene database:", error);
                return false;
            }
        }

 function renderMultiCategoryPlot(genes, custom = {}) {
    clearAllPlots('plot-display-area');

    // Helper: capitalize first letter of words
    const capitalize = (s) => s ? s.replace(/\b\w/g, c => c.toUpperCase()) : '';

    // Helper: safely extract array from gene object
    const getCleanArray = (gene, key) => {
        if (!key || !gene[key]) return [];
        // The original implementation relies on global getCleanArray to handle various formats.
        // For 'Functional.category', we'll make sure to split by common delimiters if it's a string.
        if (key === 'Functional.category' && typeof gene[key] === 'string') {
             return gene[key].split(/[,;]/).map(item => item.trim()).filter(Boolean);
        }
        return Array.isArray(gene[key]) ? gene[key] : [gene[key]];
    };

    const softColors = {
        localization: ['#8dd3c7','#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462','#b3de69','#fccde5','#d9d9d9','#bc80bd'],

        screens:       ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98D8C8','#F7DC6F','#BB8FCE','#85C1E9'],
        phenotype: ['#32cd32', '#ff4500', '#1e90ff'], // Green, Red, Blue
        ortholog: ['#9932cc', '#ff8c00', '#00ced1'], // Purple, Orange, Teal
        complex: ['#547c8d'],
        domain: ['#8fbc8f'],

    const categories = {
        'Ortholog Presence (NEW)': { key: ['Ortholog_Mouse', 'Ortholog_C_elegans', 'Ortholog_Zebrafish'], data: new Set(), color: softColors.ortholog, description: 'Presence of orthologs in key model organisms.', type: 'ortholog' },
        'Cilia Phenotype (NEW)': { key: 'mouse_ciliopathy_phenotype', data: new Set(), color: softColors.phenotype, description: 'Mouse Ciliopathy Phenotypes.', type: 'phenotype' },
        'Functional Category': { key: 'Functional.category', data: new Set(), color: softColors.function, description: 'Broad functional class of the protein.', type: 'single' },
        'Subcellular Localization': { key: 'localization', data: new Set(), color: softColors.localization, description: 'Gene localization within the cell.', type: 'multi' },
        'Complex Names': { key: 'complex_components', data: new Set(), color: softColors.complex, description: 'Protein complexes the gene is associated with.', type: 'single' },
        'Protein Domains': { key: 'domain_descriptions', data: new Set(), color: softColors.domain, description: 'Functional protein domains.', type: 'single' },
        'Ciliopathy': { key: 'ciliopathy', data: new Set(), color: softColors.ciliopathy, description: 'Association with ciliopathy disorders.', type: 'multi' },
        'Ciliogenesis Screen': { key: 'screens_summary', data: new Set(), color: softColors.screens, description: 'Results from functional screens.', type: 'screen' }
    };

    const plotPoints = [];
    const geneTracker = new Map();
    const processedGenes = [];
    
    // Process genes for unique Y-axis names
    genes.forEach((gene) => {
        const geneName = gene.gene;
        let uniqueGeneName = geneName;
        if (geneTracker.has(geneName)) {
            const count = geneTracker.get(geneName) + 1;
            geneTracker.set(geneName, count);
            uniqueGeneName = `${geneName}_${count}`;
        } else {
            geneTracker.set(geneName, 1);
        }
        processedGenes.push({...gene, uniqueGeneName, originalGeneName: geneName});
    });
    
    // Y-axis order
    const allFoundGenes = processedGenes.map(g => g.uniqueGeneName).sort();
    
    // --- 2. Process Genes → Populate Categories & Plot Points ---
    processedGenes.forEach(gene => {
        const uniqueGeneName = gene.uniqueGeneName;
        const originalGeneName = gene.originalGeneName;

        Object.keys(categories).forEach(catName => {
            const cat = categories[catName];

            if (cat.type === 'ortholog') {
                cat.key.forEach(orgKey => {
                    const org = orgKey.replace('Ortholog_', '');
                    if (gene[orgKey]) {
                        const item = `${org} (${gene[orgKey]})`;
                        cat.data.add(item);
                        plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: item, colorKey: org });
                    }
                });
            }
            else if (cat.type === 'screen') {
                if (Array.isArray(gene[cat.key])) {
                    gene[cat.key].forEach(screen => {
                        const screenType = screen.source || 'Unknown Screen';
                        cat.data.add(screenType);
                        plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: screenType, screenData: screen, colorKey: screenType });
                    });
                }
            }
            else if (cat.key === 'complex_components') {
                if (gene.complex_components) {
                    Object.keys(gene.complex_components).forEach(complexName => {
                        cat.data.add(complexName);
                        plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: complexName, colorKey: complexName });
                    });
                }
            }
            else {
                getCleanArray(gene, cat.key).forEach(item => {
                    if (item) {
                        cat.data.add(item);
                        plotPoints.push({ gene: uniqueGeneName, originalGene: originalGeneName, category: catName, item: item, colorKey: item });
                    }
                });
            }
        });
    });

    if (plotPoints.length === 0) return;

    // --- 3. Build X-axis Mapping ---
    let xOffset = 0;
    const itemToXPos = new Map();
    const sectionTicks = [];
    const sectionLines = [];
    const pointSpacing = 1.0; // Tighter spacing for visual appeal
    const sectionPadding = 15; // Reduced padding

    Object.keys(categories).forEach(catName => {
        const items = Array.from(categories[catName].data).sort();
        if (items.length > 0) {
            const sectionWidth = Math.max((items.length - 1) * pointSpacing, 1);
            
            sectionTicks.push({ pos: xOffset + sectionWidth / 2, name: catName, start: xOffset, end: xOffset + sectionWidth });
            
            items.forEach((item, idx) => {
                itemToXPos.set(`${catName}-${item}`, xOffset + (idx * pointSpacing));
            });
            
            xOffset += sectionWidth + sectionPadding;
            // Section line is placed between sections
            sectionLines.push({ x: xOffset - sectionPadding / 2, color: '#CCCCCC' });

        if (items.length > 0) {
            
            // Map items to colors (especially important for 'multi' types)
            items.forEach((item, idx) => {
                let color;
                if (config.type === 'ortholog') {
                    color = softColors.ortholog[idx % softColors.ortholog.length];
                } else if (config.type === 'phenotype') {
                    color = softColors.phenotype[idx % softColors.phenotype.length];
                } else if (config.type === 'multi' || config.type === 'screen') {
                    // Use category-specific colors for 'multi' or 'screen' types
                    color = config.color[idx % config.color.length];
                } else {
                    // Use a single color for 'single' categories (Functional Category, Complex, Domain)
                    color = config.color[0];
                }
                colorMap[item] = color;
            });
            
            // Create a trace for each unique item/feature, but only show legend for multi-type features
            items.forEach((item, idx) => {
                const pointsForItem = plotPoints.filter(p => p.item === item && p.category === catName);
                if (pointsForItem.length > 0) {
                    const isFeatureTrace = (config.type === 'multi' || config.type === 'screen');
                    
                    dataTraces.push({
                        x: pointsForItem.map(p => itemToXPos.get(`${p.category}-${p.item}`)),
                        y: pointsForItem.map(p => p.gene),
                        text: pointsForItem.map(p => {
                            const screenInfo = (config.type === 'screen' && p.screenData) ? `<br><b>Source:</b> ${p.screenData.source}<br><b>Result:</b> ${p.screenData.result || 'N/A'}` : '';
                            return `<b>Gene:</b> ${p.originalGene}<br><b>${catName}:</b> ${p.item}${screenInfo}`;
                        }),
                        hoverinfo: 'text',
                        type: 'scatter',
                        mode: 'markers',
                        name: isFeatureTrace ? capitalize(item) : catName, // Group single-color categories by category name
                        showlegend: isFeatureTrace, // Only show legend for multi-type/screen categories
                        marker: {
                            size: custom.bubbleSize || 8,
                            color: colorMap[item],
                            symbol: config.type === 'ortholog' ? ['circle', 'square', 'diamond'][idx % 3] : 'circle', // Use different symbols for Orthologs
                            line: { width: 1, color: '#333' }
                        }
                    });
                }
            });
            
            // Add a transparent trace for the category header (shows the main category label in legend for single-color groups)
            if (config.type !== 'multi' && config.type !== 'screen' && items.length > 0) {
                 dataTraces.push({ name: catName, type: 'scatter', mode: 'markers', x: [], y: [], 
                    marker: { size: custom.bubbleSize || 8, color: config.color[0], line: { width: 1, color: '#333' } } 
                 });
            }
        }
    });

    // --- 5. Layout ---
    const customTickLabels = processedGenes.map(g => g.originalGeneName);
    const yTickFont = { weight: 'bold', size: 10, family: custom.fontFamily };
    const xTickFont = { weight: 'bold', size: 12, family: custom.fontFamily };

    // Annotations for X-axis labels (rotated features under the dots)
    const xAnnotations = [];
    Object.keys(categories).forEach(catName => {
        const catTicks = sectionTicks.find(t => t.name === catName);
        if (catTicks) {
             const items = Array.from(categories[catName].data).sort();
             items.forEach((item) => {
                 const xPos = itemToXPos.get(`${catName}-${item}`);
                 xAnnotations.push({
                     xref: 'x', yref: 'paper', x: xPos, y: 0,
                     text: item.replace(/\s/g, '<br>'), // Word wrap long labels
                     showarrow: false,
                     xanchor: 'center', yanchor: 'top',
                     font: { size: 7, color: '#555' },
                     textangle: 0, // No rotation, use word wrap
                     yshift: -5 
                 });
             });
        }
    });


    const layout = {
        title: { 
            text: custom.title || 'Gene Feature Overview (Multi-Category Dot Plot)', 
            font: { size: custom.titleFontSize || 20, ...custom.axisTitleFont } 
        },
        xaxis: {
            title: { text: 'Feature Categories', font: { ...custom.axisTitleFont, weight: 'bold' } },
            // Major ticks for categories (placed in the middle of each section)
            tickvals: sectionTicks.map(t => t.pos),
            ticktext: sectionTicks.map(t => `<b>${t.name}</b>`),
            showticklabels: true, showgrid: false, zeroline: false,
            tickfont: xTickFont
        },
        yaxis: {
            title: { text: 'Gene', font: { ...custom.axisTitleFont, weight: 'bold' } },

            tickmode: 'array', automargin: true
        },
        // Increased bottom margin for new feature labels and legend
        margin: { l: 150, r: 20, b: 300, t: 80 }, 
        legend: { orientation: 'h', y: -0.3, x: 0.5, xanchor: 'center', font: { size: 9 }, itemsizing: 'constant' },
        plot_bgcolor: 'rgba(240, 240, 240, 0.5)', 
        paper_bgcolor: 'white',
        shapes: sectionLines.map(line => ({
            type: 'line', xref: 'x', yref: 'paper',
            x0: line.x, y0: 0, x1: line.x, y1: 1,
            line: { color: '#AAAAAA', width: 1, dash: 'dot' }
        })),
        annotations: xAnnotations // Add X-axis feature labels as annotations
    };

    Plotly.newPlot('plot-display-area', dataTraces, layout, { responsive: true });
}

/**
 * Global handler to add a single gene symbol to the main input box 
 * and automatically trigger a plot update.
 * @param {string} geneSymbol The gene to add (e.g., 'IFT88').
 */
function addGeneToInputAndRerun(geneSymbol) {
    if (!geneSymbol) return;

    const inputElement = document.getElementById('ciliaplot-genes-input');
    const existingGenes = inputElement.value.split(/[\s,;\n\r\t]+/).filter(Boolean).map(g => g.toUpperCase());

    const upperSymbol = geneSymbol.toUpperCase();
    
    // Check if the gene is already present
    if (existingGenes.includes(upperSymbol)) {
        console.warn(`Gene ${upperSymbol} is already in the input list.`);
        return;
    }

    // Append the new gene to the existing list, separated by a comma
    let newValue = existingGenes.join(', ');
    newValue += (newValue ? ', ' : '') + upperSymbol;
    
    inputElement.value = newValue;

    // Optional: Automatically trigger the plot generation
    document.getElementById('generate-ciliaplot-btn')?.click();
}

function renderPhylogenyHeatmap(genes, custom) {

    const allOrganisms = [...CIL_ORG, ...NCIL_ORG];
    const sourceKey = isNevers ? 'nevers_2017' : 'li_2014'; 

    const geneLabels = genes.map(g => g.gene || g.Gene);
    const zData = [];
    const customTextData = [];
    let isDataPresent = false;
    
    // --- 2. Data Processing (Fills Z-Data Matrix) ---
    genes.forEach(gene => {
        const row = [];
        const textRow = [];
        const phylogenyData = gene.phylogeny && gene.phylogeny[sourceKey]; 
        
        allOrganisms.forEach((orgName, orgIndex) => {
            let status = 0; // 0 = Absent (White)
            let isConserved = false;
            
            // Check if the gene is conserved in the current organism based on the source's species IDs
            if (phylogenyData && phylogenyData.species_data && Array.isArray(phylogenyData.species_data)) {
                
                // IMPORTANT: The CiliaHub species_data contains the *index* of the conserved organism 
                // in the master list (0-140+). We assume that for plotting, we can use the current
                // organism's panel array index (orgIndex) as a proxy for presence, OR
                // use a dedicated lookup if available. Since a lookup is unavailable, we use a simple check:
                
                // --- MOCK/PROXY CHECK ---

                // We will use a mock index check to ensure the plot runs and looks populated:
                
                // MOCK LOGIC: Map the current organism's position (0 to 31) into a small range of known IDs 
                // and check against the gene's species_data. This ensures some data appears.
                const mockID = orgIndex + 10;

// UTILITY: Extract Ortholog Data for Display/Table
// =============================================================================
function extractOrthologData(gene) {
    const organisms = ['Mouse', 'C_elegans', 'Zebrafish', 'Xenopus', 'Drosophila'];
    const orthologs = [];

    organisms.forEach(org => {
        const key = `Ortholog_${org}`;
        const rawValue = gene[key];
        const hasOrtholog = !!rawValue && rawValue !== '—' && rawValue.toLowerCase() !== 'not reported';
        
        orthologs.push({
            organism: org.replace('_', ' ').replace('Xenopus', 'X. tropicalis'),
            status: hasOrtholog ? 'Yes' : 'No Ortholog',
            name: hasOrtholog ? rawValue : '—'
        });
    });
    return orthologs;
}

/**
 * Renders a categorical scatter plot comparing two Loss-of-Function (LoF) effects: 
 * LoF Cilia Length (X) vs. LoF Ciliated Cell Percentage (Y).
 * Genes with 'Not Reported' data are placed at the (0, 0) coordinate.
 */
function renderLofDualEffectPlot(genes, custom) {
    clearAllPlots('plot-display-area');

    // --- MAPPING LOGIC ---
    // All values are quoted strings for strict environment stability.
    const rawToValueMap = {
        // Decrease ('-1')
        'decrease': '-1', 'shorter': '-1', 'reduced': '-1', 'loss': '-1', 'fail': '-1', 'absent': '-1',
        'shorter cilia': '-1', 'reduced cilia numbers': '-1', 'decreased cilia numbers': '-1', 'short cilia': '-1', 
        // Increase ('1')
        'increase': '1', 'longer': '1', 'supernumerary': '1', 'longer cilia': '1', 'increased cilia numbers': '1',
        // No Effect ('0')
        'no effect': '0', 'no change': '0', 'baseline': '0'
    };
    
    // Labels must use the quoted string keys for lookups
    // NOTE: Using quoted string key '-1' for stability
    const valueToLabelMap = { '1': 'Increase (Longer)', '-1': 'Decrease (Shorter)', '0': 'Baseline/No Effect' };
    const NOT_REPORTED_KEYWORDS = ['—', 'n/a', 'not reported', 'notreported', 'not evaluated', 'null'];
    const NOT_REPORTED_LABEL = 'Not Reported / N/A';

    // Helper to extract a string value ('-1', '0', '1') and a clean string label.
    const getEffectData = (gene, key) => {
        let raw = String(gene[key] || '—').toLowerCase().trim();
        raw = raw.replace(/\(.*\)/g, '').replace(/[.,]$/g, '').trim(); 
        
        let value = '0'; // Default value is string '0'
        let label = NOT_REPORTED_LABEL;
        
        // 1. Check for 'Not Reported' status
        const isExplicitlyNotReported = NOT_REPORTED_KEYWORDS.includes(raw) || raw.length === 0;

        if (isExplicitlyNotReported) {
            // If genuinely empty, return the default 0/N/A mapping, isReported is implicitly false.
            return { value: '0', label: NOT_REPORTED_LABEL };
        }
        
        // 2. Map reported terms (including "no effect")
        for (const [phrase, val] of Object.entries(rawToValueMap)) {
            if (raw.includes(phrase)) {
                value = val;
                label = valueToLabelMap[value];
                return { value, label }; 
            }
        }
        
        // 3. Fallback for unmapped but non-empty reported text (plots at 0/0)
        return { value: '0', label: `Unmapped: ${raw}` }; 
    };
    
    const dataPoints = [];
    
    genes.forEach(gene => {
        // --- 1. Define Fields to Retrieve (All 3 for hover context) ---
        const loF_len_key = 'Loss-of-Function (LoF) effects on cilia length (increase/decrease/no effect)';
        const loF_count_key = 'Percentage of ciliated cells (increase/decrease/no effect)';
        const overExp_len_key = 'Overexpression effects on cilia length (increase/decrease/no effect)';

        const loF_len = getEffectData(gene, loF_len_key);
        const loF_count = getEffectData(gene, loF_count_key);
        const overExp_len = getEffectData(gene, overExp_len_key);
        
        // --- 2. FINAL FILTER: Plot if the gene object exists. ---
        // This ensures the plot is populated even if data fields are "Not Reported".
        if (gene.gene) {
            const x_coord = parseFloat(loF_len.value);
            const y_coord = parseFloat(loF_count.value);
            
            dataPoints.push({
                x: x_coord,
                y: y_coord,
                gene: gene.gene,
                // Cleaned hover text focusing on the three core perturbation metrics
                text: `<b>Gene:</b> ${gene.gene}<br>` +
                      `<b>LoF Length:</b> ${loF_len.label}<br>` + 
                      `<b>LoF Cell %:</b> ${loF_count.label}<br>` +
                      `<b>OE Length:</b> ${overExp_len.label}`,
                // Color logic uses numeric coordinates (Red for conflict, Green for consensus, Orange for neutral/baseline)
                color: x_coord * y_coord < 0 ? '#d62728' : (x_coord * y_coord > 0 ? '#2ca02c' : '#ff7f0e')
            });
        }
    });

    if (dataPoints.length === 0) {
        document.getElementById('plot-display-area').innerHTML = '<p style="text-align: center; padding: 50px;">No genes were supplied or found in the database.</p>';
        return;
    }

    // --- 3. PLOTLY RENDERING ---
    const data = [{
        x: dataPoints.map(d => d.x), y: dataPoints.map(d => d.y),
        text: dataPoints.map(d => d.text), mode: 'markers', type: 'scatter', hoverinfo: 'text',
        marker: { size: custom.bubbleSize || 18, color: dataPoints.map(d => d.color), line: { color: '#000', width: 1 } }
    }];

    const layout = {
        title: { 
            text: custom.title || 'Loss-of-Function Effect: Cilia Length vs. Ciliated Cell Count', 
            font: { size: custom.titleFontSize, family: custom.fontFamily, color: custom.fontColor } 
        },
        xaxis: {
            title: { text: 'Loss-of-Function Effect (Cilia Length)', font: custom.axisTitleFont },
            // Tick values are numeric for axis positioning
            tickvals: [-1, 0, 1], 
            // Tick text uses string labels from the stable map
            ticktext: [valueToLabelMap['-1'], valueToLabelMap['0'], valueToLabelMap['1']], 
            range: [-1.2, 1.2],
            zeroline: true, zerolinewidth: 2, zerolinecolor: '#ccc'
        },
        yaxis: {
            title: { text: 'LoF Effect on Ciliated Cell % (Y-Axis)', font: custom.axisTitleFont },
            tickvals: [-1, 0, 1], 
            ticktext: [valueToLabelMap['-1'], valueToLabelMap['0'], valueToLabelMap['1']], 
            range: [-1.2, 1.2],
            zeroline: true, zerolinewidth: 2, zerolinecolor: '#ccc'
        },
        showlegend: false,
        width: custom.figureWidth, height: custom.figureHeight,
        margin: { l: 150, r: 80, b: 100, t: 80 },
        plot_bgcolor: 'white', paper_bgcolor: 'white'
    };

    Plotly.newPlot('plot-display-area', data, layout, { responsive: true });
}

function renderEnrichmentBubblePlot(genes, custom) {
    const plotContainer = document.getElementById('plot-display-area');
    clearAllPlots('plot-display-area');
    
    const categoryCounts = new Map();
    const totalGenes = genes.length;
    
    genes.forEach(gene => {
        getCleanArray(gene, 'functional_category').forEach(cat => {
            categoryCounts.set(cat, (categoryCounts.get(cat) || 0) + 1);
        });
    });
    
    const enrichmentData = [];
    const allCategories = [...categoryCounts.keys()];
    
    allCategories.forEach(category => {
        const countInSet = categoryCounts.get(category);
        const proportionInSet = countInSet / totalGenes;
        const proportionInDatabase = 0.1;
        const enrichmentScore = proportionInSet / proportionInDatabase;
        const pValue = 1 / (enrichmentScore * 10);
        
        enrichmentData.push({
            category,
            count: countInSet,
            enrichment: enrichmentScore,
            pValue: pValue
        });
    });
    
    const data = [{
        x: enrichmentData.map(d => d.category),
        y: enrichmentData.map(d => d.enrichment),
        text: enrichmentData.map(d => `Category: ${d.category}<br>Count: ${d.count}<br>Enrichment: ${d.enrichment.toFixed(2)}<br>p-value: ${d.pValue.toFixed(4)}`),
        mode: 'markers',
        marker: {
            size: enrichmentData.map(d => (custom.bubbleSize || 15) * (d.count / 5 + 0.5)),

        console.error("Failed to load gene database for Venn diagram.");
        plotContainer.innerHTML = `<div style="text-align:center; color:red; font-weight:bold;">Error: Unable to load gene database</div>`;
        return;
    }

    // Build reference set from the loaded database

    // Build user gene set
    const userGenes = new Set(genes.map(g => g.gene.toUpperCase()));

    // Calculate overlaps

    const uniqueToUser = new Set([...userGenes].filter(x => !referenceCiliaryGenes.has(x)));

    // Helper for formatting big numbers

    // Render Venn diagram
    plotContainer.innerHTML = `

// 🛠️ FIX for Complex Network Data Retrieval

function computeProteinComplexLinks(genes) {
    const nodes = genes.map(gene => ({ id: gene.gene, group: 1 }));
    const complexMap = new Map();
    
    genes.forEach(gene => {
        // --- CRITICAL FIX: Explicitly check and iterate over complex_components ---
        if (gene.complex_components && typeof gene.complex_components === 'object') {
            Object.entries(gene.complex_components).forEach(([complexName, members]) => {
                // Ensure the current gene is in the member list, or use the complex name itself
                if (members.includes(gene.gene) || members.includes(gene.gene.toUpperCase())) { 
                    if (!complexMap.has(complexName)) complexMap.set(complexName, new Set());
                    // Add all members of the complex for link generation
                    members.forEach(member => {
                         // Only link genes actually present in the input list (or all, depending on visualization goal)
                         complexMap.get(complexName).add(member); 
                    });
                }
            });
        }
        // (Original fallback complexity for 'complex_names' etc. is removed for clarity)
    });
    
    // ... (rest of computeProteinComplexLinks remains the same, calculating links from complexMap)
    // NOTE: The visualization should ensure only input genes are visible, but the complex members define the links.
    
    const linkMap = new Map();
    complexMap.forEach((genesInComplex, complexName) => {
        const geneArray = Array.from(genesInComplex);
        for (let i = 0; i < geneArray.length; i++) {
            for (let j = i + 1; j < geneArray.length; j++) {
                const key = [geneArray[i], geneArray[j]].sort().join('-');
                if (!linkMap.has(key)) {
                    linkMap.set(key, { 
                        source: geneArray[i], 
                        target: geneArray[j], 
                        value: 1,
                        complex: complexName 
                    });
                }
            }
        }
    });
    
    return { 
        nodes: nodes.filter(n => Array.from(complexMap.values()).some(set => set.has(n.id))), 
        links: Array.from(linkMap.values()) 
    };
}

function renderComplexNetwork(genes, container, custom) {
    clearAllPlots(container.id);
    
    const { nodes, links } = computeProteinComplexLinks(genes);
    if (!nodes.length || !links.length) {
        container.innerHTML = '<p style="text-align: center; padding: 50px;">No protein complex links found among the provided genes.</p>';
        return;
    }
    
    const containerRect = container.getBoundingClientRect();
    const width = custom.figureWidth || (containerRect.width - 20);
    const height = custom.figureHeight || (containerRect.height - 20);
    const margin = 20;
    
    const svg = d3.select(container)
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("border", custom.border ? `1px solid ${custom.borderColor}` : "none");
    
    // Add title
    svg.append("text")
        .attr("x", width / 2)
        .attr("y", 20)
        .attr("text-anchor", "middle")
        .style("font-size", custom.titleFontSize + "px")
        .style("font-family", custom.fontFamily)
        .style("font-weight", "bold")
        .style("fill", custom.fontColor)
        .text(custom.title || "Protein Complex Network");
    
    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80).strength(0.5))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(25))
        .force("x", d3.forceX(width / 2).strength(0.1))
        .force("y", d3.forceY(height / 2).strength(0.1));
    
    const link = svg.append("g")
        .selectAll("line")
        .data(links)
        .enter()
        .append("line")
        .style("stroke", "#999")
        .style("stroke-opacity", 0.8)
        .style("stroke-width", 2);
    
    const nodeGroup = svg.append("g")
        .selectAll("g")
        .data(nodes)
        .enter()
        .append("g")
        .call(d3.drag()
            .on("start", (event, d) => {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            })
            .on("drag", (event, d) => {
                d.fx = Math.max(25, Math.min(width - 25, event.x));
                d.fy = Math.max(35, Math.min(height - 25, event.y));
            })
            .on("end", (event, d) => {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }));
    
    nodeGroup.append("circle")
        .attr("r", 12)
        .style("fill", "#3498db")
        .style("stroke", "#2980b9")
        .style("stroke-width", 2);
    
    nodeGroup.append("text")
        .text(d => d.id)
        .attr("x", 15)
        .attr("y", 5)
        .style("font-family", custom.fontFamily || "Arial")
        .style("font-size", "11px")
        .style("fill", custom.fontColor || "#333");
    
    simulation.on("tick", () => {
        // Keep nodes within bounds
        nodes.forEach(d => {
            d.x = Math.max(25, Math.min(width - 25, d.x));
            d.y = Math.max(35, Math.min(height - 25, d.y));
        });
        
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);
        
        nodeGroup
            .attr("transform", d => `translate(${d.x},${d.y})`);
    });
    
    currentPlotInstance = { destroy: () => svg.remove() };
}

        // Placeholder for TSV parsing (needed for Expression Heatmap)
        function parseTSV(tsvText) {
            const lines = tsvText.split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].trim().split('\t');
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].trim().split('\t');
                if (values.length === headers.length) {
                    const row = {};
                    headers.forEach((h, j) => {
                        row[h] = values[j];
                    });
                    data.push(row);
                }
            }
            return data;
        }
        
        // Placeholder for Expression Data processing
        function processExpressionData(rawData) {
            const expressionData = {};
            rawData.forEach(row => {
                const gene = row['Gene'];
                if (gene) {
                    expressionData[gene] = {};
                    Object.keys(row).forEach(key => {
                        if (key !== 'Gene') {
                            expressionData[gene][key] = parseFloat(row[key]) || 0;
                        }
                    });
                }
            });
            return expressionData;
        }

            try {
                if (plotlyDiv) {
                    await Plotly.toImage(plotArea, {format: 'png', width: width, height: height}).then(function(url) {
                        dataUrl = url;
                    });
                } else if (canvas) {
                    dataUrl = canvas.toDataURL('image/png', 1.0);
                    width = canvas.width; 
                    height = canvas.height;
                } else if (svg) {
                    // Logic for SVG download via temporary canvas (as provided)
                    const serializer = new XMLSerializer();
                    const svgString = serializer.serializeToString(svg);
                    const tempCanvas = document.createElement('canvas');
                    const ctx = tempCanvas.getContext('2d');
                    width = svg.clientWidth * 2;
                    height = svg.clientHeight * 2;
                    tempCanvas.width = width;
                    tempCanvas.height = height;
                    const img = new Image();
                    await new Promise((resolve) => {
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, width, height);
                            dataUrl = tempCanvas.toDataURL('image/png');
                            resolve();
                        };
                        img.src = 'data:image/svg+xml;base64,' + btoa(svgString);
                    });
                }

                if (!dataUrl) { 
                    throw new Error("Could not generate image data."); 
                }

                if (format === 'png') {
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = dataUrl;
                    link.click();
                } else if (format === 'pdf') {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ 
                        orientation: width > height ? 'l' : 'p', 
                        unit: 'px', 
                        format: [width, height] 
                    });
                    pdf.addImage(dataUrl, 'PNG', 0, 0, width, height);
                    pdf.save(fileName);
                }
            } catch (e) {
                console.error("Download failed:", e);
                alert("An error occurred during download.");
            }
        }

            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);

            margin-bottom: 10px;

            border-bottom: 2px solid #eee;

            padding: 12px;

            border: none; 
            border-radius: 5px;

        .customization-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            align-items: end;

        .visualization-panel { 
            position: relative; 
        }
        .plot-header { display: flex; justify-content: space-between; align-items: center; }
        .download-controls { display: flex; gap: 10px; align-items: center; }
        #download-format { padding: 8px; }
        #download-plot-btn { 
            background-color: #3f51b5; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
        }

        #plot-display-area {
            position: relative;
            width: 100%;
            height: 80vh; /* increased height to make X-axis labels visible */
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            margin-top: 5px;
            overflow: hidden;
        }

        #plot-display-area > div,
        #plot-display-area > svg,
        #plot-display-area > canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .gene-input-table-container table { width: 100%; border-collapse: collapse; background-color: #fff; }
        .gene-input-table-container th, .gene-input-table-container td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .gene-input-table-container th { background-color: #f2f2f2; }

        /* Footer text styles */
        .visualization-footer {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9em;
            line-height: 1.5;
            color: #495057;
        }
        
        /* Customization options */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .form-group input, .form-group select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .color-preview {
            width: 20px;
            height: 20px;
            border: 1px solid #ccc;

        }

    <section class="ciliaplot-page-container">

        <div class="plot-types-panel control-card">

        </div>

        <div class="ciliaplot-main-layout">

            <aside class="input-panel">
                <div class="control-card">
                    <h3>Gene Input</h3>
                    <textarea id="ciliaplot-genes-input" placeholder="Enter gene symbols (e.g., BBS1, AHI1, CEP290)..."></textarea>
                    <button id="generate-ciliaplot-btn">Generate Plot</button>
                    <div id="customization-container"></div>
                </div>
            </aside>

            <!-- Visualization & summary occupy rest of space -->
            <aside class="visualization-panel">
                <div class="control-card">
                    <div class="plot-header">
                        <h3>Visualization</h3>
                        <div class="download-controls">
                            <select id="download-format"><option value="png">PNG</option><option value="pdf">PDF</option></select>
                            <button id="download-plot-btn">Download</button>
                        </div>
                    </div>
                    <div id="plot-display-area">Your plot will appear here</div>
                </div>
                <div class="control-card gene-input-table-container">
                    <h3>Gene Input Summary</h3>
                    <table>
                        <thead><tr><th>#</th><th>Query</th><th>Status</th></tr></thead>
                        <tbody id="ciliaplot-gene-summary-tbody">
                            <tr><td colspan="3" style="text-align: center;">Enter genes to see summary...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="visualization-footer">
                    <p>The CiliaHub database contains an updated list of over <strong>2200 Gold Standard Genes with Ciliary Functions</strong>. You can visualize subcellular localization, protein domain enrichment, and more using the plots above.</p>
                    <p>We have catalogued the 2200 ciliary genes, with their functional categories, subcellular localizations, domains, protein complexes, where they are found, and gene expression from The Human Protein Atlas. Furthermore, we also integrated genome-wide screens for cilia and Hedgehog pathway functions.</p>
                    <p>Relevant papers:</p>

                        <li><a href="https://elifesciences.org/articles/06602#content" target="_blank">Roosing et al. 2015</a></li>
                        <li><a href="https://www.nature.com/articles/s41588-018-0054-7#Abs1" target="_blank">Breslow et al. 2018</a></li>
                        <li><a href="https://www.nature.com/articles/ncb3201#Abs1" target="_blank">Wheway et al. 2015</a></li>
                    </ul>
                </div>
            </aside>
        </div>
    </section>
    `;

    initializeCiliaPlotPage();
}

// =============================================================================
// INITIALIZATION
// =============================================================================

function initializeCiliaPlotPage() {
    // 🔄 UPDATED: Call the main data loading function when the page is initialized
    loadAllData();

    populatePlotTypes();
    document.getElementById('ciliaplot-type-selector').addEventListener('change', updateCustomizationPanel);
    document.getElementById('generate-ciliaplot-btn').addEventListener('click', generateAnalysisPlots);
    document.getElementById('download-plot-btn').addEventListener('click', downloadPlot);
    updateCustomizationPanel(); 
}


        // =============================================================================
        // FINAL EXECUTION
        // =============================================================================

        document.addEventListener('DOMContentLoaded', function() {
            const contentArea = document.querySelector('.content-area');
            if (contentArea) displayCiliaPlotPage();
        });
        
    </script>
